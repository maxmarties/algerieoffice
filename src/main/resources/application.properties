debug=false

# PRODUCTION
server.port=80
spring.profiles.active=prod
spring.mvc.favicon.enabled=false
server.servlet.session.timeout=30m
spring.devtools.add-properties=false

server.tomcat.compression=on
server.compression.enabled=true
server.compression.min-response-size=4096
server.compression.mime-types=text/html, text/xml, text/plain, text/css, text/javascript, application/javascript, application/json
logging.level.org.apache.tiles=ERROR
logging.level.org.hibernate=ERROR
# SCHEDULE second minute hour dayOfMonth month daysOfweek
purge.cron.expression=0 0 5 * * ?
purge.cron.alert.post=0 0 7 * * ?
purge.cron.alert.ads=0 10 7 * * ?
purge.cron.alert.event=0 20 7 * * ?
purge.cron.alert.jobs=0 30 7 * * ?
# RECAPTCHA GOOGLE
google.recaptcha.key.site=${GOOGLE_RECAPTCHA_SITE_KEY}
google.recaptcha.key.secret=${GOOGLE_RECAPTCHA_SECRET_KEY}
# I18N
spring.messages.encoding=UTF-8
spring.messages.basename=i18n/messages
# JPA / HIBERNATE
spring.jpa.show-sql=false
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL9Dialect
spring.jpa.open-in-view=false
spring.jpa.properties.jadira.usertype.autoRegisterUserTypes=true
# DATABASE prod
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
