message.premium.analytic = Vous bénéficiez actuellement d'un plan Free dans AlgérieOffice. Devenez Premium pour pouvoir accéder à un véritable outil d'analyse de votre trafic sur notre site.<br>Pour plus d'informations, veuillez consulter nos offres en détail dans la rubrique "Outils > Abonnement".
message.premium.communication = Vous bénéficiez actuellement d'un plan Free dans AlgérieOffice. Devenez Premium pour pouvoir consulter des interactions illimitées avec votre page, des demandes de devis, des messages écrits et plus encore.<br>Pour plus d'informations, veuillez consulter nos offres en détail dans la rubrique "Outils > Abonnement".
message.premium.appearance = Vous bénéficiez actuellement d'un plan Free dans AlgérieOffice. Devenez Premium pour pouvoir personnaliser l'apparence du thème graphique de votre page.<br>Pour plus d'informations, veuillez consulter nos offres en détail dans la rubrique "Outils > Abonnement".
message.premium.journal = Vous bénéficiez actuellement d'un plan Free dans AlgérieOffice. Devenez Premium pour accéder à l'activité complète des 180 derniers jours et filtrer les événements par plage de dates.<br>Pour plus d'informations, veuillez consulter nos offres en détail dans la rubrique "Outils > Abonnement".
message.premium.subscribe = Votre entreprise n'a pas encore été validée. Vous pouvez passer à un plan premium dès que la validation de votre entreprise sera effective.<br>Pour plus d'informations, veuillez consulter le statut de l'entreprise dans la section
message.premium.emailing = Votre entreprise n'a pas encore été validée. Vous pouvez diffuser votre newsletter dès que la validation de votre entreprise sera effective.<br>Pour plus d'informations, veuillez consulter le statut de l'entreprise dans la rubrique
message.premium.detect = Un abonnement Premium Regular minimum est requis pour accéder à la soultion Detect. Mettez à niveau votre plan pour prévisualiser les visites de vos pages au cours des 06 derniers mois et filtrer les événements par plage de dates.<br>Pour plus d'informations, consultez nos offres en détail dans la rubrique "Outils > Abonnement".
message.premium.analyse = Mettez au minimum votre plan d'abonnement à un plan premium Regular afin de débloquer des widgets d'analyse commerciale de premier plan. Cela augmente vos mesures d'analyse du trafic.<br>Pour plus d'informations, veuillez consulter nos offres en détail dans la rubrique "Outils > Abonnement".
message.premium.statistic = Vous bénéficiez actuellement d'un plan Free dans AlgérieOffice. Devenez Premium pour avoir un aperçu des statistiques de vos produits et améliorer votre trafic sur notre site.<br>Pour plus d'informations, veuillez consulter nos offres en détail dans la rubrique "Outils > Abonnement".
message.premium.dashboard = Vous bénéficiez actuellement d'un plan Free dans AlgérieOffice. Devenez Premium pour débloquer d'autres activités sur votre tableau de bord.<br>Pour plus d'informations, veuillez consulter nos offres en détail dans la rubrique "Outils > Abonnement".
message.premium.easylist = Vous bénéficiez actuellement d'un plan Free dans AlgérieOffice. Devenez Premium pour pouvoir consulter en illimitées les détails de vos listes enregistrées.<br>Pour plus d'informations, veuillez consulter nos offres en détail dans la rubrique "Outils > Abonnement".
