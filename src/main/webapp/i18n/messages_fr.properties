txt.infos.condition1.2 = Objet et acceptation des CGU
txt.infos.condition1.2.1 = Les CGU ont pour objet de définir les conditions dans lesquelles les commandes passées par les clients sont effectuées, quel que soit le type de commande, notamment par internet sur le site, par téléphone ou par tout autre moyen, et la fourniture de services par AlgérieOffice aux clients. Ces CGU sont complétées par les conditions spécifiques à chaque prestation.
txt.infos.condition1.2.2 = Les CGU et les conditions particulières peuvent être consultées sur le site et acceptées par le client avant la passation de la commande et/ou la création d'un compte. Le client s'engage à lire les CGU avant de passer commande. Le fait de passer commande implique l'acceptation immédiate, pleine et sans réserve du client des CGU et des conditions particulières.
txt.infos.condition1.2.3 = AlgérieOffice se réserve le droit de modifier les CGU et les conditions particulières à tout moment, notamment afin qu'ils reflètent toujours les fonctionnalités des services en cas de changement. Sauf stipulation contraire dans les conditions particulières, la version des CGU et les conditions particulières applicables à une commande sont celles en vigueur au moment où le client passe commande.
txt.infos.condition1.2.4 = AlgérieOffice se réserve le droit de modifier la liste des services proposés sur le site, de modifier, ajouter ou supprimer des services, sans que le client ne puisse prétendre à aucune indemnité.
txt.infos.condition1.3 = Usage professionnel
txt.infos.condition1.3.1 = Les prestations et commandes sont réservées aux professionnels et à un usage professionnel. Ils ne peuvent être utilisés que pour répondre à des besoins professionnels, à l'exclusion de toute utilisation à des fins privées ou personnelles.
txt.infos.condition1.4 = Compte client
txt.infos.condition1.4.1 = Pour commander et/ou utiliser certains services sur le site, le client doit disposer d'un compte actif. Les fonctionnalités et modules des services accessibles via le compte dépendent de la formule choisie par le client.
txt.infos.condition1.4.2 = Le client s'engage à assurer la confidentialité et la sécurité de son identifiant et de son mot de passe et à ne pas permettre à un tiers de les utiliser, ils sont strictement personnels et confidentiels. L'utilisation du compte et des identifiants est réservée au client. Il est seul responsable de l'usage qui est fait de son compte, de son identifiant et de son mot de passe.
txt.infos.condition1.4.3 = Le client s'engage à fournir des informations exactes et complètes sur son identité, ses coordonnées et autres informations qui seraient demandées par AlgérieOffice. Il s'engage à les mettre à jour sans délai sur le site en cas de modification, au moyen de son compte. Il sera seul responsable des conséquences de l'inexactitude des informations fournies. Il est strictement interdit d'usurper l'identité d'un tiers.
txt.infos.condition1.5 = Commande
txt.infos.condition1.5.1 = Avant de valider sa commande, le client a la possibilité de vérifier ses coordonnées et son prix total, notamment afin de pouvoir corriger d'éventuelles erreurs.
txt.infos.condition1.5.2 = AlgérieOffice se réserve le droit de refuser ou d'annuler toute commande d'un client avec lequel il existerait un litige relatif à une commande antérieure ou qui ne respecterait pas les conditions requises pour passer une commande, sans que ce dernier ne puisse prétendre à aucune indemnité.
txt.infos.condition1.6 = Garantie - Responsabilité
txt.infos.condition1.6.1 = AlgérieOffice ne garantit en aucun cas que les services répondent aux spécifications ou aux besoins du client. Le client doit s'assurer, préalablement à la commande et à l'utilisation des services, que les services répondent à ses besoins et il est seul responsable de l'adéquation des services à ses besoins, de la qualification de son personnel et de l'usage qu'il fait des résultats qu'il obtient.
txt.infos.condition1.6.2 = AlgérieOffice ne garantit pas que le fonctionnement du site, les services sont continus et sans erreur, AlgérieOffice peut interrompre l'accès à tout ou partie du site, aux services, notamment pour des raisons opérationnelles, de maintenance ou en cas d'urgence, sans que le client peut réclamer toute indemnité ou rechercher la responsabilité d'AlgérieOffice à cet égard.
txt.infos.condition1.6.3 = La responsabilité d'AlgérieOffice ne saurait être valablement engagée si le client n'a respecté aucune des obligations qui lui incombent en vertu des CGU, des conditions particulières ou de la législation et réglementation en la matière.
txt.infos.condition2.1 = Service après vente - Service client
txt.infos.condition2.1.1 = Un service après-vente dénommé "HOT-LINE" est à la disposition du client pour l'aider à résoudre les difficultés techniques de consultation ou de mise en œuvre des prestations qu'il a commandées. La HOT-LINE est un service disponible par assistance chat en direct et/ou par email.
txt.infos.condition2.1.2 = Une rubrique "Foire aux questions" est également disponible pour permettre au client de l'aider à résoudre ses difficultés techniques.
txt.infos.condition2.1.3 = Le service client d'AlgérieOffice est à la disposition du client pour obtenir des informations à caractère commercial et peut être contacté par e-mail.
txt.infos.condition2.2 = Maintenance, mise à jour et disponibilité des services
txt.infos.condition2.2.1 = Afin d'assurer une qualité de service constante, AlgérieOffice s'engage à mettre à jour le site et ses bases de données en modifiant, supprimant, ajoutant régulièrement des données.
txt.infos.condition2.2.2 = La permanence et la disponibilité du site sont assurées 24 heures sur 24, 7 jours sur 7 sauf en cas de maintenance corrective et / ou évolutive. En cas de dysfonctionnement lui imputable, AlgérieOffice s'engage à intervenir dans les plus brefs délais à partir du moment où elle en a eu connaissance.
txt.infos.condition2.3 = Cookies
txt.infos.condition2.3.1 = Le site utilise des cookies. Un cookie est un petit fichier texte déposé sur le terminal du client, principalement utilisé pour faciliter la navigation sur le site et pour identifier le client lorsqu'il se connecte à son compte. Le client a la possibilité d'accepter ou de refuser les cookies. La plupart des navigateurs Web acceptent automatiquement les cookies, mais le client peut généralement modifier les paramètres de son navigateur pour les refuser. Le client est informé que s'il refuse les cookies, il ne pourra pas accéder à certains services et notamment des services nécessitant l'identification du client.
txt.infos.faq = Questions et demandes générales fréquemment posées.
txt.infos.faq1 = Compte
txt.infos.faq1.1.1 = Comment créer mon compte ?
txt.infos.faq1.1.2 = La création d'un compte est gratuite sur AlgérieOffice. Il vous suffit de cliquer sur le bouton de menu "Connexion/Inscription" en haut à droite du site. Cliquez sur "Créer un compte" et remplissez le formulaire d'inscription.<br>Une fois votre compte créé, un e-mail vous est envoyé pour vérifier l'adresse e-mail saisie et confirmer votre inscription. Vous devez valider la création de votre compte pour pouvoir vous connecter.
txt.infos.faq1.2.1 = J'ai créé un compte, mais je n'ai pas reçu d'e-mail de validation
txt.infos.faq1.2.2 = N'oubliez pas de vérifier vos courriers indésirables. Il peut arriver que l'e-mail de validation arrive avec un certain retard.<br>Un message en bas de page vous permet de demander à nouveau l'envoi du mail de validation. Si, malgré cela, vous n'avez toujours pas reçu d'e-mail de validation dans les 24 heures suivant la création de votre compte ou après votre nouvelle demande, veuillez nous contacter.
txt.infos.faq1.3.1 = J'ai créé un compte, mais je ne parviens pas à me connecter
txt.infos.faq1.3.2 = Vous devez valider la création de votre compte à partir du mail de confirmation qui a été envoyé à l'adresse mail saisie.<br>Lorsque vous cliquez sur le bouton de validation dans l'email, la mention "Votre compte a été validé avec succès" ou "Votre compte est déjà validé" doit apparaître en haut de la page d'accueil d'AlgérieOffice.
txt.infos.faq1.4.1 = Comment puis-je me connecter à mon compte ?
txt.infos.faq1.4.2 = Pour vous connecter à votre compte, il vous suffit de cliquer sur le bouton de menu "Connexion/Inscription" en haut à droite du site. Cliquez sur "Se connecter" et entrez votre email et votre mot de passe pour vous connecter avec votre login ou vous connecter avec votre compte social (facebbok, google, linkedin).<br>Pour vous déconnecter, cliquez simplement sur votre profil en haut à droite puis cliquez sur le bouton "Se déconnecter".
txt.infos.faq1.5.1 = J'ai oublié mes identifiants
txt.infos.faq1.5.2 = Si vous oubliez votre mot de passe, accédez à la page de connexion de votre compte. Cliquez sur le lien "Mot de passe oublié ?" et entrez l'adresse e-mail fournie lors de l'inscription. Vous recevrez alors, par email, un lien valable 24h qui vous permettra de renouveler votre mot de passe.<br>Si vous avez également oublié l'adresse e-mail de connexion, veuillez nous contacter. 
txt.infos.faq1.6.1 = Je ne parviens pas à me connecter à mon compte. Mon nom d'utilisateur et mon mot de passe sont corrects
txt.infos.faq1.6.2 = Veuillez vérifier votre messagerie pour voir si votre compte a été signalé comme suspect ou restreint. En cas de violation des CGU, votre compte pourra être clôturé. Si vous aviez déjà un compte sur AlgérieOffice avec une violation, votre nouveau compte peut être restreint ou fermé.<br>Si vous pensez avoir été signalé par erreur, veuillez nous contacter.
txt.infos.faq1.7.1 = Comment changer mon mot de passe ou mes informations personnelles ?
txt.infos.faq1.7.2 = Pour modifier votre mot de passe ou vos informations personnelles, rendez-vous sur votre compte, sous "Mon compte" puis dans la rubrique "Informations de connexion" et vous pourrez modifier vos informations.
txt.infos.faq1.8.1 = Comment modifier mes coordonnées ?
txt.infos.faq1.8.2 = Depuis votre compte AlgériaOffice, vous pouvez modifier vos coordonnées depuis la rubrique "Mon compte" section "Coordonnées".
txt.infos.faq1.9.1 = Signaler un compte
txt.infos.faq1.9.2 = Pour signaler un compte, allez sur leur page de profil, cliquez sur les trois points dans le coin supérieur droit et sélectionnez "Signaler un utilisateur".
txt.infos.faq1.10.1 = Suppression de votre compte
txt.infos.faq1.10.2 = Allez dans la section "Paramètres" section "Général" de votre compte et cliquez sur le lien "Fermer définitivement votre compte". Votre compte sera supprimé et vous recevrez un e-mail de confirmation.<br>Si vous êtes un opérateur créant une société active sur AlgérieOffice, vous devez procéder à la suppression de la page de votre société afin de pouvoir supprimer votre compte par la suite. Une fois supprimé, votre compte ne peut pas être restauré et vous devez en créer un nouveau. Vous recevez un e-mail de confirmation lors de la suppression réussie de votre compte.
txt.infos.faq1.11.1 = Paramètres de messagerie et vérification
txt.infos.faq1.11.2 = Une adresse e-mail vérifiée vous permettra de recevoir des notifications système importantes, de réinitialiser votre mot de passe et de recevoir des mises à jour de votre compte.<br>Vous pouvez modifier vos préférences de notification par e-mail à tout moment en vous connectant à votre compte, en accédant à votre page "Notifications", à la section "Paramètres" et en ajustant vos notifications.
txt.infos.faq1.12.1 = Quelle est la politique en matière de cookies d'AlgérieOffice ?
txt.infos.faq1.12.2 = Pour vous assurer la meilleure expérience possible sur notre site, AlgérieOffice utilise différents types de cookies: des cookies indispensables à votre navigation, des cookies de trafic pour mesurer l'audience et des cookies de tiers ou d'éditeur pour vous proposer des contenus adaptés à vos centres d'intérêts.<br>Pour supprimer vos cookies, n'hésitez pas à consulter la procédure en vigueur selon votre navigateur sur la page de nos mentions légales.
txt.infos.faq1.13.1 = Comment puis-je accéder à mes données personnelles ?
txt.infos.faq1.13.2 = Conformément aux obligations légales, vous disposez d'un droit d'accès aux informations vous concernant en écrivant au siège social d'AlgérieOffice. Ces informations sont destinées à AlgérieOffice et peuvent faire l'objet d'un traitement informatique.
txt.infos.faq1.14.1 = Conditions d'utilisation
txt.infos.faq1.14.2 = Nous mettons à jour nos conditions générales d'utilisation afin de simplifier le fonctionnement des services d'AlgérieOffice pour nos utilisateurs.
txt.infos.faq1.15.1 = Que se passe-t-il si je n'accepte pas les CGU ?
txt.infos.faq1.15.2 = Si vous n'acceptez pas les conditions d'utilisation, vous devez supprimer votre contenu et cesser d'utiliser nos services.
txt.infos.faq2 = Entreprise
txt.infos.faq2.1.1 = Comment ajouter mon entreprise ?
txt.infos.faq2.1.2 = L'inscription de votre entreprise sur AlgérieOffice est gratuite. Si vous êtes nouveau sur AlgérieOffice, il vous suffit de cliquer sur le bouton de menu "Connexion/Inscription" en haut à droite du site. Cliquez sur "Ajouter mon entreprise" et suivez le processus d'inscription en 4 étapes faciles.<br>Sinon, si vous avez déjà un compte sur AlgérieOffice, depuis votre compte cliquez sur le bouton "Ajouter mon entreprise" en haut de la barre latérale de votre tableau de bord. Il vous suffit de renseigner les informations demandées.
txt.infos.faq2.2.1 = J'ai enregistré mon entreprise mais je ne la trouve pas dans les résultats de recherche
txt.infos.faq2.2.2 = Seules les entreprises validées par notre équipe de modérateurs seront visibles sur notre site. Pour rendre votre entreprise accessible au public, vous devez adresser une demande de validation de son identité depuis la console d'administration de votre entreprise en fournissant les informations nécessaires demandées. <br> Toute demande de validation doit justifier l'existence réelle d'une entreprise. En cas de doute, nous nous réservons le droit de demander des documents justifiant qu'il s'agit bien du gérant de la société, à savoir une preuve d'identité du gérant et un extrait du RC de la société. l'équipe met tout en œuvre pour que les demandes de validation soient traitées dans un délai d'un jour ouvrable. Dès que votre demande aura été traitée par nos services, vous en serez informé par notification.
txt.infos.faq2.3.1 = Comment ajouter des informations sur mon entreprise ?
txt.infos.faq2.3.2 = Grâce à l'inscription gratuite de votre entreprise sur notre site, vous bénéficiez d'un espace de contrôle (console d'administration) qui vous permet de gérer votre contenu. Vous êtes alors libre de mettre à jour la page de votre entreprise et de publier vos offres comme vous le souhaitez.<br>Cependant, toute modification de l'identité de l'entreprise implique l'envoi d'une nouvelle demande de validation.
txt.infos.faq2.4.1 = Puis-je ajouter des auteurs à mon entreprise ?
txt.infos.faq2.4.2 = Oui, vous avez la possibilité d'associer des utilisateurs à votre entreprise qui pourront également se connecter à la console d'administration de votre page. Pour cela, il vous suffit de créer un nouvel utilisateur depuis votre console, rubrique "Utilisateurs", ou d'inviter un utilisateur déjà inscrit sur le site.<br>Vous définissez ensuite son rôle, où chaque rôle a ces spécificités et droits d'accès. Par exemple, un utilisateur avec un rôle "Editeur" peut ajouter, modifier ou supprimer du contenu, mais ne peut pas ajouter un utilisateur ni accéder aux paramètres. Vous pouvez trouver plus d'informations sur les rôles des utilisateurs sur la page "Ajouter un utilisateur" de votre console.
txt.infos.faq2.5.1 = Comment rechercher une entreprise ?
txt.infos.faq2.5.2 = La recherche est effectuée sur toutes les pages du site à partir du champ de recherche situé en haut des pages. La recherche est effectuée sur la dénomination, le nom commercial, les mots clés, l'adresse et le nom des dirigeants. Vous pouvez également affiner votre recherche en accédant à la page de recherche avancée qui vous permettra d'utiliser des filtres sur des champs spécifiques.
txt.infos.faq2.6.1 = Puis-je mettre une entreprise sous alerte ?
txt.infos.faq2.6.2 = Si vous souhaitez être informé des changements qui pourraient survenir sur une ou plusieurs sociétés, vous avez la possibilité de les mettre en alerte. Ajoutez les entreprises que vous souhaitez à votre réseau et retrouvez-les dans votre compte, rubrique "Mon réseau" section "Entreprises".<br>Pour chaque entreprise, vous pouvez activer le bouton d'alerte. Lorsqu'il est vert, l'alerte est enregistrée. Vous recevrez alors une alerte par notification et/ou par mail à chaque évolution de l'entreprise: publication d'une actualité, modification d'une annonce, publication d'un événement, ... etc.<br>Vous pouvez arrêter votre veille à chaque fois que vous voulez en cliquant à nouveau sur le bouton d'alerte. 
txt.infos.faq2.7.1 = Comment affiner mon ciblage ?
txt.infos.faq2.7.2 = Il vous suffit d'appliquer les différents filtres qui s'offrent à vous pour affiner votre sélection: secteur d'activité, zone géographique, effectif ou type d'établissement ... vous définissez les types d'entreprises que vous souhaitez cibler. Plus votre ciblage est précis, plus votre sélection sera pertinente.
txt.infos.faq2.8.1 = À quoi correspondent les graphiques ?
txt.infos.faq2.8.2 = Ils permettent de visualiser sous forme de graphique la répartition des entreprises inscrites sur le site selon certains critères tels que la date de création, la taille des entreprises, les canaux de prospection ...<br>Les graphiques s'ajustent en fonction à la page de recherche consultée: secteur d'activité, profession, ville ... pour vous permettre d'analyser en détail l'étendue de votre prospection.
txt.infos.faq2.9.1 = Qu'est-ce que "Mon potentiel" ?
txt.infos.faq2.9.2 = "Mon potentiel" indique le nombre d'établissements correspondant à vos critères de recherche. Il s'ajuste au fur et à mesure que vous ciblez pour vous donner un aperçu du volume de votre sélection.
txt.infos.faq2.10.1 = Qu'est-ce que Detect ?
txt.infos.faq2.10.2 = Detect est une solution qui vous permet d'identifier les visiteurs de votre page commerciale en temps réel.
txt.infos.faq2.11.1 = Comment trouver les visiteurs identifiés ?
txt.infos.faq2.11.2 = Depuis la console d'administration de votre entreprise, rubrique "Tableau de bord", accédez à la section "Détect" pour voir les détails des visiteurs identifiés. Un abonnement minimum "Regular" doit être actif sur votre entreprise pour pouvoir bénéficier de la solution Détection.<br>Pour plus de détails, n'hésitez pas à consulter la page de nos offres.
txt.infos.faq2.12.1 = J'ai plus de visites que de visiteurs identifiés, comment est-ce possible ?
txt.infos.faq2.12.2 = Avoir plus de visites que de visiteurs identifiés est tout à fait possible et normal. Cette différence peut avoir 2 possibilités: un visiteur identifié peut être à l'origine de plusieurs visites, ou un visiteur anonyme non identifiable.<br>Notez qu'un opérateur d'une entreprise ne sera pas comptabilisé comme une visite sur sa page.
txt.infos.faq2.13.1 = Avez-vous un besoin particulier ?
txt.infos.faq2.13.2 = Si vous avez un besoin spécifique auquel vous ne pouvez pas répondre via notre module en ligne, n'hésitez pas à utiliser le formulaire de demande de fonctionnalité de votre compte.
txt.infos.faq3 = Abonnement
txt.infos.faq3.1.1 = Pourquoi s'abonner ?
txt.infos.faq3.1.2 = L'abonnement à nos services vous donne un accès exclusif au contenu payant et vous permet de bénéficier de fonctionnalités avancées. En fonction de l'offre que vous sélectionnez, les configurations de votre plateforme varieront.<br>AlgérieOffice publie régulièrement de nouvelles fonctionnalités.
txt.infos.faq3.2.1 = Comment s'abonner ?
txt.infos.faq3.2.2 = Pour vous abonner à nos services, rien de plus simple ! Rendez-vous sur la console d'administration de votre entreprise, rubrique "Outils", section "Abonnement" et sélectionnez l'offre de votre choix parmi les quatre proposées. Chacun de ces pass vous offre des avantages spécifiques.
txt.infos.faq3.3.1 = Je suis un particulier, puis-je souscrire à vos services ?
txt.infos.faq3.3.2 = Non, nos services payants sont destinés uniquement aux professionnels. Tous nos services offerts aux particuliers sont gratuits. Vous pouvez utiliser la plateforme en tant qu'individu illimité sans avoir besoin d'avoir souscrit à un abonnement.
txt.infos.faq3.4.1 = J'ai plusieurs opérateurs enregistrés auprès de mon entreprise, ai-je besoin d'un abonnement pour chaque opérateur ?
txt.infos.faq3.4.2 = Non, un abonnement ne concerne qu'une seule entreprise, tous les utilisateurs opérateurs de l'entreprise bénéficient de cet abonnement.<br>Tous les opérateurs d'une entreprise peuvent accéder à la même console d'administration, où le contenu est partageable entre eux, y compris l'abonnement actif en question.
txt.infos.faq3.5.1 = Quels sont les moyens de paiement acceptés ?
txt.infos.faq3.5.2 = Il n'y a qu'un seul mode de paiement disponible sur notre site, vos achats peuvent être réglés via un mandat CCP puis nous envoyer le bulletin de virement en utilisant le formulaire de paiement disponible pour chaque service sur le site.<br>Nous sommes désolés de ne pouvoir fournir d'autres moyens de paiement en raison de difficultés et d'indisponibilité de la mise en œuvre des API de paiement électronique en Algérie !
txt.infos.faq3.6.1 = Comment modifier un abonnement ?
txt.infos.faq3.6.2 = Il n'est pas possible de modifier un abonnement en cours. Cependant, si vous souhaitez modifier votre pass, il vous suffit de souscrire un nouvel abonnement. Un calcul est ensuite appliqué pour ajouter le nouvel abonnement avec l'abonnement existant, dont le résultat est mis à niveau vers le pass choisi.
txt.infos.faq3.7.1 = Quels sont les avantages d'un abonnement Premium ?
txt.infos.faq3.7.2 = Grâce aux services disponibles dans le pass premium, vous pouvez gérer votre activité, consulter des demandes de devis illimitées, identifier vos visiteurs, analyser vos performances, etc. Pour plus de détails, n'hésitez pas à consulter la page de nos offres.
txt.infos.faq4 = Publicité
txt.infos.faq4.1.1 = Comment créer ma publicité ?
txt.infos.faq4.1.2 = Rien de plus simple ! Pour créer votre annonce, rendez-vous sur la console d'administration de votre entreprise, rubrique "Marketplace", rubrique "Annonces premium" et laissez-vous guider. En seulement 3 étapes, vous aurez créé votre annonce personnalisée. Nous vous conseillons de consulter notre charte de bonnes pratiques, les règles de diffusion avant de créer votre annonce.<br>De même, depuis la rubrique "Campagnes", vous pouvez démarrer une campagne B2B pour promouvoir vos offres auprès des entreprises de votre choix.
txt.infos.faq4.2.1 = Qui verra ma publicité ? Puis-je cibler mon public ?
txt.infos.faq4.2.2 = Plusieurs options s'offrent à vous. Vous pouvez choisir de diffuser votre annonce auprès de tous les visiteurs d'AlgérieOffice ou de l'afficher auprès d'un public que vous ciblez en fonction de deux critères: secteur, zone géographique. Bien cibler vos prospects vous permet d'optimiser le volume d'affichage généré par votre publicité.
txt.infos.faq4.3.1 = Où mon annonce apparaît-elle ?
txt.infos.faq4.3.2 = Votre annonce sera affichée dans un espace réservé en haut de chaque page entreprise pour une annonce premium (tableau de bord entreprise pour une campagne b2b), dans l'onglet Accueil. Votre publicité sera affichée sur les entreprises correspondant à vos sélections.
txt.infos.faq4.4.1 = Que se passe-t-il si nous sommes plusieurs à vouloir afficher la même annonce au même endroit ?
txt.infos.faq4.4.2 = Dans le cas où plusieurs annonces répondent aux mêmes critères de distribution, un principe de rotation équitable sera appliqué. Chaque annonce sera diffusée une fois avant de démarrer une nouvelle rotation d'annonces.
txt.infos.faq4.5.1 = Puis-je créer plusieurs annonces en même temps ?
txt.infos.faq4.5.2 = Vous pouvez créer autant d'annonces que vous le souhaitez, il n'y a pas de limite! Vous pouvez ensuite gérer vos publicités comme vous le souhaitez, en ajustant vos budgets, votre ciblage et vos pauses.<br>Pensez à varier le message, la cible, les textes des boutons pour donner plus de force à chacune de vos publicités. Vous pourrez également comparer vos annonces et voir les caractéristiques de celle qui fonctionne le mieux pour la réutilisation.
txt.infos.faq4.6.1 = Comment sélectionner un budget différent de ceux proposés ?
txt.infos.faq4.6.2 = Il n'est pas possible de sélectionner un budget autre que ceux proposés. Cependant, vous avez la possibilité d'ajouter plus de budget quand vous le souhaitez.
txt.infos.faq4.7.1 = Comment puis-je payer ma publicité ?
txt.infos.faq4.7.2 = Vous pouvez régler votre publicité via un mandat CCP puis nous envoyer le bulletin de virement via le formulaire correspondant sur notre site.
txt.infos.faq4.8.1 = Je viens de valider ma publicité et de payer mais elle n'est pas encore affichée, pourquoi ?
txt.infos.faq4.8.2 = Toutes les publicités sont modérées par nos équipes avant leur mise en ligne, afin de garantir le respect des règles de diffusion et la bienveillance du contenu. Nous nous efforçons de respecter un délai d'un jour ouvrable avant la validation et la mise en ligne de votre publicité.
txt.infos.faq4.9.1 = Combien de temps faut-il pour modérer une annonce ?
txt.infos.faq4.9.2 = Afin de vous garantir un service de qualité, notre équipe de modérateurs met tout en œuvre pour respecter un délai de modération d'un jour ouvrable.<br>Pour vérifier la conformité de votre annonce, vous pouvez consulter nos règles de diffusion.
txt.infos.faq4.10.1 = Pourquoi mon annonce n'a-t-elle pas été validée par vos équipes ?
txt.infos.faq4.10.2 = Si votre annonce n'a pas été validée par nos équipes, le motif du refus doit vous avoir été expliqué dans l'email que vous avez reçu.<br>Dans tous les cas, assurez-vous que le contenu de votre publicité est conforme à nos règles de distribution et pensez à vérifier que le lien intégré dans cette publicité fonctionne. Une fois votre annonce corrigée, validez-la afin que nos équipes puissent à nouveau la modérer.
txt.infos.faq4.11.1 = Puis-je cliquer sur mon annonce pour vérifier que tout fonctionne correctement ?
txt.infos.faq4.11.2 = Bien sûr ! Comme tout visiteur d'AlgérieOffice, vous pouvez cliquer sur votre annonce. Cependant, nous ne pouvons pas vous différencier d'un visiteur typique en cliquant sur l'annonce, vous utilisez donc un clic de votre budget. 
txt.infos.faq4.12.1 = Où puis-je suivre les performances de ma publicité ?
txt.infos.faq4.12.2 = Vous pouvez afficher les performances de vos annonces dans la même section de création sur votre console d'administration. Depuis cette page, vous pouvez également décider de mettre à jour vos annonces et d'ajouter des budgets.
txt.infos.faq4.13.1 = À quelle fréquence mes statistiques sont-elles mises à jour ?
txt.infos.faq4.13.2 = Afin d'assurer un suivi optimal, les statistiques de vos annonces sont mises à jour en temps réel.
txt.infos.faq4.14.1 = Je remarque que j'ai beaucoup d'affichages mais quelques clics sur mon annonce, que dois-je faire ?
txt.infos.faq4.14.2 = Cela signifie que votre annonce est diffusée auprès d'un large public, mais que le contenu n'incite pas les visiteurs à cliquer suffisamment. Dans ce cas, nous vous conseillons de modifier le titre, le texte ou la légende du bouton.<br>Vous pouvez procéder par étape et modifier chacun de ces éléments un par un, en laissant quelques jours entre deux modifications pour voir lequel est le plus efficace.
txt.infos.faq4.15.1 = Je remarque que j'ai peu d'affichages mais un bon taux de clics sur mon annonce, que dois-je faire ?
txt.infos.faq4.15.2 = Cela signifie que votre annonce se construit bien et incite les visiteurs à cliquer, mais votre public cible n'est pas assez large. Pour augmenter votre taux d'affichage, nous vous conseillons d'élargir votre cible définie dans les premières étapes de création de votre annonce.
txt.infos.faq4.16.1 = Puis-je modifier ma publicité après sa mise en ligne ?
txt.infos.faq4.16.2 = Bien sûr ! Vous pouvez modifier votre publicité et/ou votre ciblage à tout moment depuis votre console.
txt.infos.faq4.17.1 = Y a-t-il des règles à suivre lors de la rédaction d'une annonce ?
txt.infos.faq4.17.2 = En effet, toute publicité doit respecter les contraintes légales pour être validée lors de la modération.<br>N'oubliez pas de consulter notre charte des bonnes pratiques avant de rédiger votre annonce.
txt.infos.faq5 = Marketplace
txt.infos.faq5.1.1 = Qu'est-ce qu'une marketplace ?
txt.infos.faq5.1.2 = Une marketplace est un site en ligne qui met en relation une multitude d'acheteurs et de vendeurs du même secteur. L'objectif est de développer des transactions entre ces acteurs.
txt.infos.faq5.2.1 = Qu'est-ce qu'une plateforme d'e-procurement ?
txt.infos.faq5.2.2 = Une plateforme e-procurement est un outil numérique pour votre entreprise. Son rôle est de faciliter la gestion de l'ensemble du processus d'acquisition. Il regroupe tous les fournisseurs et devient le point d'accès central pour tous vos collaborateurs ou toutes vos filiales.
txt.infos.faq5.3.1 = Quelles sont les différences entre un site e-commerce, une marketplace ou même une plateforme de dropshipping ?
txt.infos.faq5.3.2 = Tous trois sont des plates-formes en ligne dont l'objectif principal est de faciliter la réalisation de transactions entre vendeurs et acheteurs. La seule différence réside dans la présence des utilisateurs (acheteurs et vendeurs) et dans leur manière d'agir.
txt.infos.faq5.3.2.1 = Sur les sites e-commerce, nous pouvons identifier un seul vendeur, face à une multitude d'acheteurs. A titre d'exemple pour ce type de plateforme, on peut citer moo.com ou quill.com.
txt.infos.faq5.3.2.2 = Les marketplaces rassemblent un grand nombre de vendeurs et un grand nombre d'acheteurs. C'est le cas, par exemple, d'Amazon Business. Chacune des transactions peut connecter un acheteur à un nouveau vendeur.
txt.infos.faq5.3.2.3 = La plateforme de dropshipping est une sorte de marketplace avec un certain nombre d'acheteurs et de vendeurs. Mais les acheteurs ne seront en contact qu'avec un seul vendeur, qui agira en tant qu'intermédiaire. Ce vendeur particulier que nous pouvons appeler un "dropshipper" gère toutes les transactions entre acheteurs et vendeurs, sans s'occuper de l'inventaire. Ceux-ci seront gérés par les vendeurs finaux, qui seront en charge des livraisons.
txt.infos.faq5.4.1 = Qu'est-ce que AlgérieOffice ?
txt.infos.faq5.4.2 = AlgérieOffice est une solution de marketplace pour développer votre activité en ligne en créant de nouvelles relations et transactions entre acheteurs et vendeurs d'un même secteur.<br>AlgérieOffice est également une solution e-procurement conçue pour faciliter la gestion des approvisionnements au sein de votre entreprise.
txt.infos.faq5.5.1 = Pourquoi AlgérieOffice se décrit-il comme une solution en marque blanche ?
txt.infos.faq5.5.2 = Les entreprises qui créent leur marketplace avec AlgérieOffice auront la possibilité de définir leur propre expérience utilisateur en modifiant un certain nombre d'éléments. Nous donnons également à chacun la possibilité de choisir l'url de la marketplace.
txt.infos.faq5.6.1 = Quel est le modèle économique d'AlgérieOffice ?
txt.infos.faq5.6.2 = Le modèle économique d'AlgérieOffice est très simple et prend en compte le bien-être financier de ses clients. En fait, il est basé sur des frais mensuels fixes sans commission ni frais d'installation supplémentaires.<br>Cela garantit à nos clients une certaine stabilité et une vision confortable sur le long terme.
txt.infos.faq5.7.1 = Que signifie l'acronyme Saas ? Et pourquoi est-il avantageux d'utiliser ce type de solution ?
txt.infos.faq5.7.2 = AlgérieOffice se distingue des autres solutions car nous visons vraiment à vous offrir le meilleur qui puisse profiter à votre entreprise le plus rapidement possible.
txt.infos.faq5.7.2.1 = Mode Saas: Notre plateforme verra constamment des améliorations et vous pourrez régulièrement bénéficier de nouvelles fonctionnalités qui profiteront à votre entreprise.
txt.infos.faq5.7.2.2 = Solution tout-en-un: AlgérieOffice intègre les trois interfaces (front-office, middle-office, back-office) nécessaires à la bonne gestion d'une place de marché ou d'une plateforme e-procurement.
txt.infos.faq5.8.1 = Comment le catalogue est-il structuré dans la solution AlgérieOffice ?
txt.infos.faq5.8.2 = AlgérieOffice offre le meilleur système de classification et de catégorisation des produits et/ou services pour une place de marché ou une plate-forme d'approvisionnement électronique. Nous utilisons un PIM (Product Information Management) pour centraliser et gérer toutes les données autour des produits.
txt.infos.faq5.9.1 = La solution offre-t-elle une interface opérateur/vendeur ?
txt.infos.faq5.9.2 = Afin de faciliter l'utilisation de la solution, 3 interfaces sont disponibles: un font-office pour le client final, un middle-office pour les vendeurs et un back-office pour les opérateurs. 
txt.infos.faq5.10.1 = Comment fonctionne la messagerie interne pour gérer les SAV, les questions ou autres ?
txt.infos.faq5.10.2 = AlgérieOffice a développé un système de messagerie sécurisé intégré pour faciliter les contacts entre utilisateurs en temps réel. Les demandes de devis et les contacts avec une entreprise peuvent être partagés entre ses modérateurs.
