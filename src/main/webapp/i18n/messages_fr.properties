txt.infos.mention2.1 = Politique des cookies
txt.infos.mention2.1.1 = La présente politique en matière de confidentialité et de cookies s'applique à tous les visiteurs et utilisateurs du site web.
txt.infos.mention2.2 = Qu'est-ce qu'un cookie ?
txt.infos.mention2.2.1 = Un cookie est un petit fichier envoyé par un site visité à votre navigateur et stocké sur votre terminal (ordinateur, tablette, smartphone, etc.) à la demande du serveur gérant ce site. Il contient des informations sur la navigation effectuée sur les pages du site. Il facilite l'utilisation ultérieure du site par la même personne en enregistrant ses préférences.
txt.infos.mention2.2.2 = Les cookies que nous utilisons ne permettent pas de vous identifier, mais ils enregistrent des informations en fonction de votre utilisation de notre site, pour mémoriser les préférences de recherche, voire augmenter la pertinence des publicités affichées.
txt.infos.mention2.2.3 = Nos cookies permettent également de développer nos services en établissant des statistiques et des volumes de fréquentation afin d'améliorer l'intérêt et l'ergonomie de nos services.
txt.infos.mention2.2.4 = Cependant, les cookies d'AlgérieOffice ne contiennent en aucun cas directement des informations personnelles vous concernant. Le cookie ne peut pas collecter d'informations sur le système de l'utilisateur.
txt.infos.mention2.2.5 = Chaque site Web peut envoyer ses propres cookies si les préférences du navigateur le permettent, mais un site Web ne peut supprimer et réécrire que les cookies qui lui appartiennent.
txt.infos.mention2.3 = Les différents types de cookies
txt.infos.mention2.3.1 = Le site AlgérieOffice utilise différents cookies
txt.infos.mention2.3.1.1 = Les cookies essentiels
txt.infos.mention2.3.1.2 = il s'agit de cookies indispensables au bon fonctionnement du site AlgérieOffice. Sans ces cookies, certaines fonctionnalités du site ne fonctionneraient pas. Ces cookies ne stockent aucune information personnelle en mémoire qui pourrait être utilisée à des fins de marketing.
txt.infos.mention2.3.2.1 = Les cookies analytiques
txt.infos.mention2.3.2.2 = ce sont des cookies qui permettent d'améliorer le fonctionnement de notre site, et de suivre ses performances. Les informations collectées par ces cookies sont anonymes et ne sont utilisées qu'à des fins statistiques.
txt.infos.mention2.3.3.1 = Les cookies fonctionnels
txt.infos.mention2.3.3.2 = ce sont des cookies qui permettent au site de se souvenir des choix que vous faites lors de votre navigation et vous permettent de proposer des fonctionnalités personnalisées. Les informations collectées par ces cookies sont anonymes. Ces cookies ne suivent pas vos activités de navigation sur d'autres sites Web.
txt.infos.mention2.3.4.1 = Les cookies publicitaires
txt.infos.mention2.3.4.2 = ce sont des cookies qui vous permettent de présenter des publicités plus adaptées à ce qui vous intéresse et plus personnalisées. Ces cookies ne permettent pas d'identifier personnellement l'internaute.
txt.infos.mention2.3.5.1 = Les cookies tiers
txt.infos.mention2.3.5.2 = il s'agit de cookies installés par un site Web différent de celui d'AlgérieOffice. Cela peut être le cas, par exemple, avec le partage de cookies sur les réseaux sociaux, ou avec Google Analytics. Le site AlgérieOffice n'enregistre pas les cookies de ces sites tiers. Vous devez ensuite vous rendre sur le site Web du tiers pour plus d'informations sur les cookies qu'il stocke et comment les gérer. Cependant, le navigateur vous permet de bloquer les cookies et les données de sites tiers si vous le souhaitez.
txt.infos.mention2.3.6 = Ces cinq types de cookies peuvent être des cookies de session ou des cookies permanents.
txt.infos.mention2.3.6.1 = Un cookie de session
txt.infos.mention2.3.6.2 = ne persiste que pendant la session de navigation, il est supprimé lorsque le navigateur est fermé.
txt.infos.mention2.3.7.1 = Un cookie permanent
txt.infos.mention2.3.7.2 = est installé pour une durée déterminée. Ces cookies restent dans l'appareil jusqu'à leur expiration ou jusqu'à ce qu'ils soient supprimés du cache de l'ordinateur.
txt.infos.mention2.4 = Acceptation ou refus des cookies
txt.infos.mention2.4.1 = Lorsque vous accédez à notre site, un message s'affiche afin que nous puissions placer un cookie sur votre terminal. À tout moment, vous pouvez modifier votre choix via les paramètres de votre navigateur.
txt.infos.mention2.4.2 = Nous vous rappelons que les paramétrages sont susceptibles de modifier vos conditions d'accès à nos services nécessitant l'utilisation de cookies. Si votre navigateur est configuré pour refuser tous les cookies, vous ne pourrez par exemple pas accéder à votre compte en ligne.
txt.infos.mention2.4.3 = La plupart des navigateurs vous permettent de gérer vos cookies. Vous pouvez configurer votre navigateur pour refuser ou supprimer certains cookies. Habituellement, vous pouvez également gérer des technologies similaires de la même manière, en utilisant vos navigateurs.
