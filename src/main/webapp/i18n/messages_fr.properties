txt.infos.politic1 = Politique de gestion et de protection des données d'AlgérieOffice
txt.infos.politic1.1 = Principes généraux
txt.infos.politic1.2 = Conformément aux obligations légales, notre site place la protection des données personnelles au cœur de ses missions et des services qui vous sont proposés.
txt.infos.politic1.2.1 = Nous considérons que vos données personnelles (votre nom, votre adresse postale, votre numéro de téléphone, votre adresse e-mail) ainsi que toutes les données communiquées sur notre site ou générées par votre navigation constituent des données personnelles.
txt.infos.politic1.2.2 = Ce document vous explique les principes et engagements d'AlgérieOffice pour la protection de vos données personnelles et vise à vous informer sur
txt.infos.politic1.2.2.1 = Les données personnelles collectées par AlgérieOffice et les raisons de cette collecte.
txt.infos.politic1.2.2.2 = Les données personnelles qu'AlgérieOffice détient de ses partenaires.
txt.infos.politic1.2.2.3 = La manière dont ces données personnelles seront utilisées.
txt.infos.politic1.2.2.4 = Vos droits en tant que personne concernée par ce traitement de données.
txt.infos.politic1.2.3 = Cette politique s'applique à tous les services d'AlgérieOffice quelle que soit leur nature (sites, applications, services, etc.).
