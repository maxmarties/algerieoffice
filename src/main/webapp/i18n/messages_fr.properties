txt.infos.chart1 = Charte de bonnes pratiques et règles de diffusion des publicités
txt.infos.chart1.1 = Article 1 - Définitions
txt.infos.chart1.1.1.1 = Utilisateur
txt.infos.chart1.1.1.2 = Utilisateur du module d'espaces sponsorisés d'AlgérieOffice (concepteur et éditeur de l'annonce et/ou de la campagne b2b).
txt.infos.chart1.1.2.1 = Annonce
txt.infos.chart1.1.2.2 = Publicité écrite par l'utilisateur et publiée sur les pages des entreprises grâce au module.
txt.infos.chart1.1.3.1 = Campagne b2b
txt.infos.chart1.1.3.2 = Offre commerciale à promouvoir par l'utilisateur sur les tableaux de bord des entreprises à l'aide du module.
txt.infos.chart1.1.4.1 = Espace sponsoriséd'entreprise créées par tempérament par défaut
txt.infos.chart1.1.4.2.1 = L'annonce est composée d'un titre de soixante (60) caractères maximum, d'un texte de cent cinquante (150) caractères maximum et d'un bouton d'action dont le titre est choisi par l'utilisateur dans une liste déroulante de choix. L'utilisateur choisit le nombre d'affichages qu'il souhaite atteindre pour l'annonce parmi un choix d'un nombre d'affichage qui correspond à un prix. Après modération préalable par AlgérieOffice, l'annonce est publiée et reste en ligne jusqu'à ce que le nombre déterminé de messages soit atteint.
txt.infos.chart1.1.4.2.2 = La campagne b2b est constituée d'un titre de cent cinquante (150) caractères maximum sous la forme d'un lien vers l'offre à promouvoir avec une indication de son type (produit, service, appel d'offres, annonce b2b, recherche d'un distributeur, recherche de sous-traitants, prestation de services ou événement). L'utilisateur choisit le niveau de clics qu'il souhaite atteindre pour la campagne b2b parmi un choix d'un nombre de clics qui correspond à un prix. Après validation par nos équipes, la campagne est publiée et reste en ligne jusqu'à ce que le niveau de clic déterminé soit atteint.
txt.infos.chart1.1.5.1 = Destinataire
txt.infos.chart1.1.5.2 = Toute personne susceptible d'avoir accès à l'annonce et/ou à la campagne b2b, qu'elle fasse ou non partie de l'audience cible et qu'elle clique ou non sur l'annonce (ou la campagne b2b).
txt.infos.chart1.2 = Article 2 - Objet
txt.infos.chart1.2.1 = La présente charte a pour objet de définir les bonnes pratiques que l'utilisateur s'engage à respecter en matière de publication sur le module "espace sponsorisé".
txt.infos.chart1.2.2 = Il est précis, ce que l'utilisateur comprend, reconnaît et accepte, que les rappels aux règles contenues dans la présente Charte ne sont pas exhaustifs et que l'utilisateur est tenu de s'informer notamment sur le régime publicitaire applicable à sa profession ainsi que sur le produit ou service dont il souhaite faire la publicité via l'annonce.
txt.infos.chart1.2.3 = Dans ce cadre, avant toute publication, l'utilisateur s'engage à respecter scrupuleusement la présente Charte ainsi que l'ensemble des dispositions législatives et réglementaires applicables à chaque cas particulier.
txt.infos.chart1.3 = Article 3 - Modération
txt.infos.chart1.3.1 = L'utilisateur est informé et accepte que toutes les annonces sont modérées par AlgérieOffice avant toute publication, sans être lié par aucun délai.
txt.infos.chart1.3.2 = L'utilisateur déclare comprendre et accepter que l'acceptation ou le rejet d'une annonce est apprécié par AlgérieOffice selon les critères de sa politique de publication.
txt.infos.chart1.3.3 = L'utilisateur dont l'annonce a été rejetée par AlgérieOffice reçoit un email expliquant les raisons et l'invitant à modifier son annonce.
txt.infos.chart1.4 = Article 4 - Garanties et responsabilité
txt.infos.chart1.4.1 = L'utilisateur reconnaît et accepte qu'AlgérieOffice n'est qu'un simple intermédiaire entre l'utilisateur et les destinataires. La responsabilité d'AlgérieOffice ne saurait être recherchée pour le contenu d'une annonce.
txt.infos.chart1.4.2 = L'utilisateur est informé, reconnaît et accepte que toute violation de la présente Charte ainsi que toute infraction ou suspicion de contrefaçon entraînent la suppression immédiate sans mise en demeure de l'annonce, sans droit à indemnité.
txt.infos.chart1.5 = Article 5 - Propriété intellectuelle et droits à l'image
txt.infos.chart1.5.1 = L'utilisateur est informé qu'AlgérieOffice ne tolère aucune utilisation frauduleuse ou non autorisée de contenus protégés par le droit d'auteur. Dans ce cadre, l'utilisateur s'engage solennellement à n'utiliser dans sa publicité que des textes, images, photographies et/ou tout autre contenu dont les droits de propriété intellectuelle lui appartiennent ou pour lesquels il a reçu une licence d'exploitation.
txt.infos.chart1.5.2 = L'utilisateur s'engage également à respecter les droits à l'image de toute personne éventuellement représentée sur l'annonce, et à obtenir son accord écrit préalable.
txt.infos.chart1.6 = Article 6 - Publicité réglementée
txt.infos.chart1.6.1 = La publicité est réglementée, par exemple, dans les domaines de la santé publique (alcool, tabac, vapotage, médicaments, laboratoires pharmaceutiques) ou encore des produits financiers.
txt.infos.chart1.6.2 = L'utilisateur déclare comprendre et accepter qu'AlgérieOffice ne puisse pas être pleinement informé de tous les régimes publicitaires spécifiques.
txt.infos.chart1.6.3 = L'utilisateur est tenu de connaître et de respecter toutes les règles applicables à sa profession et aux produits et services dont il souhaite faire la publicité.
txt.infos.chart1.7 = Article 7 - Divisibilité
txt.infos.chart1.7.1 = Si l'un des articles de la présente Charte s'avérait nul ou inapplicable en vertu d'une loi ou d'un règlement ou suite à une décision de justice, les autres articles conserveront toute leur force et leur portée.
txt.infos.credit1 = Bénéficiez de la toute dernière génération d'outils grâce à une équipe technique agile à l'écoute des nouveautés du marché. Votre solution AlgérieOffice, construite avec les technologies les plus avancées et sécurisées.
txt.infos.credit1.1 = Back-end: performances à toute épreuve
txt.infos.credit1.1.1 = Java est un langage de programmation orienté objet utilisé pour développer des applications Web. Java est devenu la norme pour le développement d'applications d'entreprise et est souvent choisi pour des projets complexes et de grande envergure. Java est multiplateforme et fonctionne sous environnement Unix et Windows.
txt.infos.credit1.1.2 = AlgérieOffice développe son côté serveur (backend) via le framework Spring Boot basé sur le langage de développement Java.
txt.infos.credit1.1.3 = Java est l'un des langages utilisés par les grands noms du web pour former la base de leurs infrastructures applicatives. Google, Twitter et d'autres Amazon font confiance à Java pour la sécurité et les performances.
txt.infos.credit1.2 = Front-end: interfaces interactives pour une meilleure expérience utilisateur
txt.infos.credit1.2.1 = Le côté client (front-end) d'AlgérieOffice est développé avec ReactJS, le langage front-end web et mobile le plus populaire. React aide à créer des interfaces utilisateur attrayantes et interactives, ce qui en fait la solution idéale pour une expérience utilisateur exceptionnelle, améliorant ainsi la satisfaction des utilisateurs.
txt.infos.credit1.2.2 = React est une bibliothèque JavaScript créée par Facebook qui vous permet de développer une interface utilisateur d'aspect professionnel, indépendante de la pile technologique back-end.
txt.infos.credit1.3 = Modèle: déploiement flexible et ultra-rapide pour des applications Web évolutives
txt.infos.credit1.3.1 = Le modèle de données AlgérieOffice est administré par le système PostgreSQL basé sur le langage procédural non bloquant. Léger et efficace, il est particulièrement adapté aux applications devant gérer de gros volumes de données en temps réel et sur des équipements distribués.
txt.infos.credit1.3.2 = Le système asynchrone de PostgreSQL permet de traiter simultanément plusieurs requêtes de lecture, ce qui permet de gagner un temps considérable. Il est particulièrement apprécié en termes de performances pour les opérations d'insertion de données et de création d'index.
