txt.infos.mention1.5.2 = AlgérieOffice et ses partenaires déclinent formellement toute responsabilité quant au contenu des sites vers lesquels ils proposent des liens. Ces liens sont proposés aux utilisateurs du site ou des sites Internet de ses partenaires et entités affiliées en tant que service. La décision d'activer les liens appartient exclusivement aux utilisateurs.
