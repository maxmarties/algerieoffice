txt.help.case1.1 = est toujours disponible sur AlgérieOffice. Il fournit des informations détaillées sur le site, y compris la section Foire aux questions (FAQ) pour vous faciliter la tâche. Dans le centre d'aide, vous trouverez également nos bases de connaissances, qui intègrent des informations précieuses sur la façon d'utiliser les solutions que nous proposons sur AlgérieOffice.
txt.help.case1.1.1 = Le tableau de bord de votre compte vous permet de gérer les interactions avec les entreprises que vous contactez, les membres d'AlgérieOffice, vos paramètres et plus encore. Suivez cette courte visite guidée pour en savoir plus sur les principaux menus de la console.
txt.help.case1.1.2.1 = Si vous avez besoin d'aide supplémentaire, notre personnel compétent reste à votre disposition pour répondre à toutes vos questions techniques et aux problèmes de votre compte. Ecrivez-nous à
txt.help.case1.1.2.2 = Nos collaborateurs sont disponibles de 9h00 à 17h00 du dimanche au jeudi (samedi matin inclus).
txt.help.case1.1.3 = Si vous avez besoin d'une réponse immédiate, nous vous proposons une assistance en ligne via le bouton "Assistance live chat" en haut de chaque page. Nos modérateurs donnent de leur temps pour répondre à vos questions concernant le site, ainsi que pour gérer et résoudre vos conflits dans les 36 prochaines heures.
txt.help.case1.2 = Nous adorons entendre les commentaires de nos utilisateurs, nous vous proposons donc naturellement plusieurs moyens de nous contacter. Pour signaler un problème, faire une suggestion ou simplement dire bonjour, vous pouvez utiliser l'un de nos canaux d'assistance répertoriés ci-dessous
txt.help.case1.2.1 = Si vous êtes sur Facebook, Twitter, Linkedin ou Youtube, vous pouvez nous trouver ici
txt.help.case1.2.2 = Pour toutes demandes par des entreprises commerciales, vous êtes priés de contacter
txt.help.case1.2.3 = Besoin d'entrer en contact via courrier postal ?
txt.help.case2.2.1 = Bienvenue sur votre tableau de bord! C'est l'écran que vous verrez lorsque vous vous connectez à votre entreprise, et qui vous donne accès à toutes les fonctionnalités de gestion d'AlgérieOffice. Faites cette courte visite guidée pour connaître les principaux menus d'administration.
txt.help.case2.2.2 = Lançons votre entreprise en quelques minutes. Nous vous proposons les étapes pour créer votre page commerciale sur AlgérieOffice. Lorsque vous aurez terminé ces étapes, votre page sera prête et configurée. C'est à vous de répondre !
txt.help.case3.1.1 = Menu d'administration de votre entreprise
txt.help.case3.1.2 = Gérez le contenu dynamique et configurez votre page d'entreprise.
txt.help.case3.1.3 = La navigation à gauche de l'écran fournit tous les liens pour accéder à la console d'administration de votre entreprise, avec les sous-menus affichés en imbrication (lors du survol d'un menu réduit). Vous pouvez réduire ce menu à ses icônes uniquement en cliquant sur le bouton "Réduire le menu" dans la barre d'accès rapide en haut de l'écran.
txt.help.case3.2.1 = Prévisualiser l'entreprise
txt.help.case3.2.2 = Ouvrez votre page en mode aperçu
txt.help.case3.2.3 = Cliquez sur ce lien pour prévisualiser votre page. Cela vous permet de voir et de vérifier la page de votre entreprise après un changement dans la console d'administration. Le mode Aperçu est le même que la vue publique, avec un minimum de modifications et des conseils pour faire avancer rapidement votre présentation professionnelle.
txt.help.case3.3.1 = Votre compte utilisateur
txt.help.case3.3.2 = Accédez au tableau de bord de votre compte utilisateur
txt.help.case3.3.3 = Cela vous permet de basculer rapidement entre les tableaux de bord de l'entreprise et votre compte. Dans ce dernier, vous trouverez tous les paramètres liés à votre compte utilisateur (Informations personnelles et publiques, votre réseau, vos favoris, vos alertes, notifications par e-mail, etc.).
