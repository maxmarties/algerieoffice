txt.infos.politic5.1.5.1 = Violation de données
txt.infos.politic5.1.5.2 = désigne une violation de la sécurité, entraînant, accidentellement ou illégalement, la destruction, la perte, l'altération, la divulgation ou l'accès non autorisé aux données personnelles.
