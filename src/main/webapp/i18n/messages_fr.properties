txt.infos.politic3.1 = Exercice du droit d'accès
txt.infos.politic3.2 = Comment AlgérieOffice met en œuvre la protection des données personnelles ?
txt.infos.politic3.2.1 = AlgérieOffice s'engage à prendre en compte la protection des données personnelles dès la conception des services qui vous sont proposés (Privacy by design). Pour assurer la sécurité et garantir le respect et le bon exercice de vos droits, des mesures visant à assurer la protection des données personnelles sont mises en place (Privacy par défaut).
txt.infos.politic3.3 = Quelles données sont collectées et utilisées par AlgérieOffice ?
txt.infos.politic3.3.1 = AlgérieOffice s'engage à ne collecter que les données strictement nécessaires à l'objectif de suivi et de clarification auprès des personnes concernées, leur laissant la pleine capacité d'exercer leurs droits. Les données personnelles susceptibles d'être collectées, en fonction de la nature des services fournis, sont les suivantes
txt.infos.politic3.3.1.1 = Nom et prénom
txt.infos.politic3.3.1.2 = Adresse, CP, Ville
txt.infos.politic3.3.1.3 = Téléphone
txt.infos.politic3.3.1.4 = Adresse email
txt.infos.politic3.3.1.5 = Fonction exercée
txt.infos.politic3.3.1.6 = Adresse IP
txt.infos.politic3.3.2 = Dans le cas où des données facultatives vous seraient demandées, AlgérieOffice vous informera clairement des données personnelles nécessaires à l'exécution du service.
txt.infos.politic3.3.3 = Les données personnelles sont collectées directement auprès de vous et ne sont utilisées qu'aux fins qui ont été portées à votre connaissance.
txt.infos.politic3.4 = Quelle est la base de la légitimité du traitement effectué par AlgérieOffice ?
txt.infos.politic3.4.1 = AlgérieOffice s'appuie sur les bases légitimes suivantes pour pouvoir traiter des données personnelles
txt.infos.politic3.4.1.1 = Exécution du contrat
txt.infos.politic3.4.1.2 = Lorsque la base légale pour le traitement des données personnelles de l'utilisateur collectées est l'exécution du contrat. À cet égard, l'utilisateur est tenu de fournir les données nécessaires à son exécution.
txt.infos.politic3.4.2.1 = Obligations légales
txt.infos.politic3.4.2.2 = Lorsque la détention, la collecte et l'utilisation de données personnelles sont une obligation légale pour la personne concernée.
txt.infos.politic3.4.3.1 = Consentement
txt.infos.politic3.4.3.2 = En ce qui concerne les finalités suivantes, la base légale du traitement des données personnelles de l'utilisateur sera le consentement de l'utilisateur, s'il l'a donné.
txt.infos.politic3.4.3.2.1 = Gestion des inscriptions sur les pages des entreprises.
txt.infos.politic3.4.3.2.2 = Gestion de l'envoi d'informations sur les produits et services de l'entreprise et de ses partenaires.
txt.infos.politic3.4.3.2.3 = Réponse à l'exercice des droits d'accès, de modification, d'annulation et d'opposition, ainsi qu'aux questions et réclamations de l'utilisateur.
txt.infos.politic3.4.3.2.4 = Connexion afin de répondre aux demandes d'informations exprimées à travers nos formulaires.
txt.infos.politic3.4.3.2.5 = Transmission des coordonnées à des tiers (connexion, réponse à un besoin exprimé à travers une campagne, etc.).
txt.infos.politic3.4.4 = Le retrait du consentement à ces traitements par l'utilisateur ne conditionnera pas l'exécution du contrat de fourniture d'informations conclu par la personne concernée avec AlgérieOffice.
txt.infos.politic3.5 = Mes données personnelles sont-elles protégées ?
txt.infos.politic3.5.1 = AlgérieOffice s'engage à prendre toutes les mesures pour assurer la sécurité et la confidentialité des données personnelles et notamment pour éviter qu'elles ne soient endommagées, effacées ou que des tiers non autorisés y aient accès.
txt.infos.politic3.5.2 = Par ailleurs, en cas d'incident de sécurité affectant vos données personnelles (destruction, perte, altération ou divulgation), AlgérieOffice s'engage à respecter l'obligation de notification des violations de données personnelles.
txt.infos.politic4.1 = Modification de la présente politique
txt.infos.politic4.2 = Les mises à jour de cette politique de confidentialité seront publiées sur le site Web d'AlgérieOffice. Nous publierons également un avis sur le site avec la politique de confidentialité mise à jour.
txt.infos.politic5.1 = Glossaire
txt.infos.politic5.1.1.1 = Politique de confidentialité et de protection des données
