txt.infos.politic5.1.2.2 = désigne toute information relative à toute personne physique et permet de l'identifier directement ou indirectement.
txt.infos.politic5.1.3.1 = Traitement
txt.infos.politic5.1.3.2 = désigne toute opération ou ensemble d'opérations appliquées aux données personnelles.
txt.infos.politic5.1.4.1 = Responsable du traitement
