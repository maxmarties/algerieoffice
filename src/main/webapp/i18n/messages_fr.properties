txt.help.begginer0 = Créez votre page d'entreprise
txt.help.begginer0.1 = Votre entreprise est déjà créée sur notre site ! Vous pourrez ajouter du contenu, organiser vos données, gérer les interactions et développer votre création d'entreprise sur la plateforme.
txt.help.begginer1 = Ajoutez le logo de votre entreprise
txt.help.begginer1.1 = 30 secondes
txt.help.begginer1.2 = Donnez de la visibilité à votre page en ajoutant le logo de votre entreprise. Les pages avec une photo de profil attirent généralement plus de visites. Vous revitalisez votre image de marque.
txt.help.begginer1.3 = Vue d'ensemble > En-tête de page
txt.help.begginer2 = Décrivez la présentation de votre entreprise
txt.help.begginer2.1 = 3 à 5 minutes
txt.help.begginer2.2 = La présentation de votre entreprise est sans doute la section la plus importante de votre page car c'est la porte d'entrée pour la majorité de vos visiteurs. Vous devez donc présenter votre activité sans mettre tout le contenu, vous pourrez ajouter d'autres sections dans les emplacements relatifs plus tard.
txt.help.begginer2.3 = Vue d'ensemble > Présentation
txt.help.begginer3 = Complétez vos informations légales
txt.help.begginer3.1 = 1 à 2 minutes
txt.help.begginer3.2 = Faites la promotion de vos clients ou utilisateurs qui s'identifient à votre entreprise. Un sentiment d'appartenance se forme petit à petit et vous permet de créer un lien de confiance pour fidéliser vos clients.
txt.help.begginer3.3 = Profil de l'entreprise > Informations juridiques
txt.help.begginer4 = Remplissez les mots-clés qui mettent en valeur votre activité
txt.help.begginer4.1 = 1 à 2 minute
txt.help.begginer4.2 = Développez la visibilité de votre page commerciale dans les résultats de recherche et sur le web plus généralement. Votre page se classe en tête des mots clés ciblés que les internautes peuvent saisir pour vous trouver facilement.
txt.help.begginer4.3 = Profil de l'entreprise > Champs sémantique
txt.help.begginer5 = Indiquez vos heures d'ouverture
txt.help.begginer5.1 = 30 secondes
txt.help.begginer5.2 = Encouragez les consommateurs à visiter votre point de vente hors ligne via votre page et/ou assurez un accès continu à vos services en indiquant les heures d'ouverture de votre entreprise.
txt.help.begginer5.3 = Profil de l'entreprise > Coordonnées de contact
txt.help.begginer6 = Intégrer une carte
txt.help.begginer6.1 = 2 à 3 minutes
txt.help.begginer6.2 = Partagez votre position sur la carte google dans la page de votre entreprise et aidez la communauté AlgérieOffice à vous trouver facilement.
txt.help.begginer6.3 = Profil de l'entreprise > Localisation
txt.help.begginer7 = Faites la promotion de votre site Web
txt.help.begginer7.1 = 2 à 3 minutes
txt.help.begginer7.2 = Le site Web est souvent l'un des premiers éléments que votre futur client ou utilisateur verra de votre entreprise, de vos produits et services. Renvoyez votre site à notre plateforme et générez un trafic plus qualifié.
txt.help.begginer7.3 = Profil de l'entreprise > Champs sémantique
txt.help.begginer8 = Déclarez vos réseaux sociaux
txt.help.begginer8.1 = 2 à 3 minutes
txt.help.begginer8.2 = Afin d'avoir une présence en ligne plus forte, indexez vos réseaux sociaux sur votre page et vice versa.
txt.help.begginer8.3 = Profil de l'entreprise > Champs sémantique
txt.help.begginer9 = Ajouter un album photo
txt.help.begginer9.1 = 2 à 3 minutes
txt.help.begginer9.2 = Faites la promotion de votre catalogue de produits ou de votre entreprise de manière ciblée. Cela peut vous aider à terminer votre présentation ou à atteindre un objectif spécifique.
txt.help.begginer9.3 = Vue d'ensemble > Album photos
txt.help.begginer10 = Créer un panorama
txt.help.begginer10.1 = 3 to 5 minutes
txt.help.begginer10.2 = Mettez en avant des produits ou des actualités avec un panorama d'images sur votre page. Vous concevez ainsi une présentation esthétique, mais particulièrement adaptée à vos cibles, à votre activité et à vos contraintes métiers.
txt.help.begginer10.3 = Vue d'ensemble > Panorama
txt.help.begginer11 = Décrivez le mot du président
