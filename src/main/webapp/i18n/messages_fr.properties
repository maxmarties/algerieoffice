txt.help.setting9.2 = L'authentification à 2 facteurs ajoute un niveau supplémentaire de sécurité à votre compte. Une fois activé, pour vous connecter, vous devez saisir un code de vérification unique généré par une application sur votre appareil mobile ou envoyé par SMS, ainsi que votre email et votre mot de passe.
txt.help.setting9.3 = En donnant votre consentement aux finalités ci-dessous, vous autorisez également ce site à effectuer les opérations de traitement de données suivantes: assurer la sécurité, prévenir la fraude et le débogage, diffuser techniquement des publicités ou du contenu, faire correspondre et combiner des sources de données hors ligne.
