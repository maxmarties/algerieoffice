txt.help.begginer12.3 = Vue d'ensemble > En quelques chiffres
txt.help.begginer13 = Ajouter un produit ou service
txt.help.begginer13.1 = 2 à 4 minutes
txt.help.begginer13.2 = Promouvoir vos produits et/ou services en ligne, c'est s'ouvrir au marché national voire mondial. Votre zone de chalandise n'a pas de limite et vous permet d'élargir votre clientèle. Vous pouvez donc réaliser des ventes 24h / 24 et 7j / 7.
txt.help.begginer13.3 = Produits & services > Ajouter
txt.help.begginer14 = Organisez vos produits avec des catégories
txt.help.begginer14.1 = 4 à 6 minutes
txt.help.begginer14.2 = Votre page doit être rigoureusement organisée pour qu'elle soit suffisamment attractive pour attirer les visiteurs, vous devez penser à bien la structurer en créant différentes catégories (et sous-catégories) qui permettront de classer vos offres de manière simple et logique.
txt.help.begginer14.3 = Produits & services > Catégories
txt.help.begginer15 = Publier une actualité
txt.help.begginer15.1 = 1 à 3 minutes
txt.help.begginer15.2 = Travailler votre image peut également vous permettre de justifier votre positionnement face à la concurrence. Communiquez votre actualité à vos contacts pour les informer de vos actualités, de vos promotions ou du contenu de votre site.
txt.help.begginer15.3 = Portefeuille > Actualités
txt.help.begginer16 = Présentez votre chronologie
txt.help.begginer16.1 = 4 à 8 minutes
txt.help.begginer16.2 = Travaillez votre image de marque perçue par vos cibles en présentant votre parcours professionnel avec des dates clés.
txt.help.begginer16.3 = Vue d'ensemble > Timeline
