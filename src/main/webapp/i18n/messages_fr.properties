message.explorer.preview = Votre entreprise n'a pas encore été validée ! Cette page n'est disponible qu'en mode aperçu. Pour rendre cette page accessible au public, veuillez valider l'identité de votre entreprise.
message.explorer.preview1 = Vous êtes en mode aperçu. Seuls les opérateurs de votre entreprise peuvent consulter votre page dans ce mode afin de tester l'outil. Pour vraiment voir le résultat sur votre page en mode public, veuillez vous rendre sur votre compte et cliquer sur le lien de votre page d'entreprise après l'avoir publié.
message.explorer.preview2 = Configurez l'affichage des différents menus et widgets sur votre page afin que vous puissiez présenter votre entreprise en fonction de votre contenu.
message.explorer.preview3 = Intervenez sur l'apparence de votre page en personnalisant le design graphique en fonction de vos couleurs et de votre identité.
message.explorer.presentation = Décrivez la présentation de votre entreprise afin de construire une image de marque en adéquation avec votre identité.
message.explorer.briefcase = Complétez les informations légales de votre entreprise afin de recevoir plus d'opportunités commerciales.
message.explorer.seo = Saisissez les mots-clés qui mettent en évidence l'activité de votre entreprise et qui apparaîtront en premier lorsque les utilisateurs rechercheront vos mots-clés.
message.explorer.shedule = Indiquez les heures d'ouverture de votre entreprise pour assurer un accès continu à vos services.
message.explorer.location = Localisez votre entreprise sur la carte et aidez les utilisateurs a vous trouver facilement.
message.explorer.linked = Déclarez vos sites Web sur la page de votre entreprise afin de générer plus de trafic et d'optimiser votre référencement.
message.explorer.social = Déclarez les réseaux sociaux de votre entreprise pour une indexation plus naturelle de votre page.
message.explorer.post = Boostez la visibilité de vos produits ou services afin de recevoir des demandes de contact qualifiées de prospects intéressés par vos offres (03 éléments minimum sont requis pour votre page d'accueil).
message.explorer.catalog = Présentez votre établissement ou votre activité avec un album photo et donnez à vos visiteurs un aperçu de votre professionnalisme.
message.explorer.slider = Présentez vos actualités ou produits avec un panorama d'images et donnez à vos visiteurs un aperçu de votre professionnalisme.
message.explorer.timeline = Présentez votre parcours professionnel et donnez de la visibilité à vos dates clés.
message.explorer.agent = Déclarez les responsables opérationnels de votre entreprise afin de développer la cartographie de vos travailleurs.
message.explorer.partner = Fidélisez vos partenaires afin d'augmenter votre chiffre d'affaires et développer votre stratégie publicitaire.
message.explorer.sticky = Personnalisez le widget collant sur votre page pour inviter vos visiteurs à vous contacter.
message.explorer.actus = Développez votre prospection commerciale en partageant vos actualités et nouveautés professionnelles.
message.explorer.work = Utilisez au moins (03) trois succès pour pouvoir les afficher sur votre page d'accueil et moderniser votre image de marque.
message.explorer.about = Faites la promotion de votre activité de manière ciblée en laissant une note à vos visiteurs.
message.explorer.think = Envoyez au moins (04) quatre chiffres clés de votre entreprise pour pouvoir les afficher sur votre page d'accueil.
message.explorer.overview1 = Annonce Premium d'une autre entreprise ciblant votre entreprise.
message.explorer.overview2 = Collection d'avis clients approuvés sur votre entreprise.
message.explorer.overview3 = Taux de recommandation de votre page par vos visiteurs.
message.explorer.begginer1 = <strong>Note</strong>: AlgérieOffice est une jeune plateforme récemment déployée sur le monde des affaires en Algérie. Pour que toutes ne soient pas vides, les pages d'entreprise créées tempérament par défaut vous sont présentées à titre d'exemple, soyez prudent.
message.explorer.begginer2 = Si votre entreprise figure parmi ces exemples d'entreprises, vous pouvez enregistrer la vôtre gratuitement ou en demander la suppression via notre formulaire de contact. (Cette notification disparaîtra définitivement en cliquant sur ce bouton à droite).
message.explorer.begginer3 = Parfait !
message.explorer.offer1 = Offre spéciale de Bienvenue !
message.explorer.offer2.1 = AlgérieOffice est une nouvelle plateforme sur le monde des affaires en Algérie permettant à toute activité disposant d'un registre du commerce de bénéficier d'une place de marché gratuitement afin d'optimiser sa visibilité. Rejoignez les <strong>100</strong> premières entreprises enregistrées sur le site avant de réinitialiser ce compteur sur la droite et profitez d'une offre de bienvenue spéciale !
message.explorer.offer2.2 = Vous bénéficiez actuellement d'une offre spéciale de bienvenue en AlgérieOffice. Veuillez valider votre entreprise avant de réinitialiser ce compteur à droite pour pouvoir enregistrer l'offre sur votre entreprise.
