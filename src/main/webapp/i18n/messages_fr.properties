txt.company.overview2 = Décrivez une présentation détaillée de votre entreprise afin de développer la notoriété de votre page. Vous construisez ainsi une image de marque cohérente avec votre identité et vos valeurs.
txt.company.overview2.1 = <strong>Astuce</strong>: pour commencer rapidement à modifier votre texte, veuillez d'abord saisir le texte, puis utiliser les commandes de l'éditeur pour styliser votre texte.
