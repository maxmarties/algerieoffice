txt.company.portfolio5.1.2 = Remplissez tous les champs obligatoires pour pouvoir ajouter un nouveau partenaire. <br> Vous pouvez décider si vous souhaitez afficher ce partenaire sur la page d'accueil de votre entreprise en décochant la case <strong>épingler</strong>.
txt.company.portfolio5.2 = Mettez à jour vos partenaires commerciaux.
txt.company.portfolio5.3 = <strong>Attention</strong>: Vous avez invité <strong>{0}</strong> entreprise(s) à devenir partenaire. Par défaut, les entreprises invitées sont incluses parmi vos partenaires jusqu'à ce que votre demande soit approuvée ou supprimée.
txt.company.profile1.1 = Pour pouvoir diffuser toutes vos informations et publier votre entreprise sur notre site, une validation de son identité est nécessaire.<br>Veuillez remplir tous les champs et choisir votre pièce justificative pour envoyer une demande de validation.
txt.company.profile1.2 = Identifiez votre entreprise sur notre base de données en complétant ses informations sociales. En plus de collecter ces données, nous leur apportons une réelle valeur ajoutée grâce au traitement et à l'enrichissement continu.
txt.company.profile1.3.1 = Votre entreprise n'a pas encore été validée.
txt.company.profile1.3.2 = Par concept de sécurité et afin d'améliorer la confiance entre les sociétés cotées sur algerieoffice.net, nous sommes autorisés à vérifier l'existence réelle de votre société par un justificatif de votre choix contenant les informations légales nécessaires saisies sur cette page.
txt.company.profile1.3.3 = Votre entreprise est en cours de validation par notre équipe pour lui permettre d'être visible auprès des communautés d'AlgérieOffice. Vous recevrez une notification de notre part dès que la validation sera effective. En attendant, vous pouvez déjà commencer à personnaliser votre page d'entreprise.
txt.company.profile1.3.4 = Désolé, votre demande n'a pas pu être validée ! Veuillez confirmer si vous avez choisi un fichier lisible correspondant aux informations envoyées.
txt.company.profile1.4.1 = <strong>Remarque</strong>: vous pouvez modifier ou compléter les informations de votre entreprise sur cette page à tout moment après validation.
txt.company.profile1.4.2 = <strong>Attention</strong>: toute modification ou ajout à cette page implique une nouvelle demande de validation. Pour rappel, seules les sociétés validées par notre équipe de traitement seront visibles sur notre site.
txt.company.profile1.5 = Votre demande a été envoyée avec succès. Vous recevrez une notification de notre part dès que la validation sera effective. En attendant, vous pouvez déjà commencer à personnaliser votre page d'entreprise.
txt.company.profile1.6 = Votre demande a été envoyée avec succès. Vous recevrez une notification de notre part dès que la validation sera effective.
txt.company.profile2 = Augmentez la visibilité de votre page entreprise en complétant vos informations légales pour la propulser parmi les plus vues. Vous recevrez ainsi plus d'opportunités d'affaires !
txt.company.profile3 = Mettez à jour ou complétez vos coordonnées et remplissez vos heures d'ouverture pour assurer un accès continu à vos services. Les entreprises avec plus d'informations de contact sont généralement plus susceptibles d'être plus nombreuses dans les résultats de recherche.
txt.company.profile4 = Lors de la recherche de votre ville, votre entreprise apparaît parmi les autres professionnels dont vous recherchez l'activité. Cependant, si vous avez des bureaux dans plusieurs villes, vous pouvez les déclarer dans la section <strong>Établissements</strong>, et vous pouvez vous trouver directement à ces adresses.
txt.company.profile5 = Améliorez le positionnement de votre entreprise dans les résultats de recherche sur notre site et les moteurs de recherche (Google, Bing) en complétant vos informations pour un référencement naturel. Déclarez vos sites Web et réseaux sociaux afin de générer plus de trafic et d'optimiser votre référencement.
txt.company.profile6 = Complétez les informations pratiques de votre entreprise pour les fonctions de gestion et e-commerce.
