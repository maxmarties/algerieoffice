txt.company.marketplace3 = Publiez gratuitement vos offres d'emploi sur notre marketplace pour trouver le candidat au poste souhaité.
txt.company.marketplace3.1 = Vous recherchez le profil idéal pour votre entreprise ? Placez votre offre d'emploi et recevez des candidatures directement sur la page de votre entreprise.
txt.company.marketplace4.1 = Augmentez la visibilité de votre publicité sur notre plateforme et commencez à recevoir des contacts qualifiés, des demandes de devis et du trafic vers votre site.
txt.company.marketplace4.2 = Pour diffuser votre publicité sur notre site, vous ne payez que le nombre d'affichages que vous souhaitez obtenir.<br>Sélectionnez la formule adaptée à vos besoins en fonction du volume de visites enregistré sur votre annonce.
txt.company.marketplace4.3 = Votre publicité sera affichée sur les pages des entreprises jusqu'à ce que le niveau d'affichage sélectionné soit atteint. Une fois ce seuil atteint, AlgérieOffice cessera d'afficher votre annonce jusqu'à votre prochaine échéance.<br>Vous pouvez renouveler ou ajouter des budgets à tout moment après l'enregistrement de votre annonce.
txt.company.marketplace5.1 = Effectuez un paiement via mandat ccp puis envoyez-nous le bulletin de virement via ce formulaire.
txt.company.marketplace5.2 = La validation de votre crédit par nos équipes peut prendre jusqu'à 48 heures. Vous recevrez ainsi une notification de notre part dès que la validation sera effective.<br>Pour toutes informations sur les paiements, vous pouvez nous appeler au 048 766 499 et/ou 05 60 607 498 du dimanche au jeudi de 9h00 à 18h00.
txt.company.marketplace5.2.1 = Veuillez utiliser ces informations pour remplir le formulaire d'opérations financières postales, section <strong>Bénéficiaire</strong>.
txt.company.marketplace5.3 = Une demande de paiement pour une annonce premium est en cours de validation. Vous pouvez ajouter des budgets dès que la validation sera effective. Vous recevrez une notification de notre part, soyez patient !
txt.company.marketplace5.4 = Une demande de paiement pour une campagne est en cours de validation. Vous pouvez ajouter des budgets dès que la validation sera effective. Vous recevrez une notification de notre part, soyez patient !
txt.company.marketplace6 = Affichez-vous sur les tableaux de bord des entreprises. Une solution simple, rapide et efficace pour booster la visibilité de vos offres et de votre trafic.
txt.company.marketplace6.1 = Faites la promotion de vos offres commerciales et de l'actualité B2B pour développer votre activité en affichant vos annonces sur les tableaux de bord des entreprises de votre choix.
txt.company.marketplace6.2 = Publiez votre promotion sur les tableaux de bord des entreprises de notre plateforme et commencez à recevoir du trafic BtoB vers votre page entreprise.
txt.company.marketplace6.3 = Pour diffuser votre campagne sur notre site, vous ne payez que le nombre de clics que vous souhaitez obtenir.<br>Sélectionnez le pack adapté à vos besoins en fonction du volume de trafic à recevoir sur votre promotion.
txt.company.marketplace6.4 = L'affichage de votre campagne sur les tableaux de bord des entreprises se fera jusqu'à ce que le niveau de clic sélectionné soit atteint. Une fois ce seuil atteint, AlgérieOffice cessera d'afficher votre campagne jusqu'à votre prochaine échéance.<br>Vous pouvez renouveler ou ajouter des budgets à tout moment après avoir enregistré votre promotion.
txt.company.overview1 = Agissez sur l'apparence de votre page en personnalisant son en-tête pour capturer vos visites dès son arrivée sur votre entreprise.
