txt.infos.politic1.2 = وفقًا للالتزامات القانونية ، يضع موقعنا حماية البيانات الشخصية في صميم مهامه والخدمات المقدمة لك.
txt.infos.politic1.2.1 = نحن نعتبر أن بياناتك الشخصية (اسمك وعنوانك البريدي ورقم هاتفك وعنوان بريدك الإلكتروني) بالإضافة إلى أي بيانات يتم إرسالها على موقعنا أو يتم إنشاؤها عن طريق تصفحك تشكل بيانات شخصية.
txt.infos.politic1.2.2 = تشرح لك هذه الوثيقة مبادئ والتزامات ألجيري أوفيس لحماية بياناتك الشخصية وتهدف إلى إعلامك بها
txt.infos.politic1.2.2.1 = البيانات الشخصية التي يجمعها ألجيري أوفيس وأسباب هذه المجموعة.
txt.infos.politic1.2.2.2 = البيانات الشخصية التي يحتفظ بها ألجيري أوفيس من شركائه.
txt.infos.politic1.2.2.3 = الطريقة التي سيتم بها استخدام هذه البيانات الشخصية.
txt.infos.politic1.2.2.4 = حقوقك كشخص معني بمعالجة البيانات هذه.
txt.infos.politic1.2.3 = تنطبق هذه السياسة على جميع خدمات ألجيري أوفيس بغض النظر عن طبيعتها (مواقع ، تطبيقات ، خدمات ، إلخ).
txt.infos.politic2.1 = المسؤول عن معالجة بياناتك
txt.infos.politic2.2 = مراقب البيانات هو ألجيري أوفيس. تفاصيل الاتصال هي على النحو التالي
