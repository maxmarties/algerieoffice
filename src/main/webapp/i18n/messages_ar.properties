message.explorer.preview = لم يتم التحقق من صحة شركتك بعد! هذه الصفحة متاحة فقط في وضع المعاينة. لجعل هذه الصفحة متاحة للجمهور ، يرجى التحقق من صحة هوية شركتك.
message.explorer.preview1 = أنت في وضع المعاينة. يمكن فقط لمشغلي شركتك مراجعة صفحتك في هذا الوضع لاختبار الأداة. لرؤية النتيجة حقًا على صفحتك في الوضع العام ، يرجى الانتقال إلى حسابك والنقر على رابط صفحة عملك بعد نشرها.
message.explorer.preview2 = تكوين عرض القوائم المختلفة وعناصر واجهة المستخدم على صفحتك حتى تتمكن من تقديم شركتك وفقًا للمحتوى الخاص بك.
message.explorer.preview3 = التدخل في مظهر صفحتك من خلال تخصيص التصميم الجرافيكي وفقًا لألوانك وهويتك.
message.explorer.presentation = صف العرض التقديمي لشركتك من أجل بناء صورة علامة تجارية تتماشى مع هويتك.
message.explorer.briefcase = أكمل المعلومات القانونية لشركتك من أجل الحصول على المزيد من فرص العمل.
message.explorer.seo = أدخل الكلمات الرئيسية التي تبرز نشاط شركتك وستظهر أولاً عندما يبحث المستخدمون عن كلماتك الرئيسية.
message.explorer.shedule = حدد ساعات عمل عملك لضمان الوصول المستمر إلى خدماتك.
message.explorer.location = تحديد موقع عملك على الخريطة ومساعدة المستخدم في العثور عليك بسهولة.
message.explorer.linked = قم بالإعلان عن مواقع الويب الخاصة بك على صفحة عملك من أجل توليد المزيد من الحركة وتحسين مُحسنات محركات البحث الخاصة بك.
message.explorer.social = قم بالإعلان عن الشبكات الاجتماعية لشركتك للحصول على فهرسة طبيعية أكثر لصفحتك.
message.explorer.post = عزز ظهور منتجاتك أو خدماتك لتلقي طلبات اتصال مؤهلة من العملاء المحتملين المهتمين بعروضك.
message.explorer.catalog = قدم مؤسستك أو نشاطك بألبوم صور وامنح زوار موقعك لمحة عن احترافك.
message.explorer.slider = قدم أخبارك أو منتجاتك مع بانوراما للصور وامنح زوارك لمحة عن احترافك.
message.explorer.timeline = عرض خلفيتك المهنية وإبراز التواريخ الرئيسية.
message.explorer.agent = إفصاح عن المديرين التشغيليين لشركتك من أجل تطوير خرائط العمال لديك.
message.explorer.partner = احتفظ بشركائك لزيادة مبيعاتك وتطوير إستراتيجيتك الإعلانية.
message.explorer.sticky = تخصيص الأداة اللاصقة على صفحتك لدعوة زوارك للاتصال بك.
message.explorer.actus = طور عمليات البحث التجارية الخاصة بك من خلال مشاركة الأخبار والمستجدات المهنية الخاصة بك.
message.explorer.work = استخدم (03) ثلاثة إنجازات على الأقل لتتمكن من عرضها على صفحتك الرئيسية وتحديث علامتك التجارية.
message.explorer.about = روّج لنشاطك بطريقة مستهدفة من خلال ترك ملاحظة للزائرين.
message.explorer.think = أرسل على الأقل (04) أربع شخصيات رئيسية لشركتك لتتمكن من عرضها على صفحتك الرئيسية.
message.explorer.overview1 = إعلان مميز من نشاط تجاري آخر يستهدف عملك.
message.explorer.overview2 = مجموعة من مراجعات العملاء المعتمدة حول عملك.
message.explorer.overview3 = معدل توصية زوارك بصفحتك.
message.explorer.begginer1 = <strong>ملاحظة</strong>: ألجيري أوفيس هي عبارة عن منصة حديثة تم نشرها مؤخرًا في عالم الأعمال في الجزائر. حتى لا تكون جميعها فارغة ، يتم تقديم بعض صفحات الشركات التي تم إنشاؤها بواسطة مزاج افتراضي كمثال ، يرجى توخي الحذر.
message.explorer.begginer2 = إذا ظهرت شركتك بين هذه الشركات النموذجية ، فيمكنك تسجيل شركتك مجانًا أو طلب حذفها عبر نموذج الاتصال الخاص بنا. (سيختفي هذا الإشعار نهائيًا بالنقر فوق هذا الزر الموجود على اليسار).
message.explorer.begginer3 = ممتاز!
