txt.infos.credit1.5 = هذا الموقع هو ملك لشركة Rinitec Développement® ، وهي شركة صغيرة ومتوسطة برأسمال 7،400،000 دينار جزائري. المعلومات التي يقدمها عرضة للتغيير في أي وقت دون إشعار ويتم توفيرها فقط لمستخدمي الإنترنت للحصول على معلومات. ليس لديهم طبيعة تعاقدية.
