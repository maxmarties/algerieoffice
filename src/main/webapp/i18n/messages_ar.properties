# AUTH
auth.message.badCredentials = بريد إلكتروني أو كلمة مرور غير صحيحة.
auth.message.disabled = حسابك معطل. يرجى التحقق من صندوق البريد الإلكتروني الخاص بك والنقر على رابط التنشيط.
auth.message.locked = حسابك غير نشط. الرجاء الاتصال بالمسؤول.
auth.message.expired = حسابك مغلق. يرجى الاتصال بالدعم الفني لدينا.
auth.message.blocked = عنوان IP هذا محجوب لمدة 24 ساعة.
auth.message.invalid = جلستك انتهت صلاحيتها. الرجاء الاتصال مرة أخرى.
auth.message.emailing = حدث خطأ غير متوقع في مزود البريد الإلكتروني ، يرجى المحاولة مرة أخرى لاحقًا.
auth.recaptcha.message.clientExceeded = لقد تجاوزت الحد الأقصى لعدد المحاولات الفاشلة.
auth.recaptcha.message.responseInvalide = تحتوي استجابة reCaptcha على أحرف غير صالحة.
auth.recaptcha.message.notValidated = reCaptcha لم يتم التحقق منه بنجاح.
auth.recaptcha.message.unavailable = التسجيل غير متاح حاليًا. الرجاء معاودة المحاولة في وقت لاحق.
auth.recaptcha.message.expired = انتهت صلاحية التحقق من reCaptcha! حدد المربع مرة أخرى.
auth.oauth2.unavailable = حدث خطأ غير متوقع في المزود الاجتماعي ، يرجى المحاولة مرة أخرى لاحقًا.
auth.oauth2.notSupported = عذرًا ، الاتصال بهذا الموفر غير مدعوم حتى الآن.
auth.oauth2.nameNotfound = الاسم غير موجود من مزود الخدمة الاجتماعية الخاص بك!
auth.oauth2.mailNotfound = البريد الإلكتروني غير موجود من مزود الخدمة الاجتماعية الخاص بك!

# MESSAGES
message.premium.marketplace = لم يتم التحقق من صحة شركتك بعد. يمكنك نشر عروضك وإعلاناتك بمجرد أن يصبح التحقق من صحة شركتك ساريًا.<br>لمزيد من المعلومات ، يرجى الرجوع إلى حالة الشركة في القسم
message.premium.portfolio = لم يتم التحقق من صحة شركتك بعد. يمكنك توزيع محفظتك بمجرد تفعيل التحقق من صحة شركتك.<br>لمزيد من المعلومات ، يرجى الرجوع إلى النظام الأساسي للشركة في القسم
message.premium.actu = تم الوصول إلى الحد الأقصى لعدد الأخبار وفقًا لخطة الاشتراك الخاصة بك.<br>لمزيد من المعلومات ، يرجى الاطلاع على الخصائص المختلفة في القسم
message.premium.event = تم الوصول إلى الحد الأقصى لعدد الأحداث وفقًا لخطة الاشتراك الخاصة بك.<br>لمزيد من المعلومات ، يرجى الاطلاع على الخصائص المختلفة في القسم
message.premium.faq = تم الوصول إلى الحد الأقصى لعدد النصائح وفقًا لخطة اشتراكك.<br>لمزيد من المعلومات ، يرجى الاطلاع على الخصائص المختلفة في القسم
message.premium.partner = تم الوصول إلى الحد الأقصى لعدد الشركاء وفقًا لخطة اشتراكك.<br>لمزيد من المعلومات ، يرجى الاطلاع على الخصائص المختلفة في القسم
message.premium.post = لقد وصلت إلى الحد الأقصى لعدد إضافات المنتجات وفقًا لخطة الاشتراك الخاصة بك.<br>لمزيد من المعلومات ، يرجى الاطلاع على السمات المختلفة الخاصة بك في القسم
message.premium.user = تم الوصول إلى الحد الأقصى لعدد المستخدمين وفقًا لخطة الاشتراك الخاصة بك.<br>لمزيد من المعلومات ، يرجى الاطلاع على الخصائص المختلفة في القسم
message.premium.agent = تم الوصول إلى الحد الأقصى لعدد القادة وفقًا لخطة اشتراكك.<br>لمزيد من المعلومات ، يرجى الرجوع إلى الخصائص المختلفة في القسم
message.premium.work = تم الوصول إلى الحد الأقصى لعدد المشاريع وفقًا لخطة الاشتراك الخاصة بك.<br>لمزيد من المعلومات ، يرجى الاطلاع على الخصائص المختلفة في القسم
message.premium.analytic = أنت تستفيد حاليًا من اشتراك مجاني في ألجيري أوفيس. كن مميزًا لتتمكن من الوصول إلى أداة تحليلية حقيقية لحركة العرؤض الخاصة بك على موقعنا.<br>لمزيد من المعلومات ، يرجى الرجوع إلى عروضنا بالتفصيل في قسم "الأدوات > الاشتراك".
message.premium.communication = أنت تستفيد حاليًا من اشتراك مجاني في  ألجيري أوفيس. كن مميزًا لتتمكن من استشارة تفاعلات غير محدودة مع صفحتك وطلبات عروض الأسعار والرسائل المكتوبة والمزيد.<br>لمزيد من المعلومات ، يرجى الرجوع إلى عروضنا بالتفصيل في قسم "الأدوات > الاشتراك".
message.premium.appearance = أنت تستفيد حاليًا من اشتراك مجاني في ألجيري أوفيس. كن مميزًا لتتمكن من تخصيص مظهر المظهر الرسومي لصفحتك.<br>لمزيد من المعلومات ، يرجى الرجوع إلى عروضنا بالتفصيل في قسم "الأدوات > الاشتراك".
message.premium.journal = أنت تستفيد حاليًا من اشتراك مجاني في ألجيري أوفيس. كن مميزًا للوصول إلى النشاط الكامل لآخر 180 يومًا وتصفية الأحداث حسب النطاق الزمني.<br>لمزيد من المعلومات ، يرجى الرجوع إلى عروضنا بالتفصيل في قسم "الأدوات > الاشتراك".
message.premium.subscribe = لم يتم التحقق من صحة شركتك بعد. يمكنك الترقية إلى خطة مدفوعة بمجرد أن يصبح التحقق من صحة عملك ساريًا.<br>لمزيد من المعلومات ، يرجى الاطلاع على حالة العمل في القسم
message.premium.emailing = لم يتم التحقق من صحة شركتك بعد. يمكنك توزيع رسالتك الإخبارية بمجرد أن يتم التحقق من صحة شركتك.<br>لمزيد من المعلومات ، يرجى مراجعة حالة الشركة في القسم
message.premium.detect = مطلوب حد أدنى من الاشتراك "ريجيلار" المميز للوصول إلى حل الكشف. قم بترقية خطتك لمعاينة زيارات صفحتك خلال الأشهر الستة الماضية وتصفية الأحداث حسب نطاق التاريخ.<br>لمزيد من المعلومات ، يرجى الاطلاع على عروضنا بالتفصيل في قسم "الأدوات > الاشتراك".
message.premium.analyse = قم بترقية خطة اشتراكك إلى خطة مدفوعة عادية كحد أدنى من أجل فتح أدوات تحليلات الأعمال البارزة. يؤدي هذا إلى زيادة قياسات تحليل حركة المرور الخاصة بك.<br>لمزيد من المعلومات ، يرجى الرجوع إلى عروضنا بالتفصيل في قسم "الأدوات > الاشتراك".
message.premium.statistic = أنت تستفيد حاليًا من اشتراك مجاني في ألجيري أوفيس. كن مميزًا لمعاينة إحصائيات منتجاتك وتحسين حركة الضهور على موقعنا.<br>لمزيد من المعلومات ، يرجى الرجوع إلى عروضنا بالتفصيل في قسم "الأدوات > الاشتراك".
message.premium.dashboard = أنت تستفيد حاليًا من اشتراك مجاني في ألجيري أوفيس. كن مميزًا لفتح الأنشطة الأخرى على لوحة التحكم.<br>لمزيد من المعلومات ، يرجى الرجوع إلى عروضنا بالتفصيل في قسم "الأدوات > الاشتراك".
message.premium.easylist = أنت تستفيد حاليًا من الباقة المجانية في ألجيري أوفيس. كن مميزًا لتتمكن من الرجوع إلى تفاصيل غير محدودة لقوائمك المحفوظة. <br>لمزيد من المعلومات ، يرجى الرجوع إلى عروضنا بالتفصيل في قسم "الأدوات > الاشتراك".
message.plan.usedspace = مساحة تخزين غير كافية. الرجاء مراجعة قسم "المستندات" لتحرير مساحة جديدة.
message.plan.post = تم الوصول إلى الحد الأقصى لعدد المنتجات. استشر خطة اشتراكك لمعرفة المزيد.
message.plan.user = تم الوصول إلى الحد الأقصى لعدد المستخدمين. استشر خطة اشتراكك لمعرفة المزيد.
message.plan.agent = تم الوصول إلى الحد الأقصى لعدد المديرين. استشر خطة اشتراكك لمعرفة المزيد.
message.plan.works = تم الوصول إلى الحد الأقصى لعدد عمليات الإنجاز. استشر خطة اشتراكك لمعرفة المزيد.
message.plan.actus = تم الوصول إلى الحد الأقصى لعدد الأخبار. استشر خطة اشتراكك لمعرفة المزيد.
message.plan.events = تم بلوغ الحد الأقصى لعدد الأحداث. استشر خطة اشتراكك لمعرفة المزيد.
message.plan.partner = تم الوصول إلى الحد الأقصى لعدد الشركاء. استشر خطة اشتراكك لمعرفة المزيد.
message.plan.faq = تم الوصول إلى الحد الأقصى لعدد الأسئلة. استشر خطة اشتراكك لمعرفة المزيد.
message.plan.data = تم الوصول إلى الحد الأقصى لعدد المقالات. الرجاء حذف المقالات لإضافة أخرى جديدة. تذكر إفراغ سلة المهملات!
message.plan.topic = تم بلوغ الحد الأقصى لعدد المواضيع. يرجى حذف المواضيع الموجودة لإضافة مواضيع جديدة.
message.plan.easylist = تم بلوغ الحد الأقصى لعدد القوائم. الرجاء حذف القوائم الموجودة لإضافة قوائم جديدة.
message.explorer.preview = لم يتم التحقق من صحة شركتك بعد! هذه الصفحة متاحة فقط في وضع المعاينة. لجعل هذه الصفحة متاحة للجمهور ، يرجى التحقق من صحة هوية شركتك.
message.explorer.preview1 = أنت في وضع المعاينة. يمكن فقط لمشغلي شركتك مراجعة صفحتك في هذا الوضع لاختبار الأداة. لرؤية النتيجة حقًا على صفحتك في الوضع العام ، يرجى الانتقال إلى حسابك والنقر على رابط صفحة عملك بعد نشرها.
message.explorer.preview2 = تكوين عرض القوائم المختلفة وعناصر واجهة المستخدم على صفحتك حتى تتمكن من تقديم شركتك وفقًا للمحتوى الخاص بك.
message.explorer.preview3 = التدخل في مظهر صفحتك من خلال تخصيص التصميم الجرافيكي وفقًا لألوانك وهويتك.
message.explorer.presentation = صف العرض التقديمي لشركتك من أجل بناء صورة علامة تجارية تتماشى مع هويتك.
message.explorer.briefcase = أكمل المعلومات القانونية لشركتك من أجل الحصول على المزيد من فرص العمل.
message.explorer.seo = أدخل الكلمات الرئيسية التي تبرز نشاط شركتك وستظهر أولاً عندما يبحث المستخدمون عن كلماتك الرئيسية.
message.explorer.shedule = حدد ساعات عمل عملك لضمان الوصول المستمر إلى خدماتك.
message.explorer.location = تحديد موقع عملك على الخريطة ومساعدة المستخدم في العثور عليك بسهولة.
message.explorer.linked = قم بالإعلان عن مواقع الويب الخاصة بك على صفحة عملك من أجل توليد المزيد من الحركة وتحسين مُحسنات محركات البحث الخاصة بك.
message.explorer.social = قم بالإعلان عن الشبكات الاجتماعية لشركتك للحصول على فهرسة طبيعية أكثر لصفحتك.
message.explorer.post = عزز ظهور منتجاتك أو خدماتك لتلقي طلبات اتصال مؤهلة من العملاء المحتملين المهتمين بعروضك (مطلوب 03 عناصر كحد أدنى لصفحتك الرئيسية).
message.explorer.catalog = قدم مؤسستك أو نشاطك بألبوم صور وامنح زوار موقعك لمحة عن احترافك.
message.explorer.slider = قدم أخبارك أو منتجاتك مع بانوراما للصور وامنح زوارك لمحة عن احترافك.
message.explorer.timeline = عرض خلفيتك المهنية وإبراز التواريخ الرئيسية.
message.explorer.agent = إفصاح عن المديرين التشغيليين لشركتك من أجل تطوير خرائط العمال لديك.
message.explorer.partner = احتفظ بشركائك لزيادة مبيعاتك وتطوير إستراتيجيتك الإعلانية.
message.explorer.sticky = تخصيص الأداة اللاصقة على صفحتك لدعوة زوارك للاتصال بك.
message.explorer.actus = طور عمليات البحث التجارية الخاصة بك من خلال مشاركة الأخبار والمستجدات المهنية الخاصة بك.
message.explorer.work = استخدم (03) ثلاثة إنجازات على الأقل لتتمكن من عرضها على صفحتك الرئيسية وتحديث علامتك التجارية.
message.explorer.about = روّج لنشاطك بطريقة مستهدفة من خلال ترك ملاحظة للزائرين.
message.explorer.think = أرسل على الأقل (04) أربع أرقام رئيسية لشركتك لتتمكن من عرضها على صفحتك الرئيسية.
message.explorer.overview1 = إعلان مميز من نشاط تجاري آخر يستهدف عملك.
message.explorer.overview2 = مجموعة من مراجعات العملاء المعتمدة حول عملك.
message.explorer.overview3 = معدل توصية زوارك بصفحتك.
message.explorer.begginer1 = <strong>ملاحظة</strong>: ألجيري أوفيس هي عبارة عن منصة حديثة تم نشرها مؤخرًا في عالم الأعمال في الجزائر. حتى لا تكون جميعها فارغة ، يتم تقديم صفحات الشركات التي تم إنشاؤها بواسطة مزاج افتراضي كمثال ، يرجى توخي الحذر.
message.explorer.begginer2 = إذا ظهرت شركتك بين هذه الشركات النموذجية ، فيمكنك تسجيل شركتك مجانًا أو طلب حذفها عبر نموذج الاتصال الخاص بنا. (سيختفي هذا الإشعار نهائيًا بالنقر فوق هذا الزر الموجود على اليسار).
message.explorer.begginer3 = ممتاز !
message.explorer.offer1 = عرض ترحيبي خاص !
message.explorer.offer2.1 = ألجيي أوفيس هو عبارة عن منصة جديدة في عالم الأعمال في الجزائر تسمح لأي نشاط له سجل تجاري بالاستفادة من سوق حرة مجانا من أجل تحسين ظهوره. انضم إلى أول <strong>100</strong> شركة مسجلة في الموقع قبل إعادة تعيين هذا العداد على اليسار واستفد من عرض ترحيبي خاص !
message.explorer.offer2.2 = أنت تستفيد حاليًا من عرض ترحيبي خاص في ألجيري أوفيس. يرجى التحقق من صحة شركتك قبل إعادة تعيين هذا العداد على السيار لتتمكن من تسجيل العرض في شركتك.
message.explorer.offer3 = (سيختفي هذا الإشعار نهائيًا من خلال النقر على هذا الزر الأحمر على السيار).
message.explorer.offer4.1 = أنا أستفيد
message.explorer.offer4.2 = تحقق الآن !
message.explorer.offer4.3 = متبقي.
message.browser.presentation = هذه الشركة لم تنشر عرضها بعد.
message.browser.shedule = لم تدخل هذه الشركة ساعات عملها بعد.
message.browser.linked = هذه الشركة ليس لديها موقع ويب.
message.browser.location = لم تحدد هذه الشركة عنوانها على الخريطة بعد.
message.browser.timeline = هذه الشركة لا تنشر سجلها أو قررت الحفاظ عليه سريًا.
message.browser.agent = لا يوجد قائد لعرضه!
message.browser.notice = لا توجد تعليقات من العملاء حول هذه الشركة حتى الآن ، كن أول من يترك تعليقًا.
message.browser.evaluation = لا توجد توصية لهذه الشركة حتى الآن.
message.browser.annonce2 = قم بتسجيل الدخول لتتمكن من الوصول إلى تفاصيل هذا الإعلان.
message.browser.annonce3 = كن محترفًا لتتمكن من الوصول إلى تفاصيل هذا الإعلان.
message.browser.annonce4 = كن مميزًا لتتمكن من الوصول إلى تفاصيل هذا الإعلان.
message.browser.annonce5 = اشترك في هذه الشركة للوصول إلى تفاصيل الإعلان.
