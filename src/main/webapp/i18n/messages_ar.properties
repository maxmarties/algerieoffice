txt.infos.politic3.1 = ممارسة حق الوصول
txt.infos.politic3.2 = كيف يقوم ألجيري أوفيس بتنفيذ حماية البيانات الشخصية؟
txt.infos.politic3.2.1 = يتعهد ألجيري أوفيس بمراعاة حماية البيانات الشخصية من تصميم الخدمات المقدمة لك (الخصوصية حسب التصميم). لضمان الأمن وضمان الاحترام والممارسة المناسبة لحقوقك ، يتم تنفيذ تدابير لضمان حماية البيانات الشخصية (الخصوصية افتراضيًا).
txt.infos.politic3.3 = ما هي البيانات التي يجمعها ويستخدمها ألجيري أوفيس؟
txt.infos.politic3.3.1 = يتعهد ألجيري أوفيس بجمع البيانات الضرورية فقط لغرض المتابعة والتوضيح مع الأشخاص المعنيين ، مما يترك لهم القدرة الكاملة على ممارسة حقوقهم. البيانات الشخصية التي من المحتمل أن يتم جمعها ، اعتمادًا على طبيعة الخدمات المقدمة ، هي كما يلي
txt.infos.politic3.3.1.1 = الإسم واللقب
txt.infos.politic3.3.1.2 = العنوان ، الرمز البريدي ، المدينة
txt.infos.politic3.3.1.3 = الهاتف
txt.infos.politic3.3.1.4 = البريد الإلكتروني
txt.infos.politic3.3.1.5 = الموقف المتخذ
txt.infos.politic3.3.1.6 = عنوان IP
txt.infos.politic3.3.2 = في حالة طلب بيانات اختيارية ، سيقوم ألجيري أوفيس بإعلامك بوضوح بالبيانات الشخصية اللازمة لأداء الخدمة.
txt.infos.politic3.3.3 = يتم جمع البيانات الشخصية منك مباشرةً ويتم استخدامها فقط للأغراض التي تم لفت انتباهك إليها.
txt.infos.politic3.4 = ما هو أساس شرعية المعالجة التي يقوم بها ألجيري أوفيس؟
txt.infos.politic3.4.1 = يعتمد ألجيري أوفيس على الأسس الشرعية التالية من أجل التمكن من معالجة البيانات الشخصية
txt.infos.politic3.4.1.1 = تنفيذ العقد
txt.infos.politic3.4.1.2 = عندما يكون الأساس القانوني لمعالجة البيانات الشخصية للمستخدم التي يتم جمعها هو أداء العقد. في هذا الصدد ، يلتزم المستخدم بتوفير البيانات اللازمة لتنفيذه.
txt.infos.politic3.4.2.1 = الإلتزامات القانونية
txt.infos.politic3.4.2.2 = عندما يكون الاحتفاظ بالبيانات الشخصية وجمعها واستخدامها التزامًا قانونيًا لصاحب البيانات.
txt.infos.politic3.4.3.1 = الموافقة
txt.infos.politic3.4.3.2 = للأغراض التالية ، سيكون الأساس القانوني لمعالجة البيانات الشخصية للمستخدم هو موافقة المستخدم ، في حالة قيامه بذلك.
txt.infos.politic3.4.3.2.1 = إدارة التسجيل في صفحات الشركات.
txt.infos.politic3.4.3.2.2 = إدارة إرسال المعلومات عن منتجات وخدمات الشركة وشركائها.
txt.infos.politic3.4.3.2.3 = الرد على ممارسة حقوق الوصول إلى التعديل والإلغاء والمعارضة ، وكذلك على أسئلة وشكاوى المستخدم.
txt.infos.politic3.4.3.2.4 = الاتصال من أجل الاستجابة لطلبات المعلومات المعبر عنها من خلال نماذجنا.
txt.infos.politic3.4.3.2.5 = نقل تفاصيل الاتصال إلى أطراف ثالثة (اتصال ، استجابة لحاجة يتم التعبير عنها من خلال حملة ، إلخ).
txt.infos.politic3.4.4 = إن سحب الموافقة على هذه العلاجات من قبل المستخدم لن يشترط تنفيذ العقد لتقديم المعلومات التي أبرمها الشخص المعني مع ألجيري أوفيس.
txt.infos.politic3.5 = هل بياناتي الشخصية محمية؟
txt.infos.politic3.5.1 = يتعهد ألجيري أوفيس باتخاذ كافة الإجراءات لضمان أمن وسرية البيانات الشخصية وعلى وجه الخصوص لمنع إتلافها أو محوها أو وصول أطراف ثالثة غير مصرح لها إليها.
txt.infos.politic3.5.2 = بالإضافة إلى ذلك ، في حالة وقوع حادث أمني يؤثر على بياناتك الشخصية (إتلاف أو فقدان أو تغيير أو إفشاء) ، يتعهد ألجيري أوفيس بالامتثال لالتزام الإبلاغ عن انتهاكات البيانات الشخصية.
txt.infos.politic4.1 = تعديل هذه السياسة
txt.infos.politic4.2 = سيتم نشر تحديثات سياسة الخصوصية هذه على موقع ألجيري أوفيس. سنقوم أيضًا بنشر إشعار على الموقع مع سياسة الخصوصية المحدثة.
txt.infos.politic5.1 = قائمة المصطلحات
txt.infos.politic5.1.1.1 = سياسة الخصوصية وحماية البيانات
txt.infos.politic5.1.1.2 = تعني هذه السياسة التي تصف التدابير المتخذة لمعالجة واستخدام وإدارة البيانات الشخصية وحقوق أي شخص يتأثر بالمعالجة.
txt.infos.politic5.1.2.1 = بيانات شخصية
txt.infos.politic5.1.2.2 = يحدد أي معلومات تتعلق بأي شخص طبيعي ويجعل من الممكن التعرف عليه بشكل مباشر أو غير مباشر.
txt.infos.politic5.1.3.1 = علاج
txt.infos.politic5.1.3.2 = تعني أي عملية أو مجموعة عمليات مطبقة على البيانات الشخصية.
txt.infos.politic5.1.4.1 = مسؤول عن المعالجة
txt.infos.politic5.1.4.2 = يشير إلى الشخص الذي يقوم بمعالجة البيانات الشخصية.
txt.infos.politic5.1.5.1 = خرق البيانات
txt.infos.politic5.1.5.2 = يعني خرقًا للأمن ، ينتج ، عن طريق الخطأ أو بشكل غير قانوني ، في إتلاف البيانات الشخصية أو فقدانها أو تغييرها أو الكشف عنها أو الوصول غير المصرح به إلى البيانات الشخصية.
txt.infos.politic5.1.6.1 = متلقي
txt.infos.politic5.1.6.2 = يشير إلى الخدمة أو الشركة التي تتلقى الاتصالات ويمكنها الوصول إلى البيانات الشخصية.
txt.infos.condition1 = شروط الخدمة
txt.infos.condition1.1 = تعريفات
txt.infos.condition1.1.1.1 = ألجيري أوفيس
txt.infos.condition1.1.1.2 = يشير إلى البوابة المهنية للشركات في الجزائر ، والمتاحة للوصول المجاني عبر عنوان الويب www.algerieoffice.net الذي تقدمه شركة Rinitec Développement® ، برأس مال قدره 7،400،000 دينار جزائري ، مسجلة لدىPME SRC تحت رقم 22/00-0168426A18 ، والتي المكتب الرئيسي في 10 حي البرقية - سيدي بلعباس ، ناشر برامج ومزود خدمة ويب.
txt.infos.condition1.1.2.1 = عميل
txt.infos.condition1.1.2.2 = تعني أي شخص محترف (طبيعي أو اعتباري) يطلب خدمة (خدمات) من ألجيري أوفيس. يمكن فقط للأشخاص الذين يعملون لتلبية احتياجاتهم المهنية وكجزء من نشاطهم المهني طلب الخدمة (الخدمات) من ألجيرري أوفيس.
txt.infos.condition1.1.3.1 = موقع
txt.infos.condition1.1.3.2 = يشير إلى موقع الويب الذي يمكن الوصول إليه على المجال www.algerieoffice.net والذي يتم تحريره بواسطة Rinitec Développement® والذي يمكن للعملاء طلب الخدمات أو استخدامها.
txt.infos.condition1.1.4.1 = خدمات
txt.infos.condition1.1.4.2 = تعني الخدمات التي يقدمها ألجيري أوفيس للعميل عبر الهاتف أو على الموقع ومن المحتمل أن تكون موضوع طلب.
txt.infos.condition1.1.5.1 = اشتراك
txt.infos.condition1.1.5.2 = يعني أي أمر له هدف اشتراك يسمح للعميل المشترك بالوصول إلى خدمة (خدمات) واحدة أو أكثر لفترة محددة ، وفقًا للشروط والحدود المحددة في عرض الاشتراك.
txt.infos.condition1.1.6.1 = طلب
txt.infos.condition1.1.6.2 = يعني أي طلب للحصول على خدمة (خدمات) يقدمه العميل إلى ألجيري أوفيس ، مدفوعًا أو مجانيًا ، يتم إجراؤه عبر الهاتف أو الإنترنت على الموقع أو بأي وسيلة أخرى سواء كان الاشتراك في اشتراك شراء لمرة واحدة من خدمة أو طلب خدمة مجانية.
txt.infos.condition1.1.7.1 = حساب
txt.infos.condition1.1.7.2 = يعني الحساب الفردي للعميل ، مما يسمح له على وجه الخصوص بتقديم طلب للحصول على خدمة (خدمات) أو استخدام كل أو جزء من وظائف خدمة واحدة أو أكثر ، من خلال الاتصال بحسابه على الموقع المعني بالخدمة مع اسم المستخدم الشخصي وكلمة المرور.
txt.infos.condition1.1.8.1 = قاعدة معطيات
txt.infos.condition1.1.8.2 = يشير إلى قواعد البيانات الخاصة بالشركات التابعة لألجيري أوفيس.
txt.infos.condition1.1.9.1 = ملف جهات الاتصال
txt.infos.condition1.1.9.2 = تعني أي مجموعة من البيانات من قاعدة البيانات يستخدمها العميل لتنفيذ حملات التسويق المباشر.
txt.infos.condition1.1.10.1 = البيانات
txt.infos.condition1.1.10.2 = تعيين جميع البيانات أو المعلومات ، من أي نوع كانت ، المنشورة من قبل ألجيري أوفيس على الموقع و/أو نقلها للعميل من قبل ألجيري أوفيس كجزء من تقديم الخدمة ، ولا سيما تلك المستخرجة من قواعد بيانات ألجيري أوفيس.
txt.infos.condition1.1.11.1 = ش.إ.ع
txt.infos.condition1.1.11.2 = تعني شروط الاستخدام العامة هذه.
txt.infos.condition1.1.12.1 = شروط خاصة
txt.infos.condition1.1.12.2 = يحدد الشروط المحددة بما في ذلك نموذج الطلب عند الاقتضاء ، والذي ينطبق على كل خدمة والتي ستكمل هذه الشروط والأحكام.
txt.infos.condition1.2 = الغرض من الشروط والأحكام وقبولها
txt.infos.condition1.2.1 = الغرض من الشروط والأحكام هو تحديد الشروط التي يتم بموجبها تنفيذ الطلبات المقدمة من قبل العملاء ، بغض النظر عن نوع الطلب ، ولا سيما عبر الإنترنت على الموقع أو الهاتف أو بأي وسيلة أخرى ، وتقديم الخدمات. من قبل ألجيري أوفيس للعملاء. يتم استكمال هذه الشروط والأحكام بالشروط الخاصة بكل خدمة.
txt.infos.condition1.2.2 = يمكن عرض الشروط والأحكام الخاصة على الموقع وقبولها من قبل العميل قبل تقديم الطلب و/أو إنشاء حساب. يوافق العميل على قراءة الشروط والأحكام قبل تقديم الطلب. حقيقة تقديم الطلب تعني قبول العميل الفوري والكامل وغير المحدود للشروط والأحكام والشروط الخاصة.
txt.infos.condition1.2.3 = يحتفظ ألجيري أوفيس بالحق في تعديل الشروط والأحكام الخاصة في أي وقت ، على وجه الخصوص بحيث تعكس دائمًا وظائف الخدمات في حالة التغيير. ما لم ينص على خلاف ذلك في الشروط الخاصة ، فإن إصدار الشروط والأحكام والشروط الخاصة المطبقة على أمر ما هي تلك السارية عندما يقدم العميل طلبًا.
txt.infos.condition1.2.4 = يحتفظ ألجيري أوفيس بالحق في تغيير قائمة الخدمات المعروضة على الموقع ، لتعديل الخدمات أو إضافتها أو حذفها ، دون أن يتمكن العميل من المطالبة بأي تعويض.
txt.infos.condition1.3 = الاستخدام المهني
txt.infos.condition1.3.1 = الخدمات والأوامر محجوزة للمهنيين والاستخدام المهني. يمكن استخدامها فقط لتلبية الاحتياجات المهنية ، باستثناء أي استخدام للأغراض الخاصة أو الشخصية.
txt.infos.condition1.4 = حساب زبون
txt.infos.condition1.4.1 = لتقديم طلب و/أو استخدام خدمات معينة على الموقع ، يجب أن يكون لدى العميل حساب نشط. تعتمد وظائف ووحدات الخدمات التي يمكن الوصول إليها عبر الحساب على الصيغة التي يختارها العميل.
txt.infos.condition1.4.2 = يوافق العميل على ضمان سرية وأمن اسم المستخدم وكلمة المرور الخاصة به وعدم السماح لطرف ثالث باستخدامهما ، فهي شخصية وسرية للغاية. استخدام الحساب والمعرفات محجوز للعميل. إنه المسؤول الوحيد عن استخدام حسابه واسم المستخدم وكلمة المرور الخاصة به.
txt.infos.condition1.4.3 = يتعهد العميل بتقديم معلومات دقيقة وكاملة عن هويته وتفاصيل الاتصال به وغيرها من المعلومات التي سيطلبها ألجيري أوفيس. يتعهد بتحديثها دون تأخير على الموقع في حال حدوث أي تعديل وذلك عن طريق حسابه. سيكون هو المسؤول الوحيد عن عواقب عدم دقة المعلومات المقدمة. يمنع منعا باتا اغتصاب هوية طرف ثالث.
txt.infos.condition1.5 = الطلب
txt.infos.condition1.5.1 = قبل التحقق من صحة طلبه ، يتمتع العميل بإمكانية التحقق من تفاصيله وسعره الإجمالي ، على وجه الخصوص حتى يتمكن من تصحيح أي أخطاء.
txt.infos.condition1.5.2 = يحتفظ ألجيري أوفيس بالحق في رفض أو إلغاء أي طلب من العميل الذي يوجد معه نزاع يتعلق بطلب سابق أو لا يمتثل للشروط المطلوبة لتقديم طلب ، دون أن يتمكن الأخير من المطالبة بأي تعويض.
txt.infos.condition1.6 = الضمان - المسؤولية
txt.infos.condition1.6.1 = لا يضمن ألجيي أوفيس بأي شكل من الأشكال تلبية الخدمات للمواصفات أو احتياجات العميل. يجب على العميل التأكد ، قبل طلب الخدمات واستخدامها ، من أن الخدمات تلبي احتياجاته ، وهو المسؤول الوحيد عن كفاية الخدمات لاحتياجاته ، ومؤهلات موظفيه والاستخدام الذي يقوم به للنتائج التي يحصل عليها.
txt.infos.condition1.6.2 = لا يضمن ألجيري أوفيس أن تشغيل الموقع ، والخدمات مستمرة وخالية من الأخطاء ، يمكن لألجيري أوفيس أن يقطع الوصول إلى كل أو جزء من الموقع أو الخدمات ، ولا سيما لأسباب تشغيلية أو صيانة أو في حالة الطوارئ ، دون أن يكون العميل قادراً على المطالبة بأي تعويض أو المطالبة بمسؤولية ألجيري أوفيس في هذا الصدد.
txt.infos.condition1.6.3 = لا يمكن تحميل مسؤولية ألجيري أوفيس بشكل صحيح إذا لم يحترم العميل أيًا من الالتزامات المفروضة عليه بموجب الشروط والأحكام أو الشروط الخاصة أو التشريعات واللوائح في هذا الصدد.
txt.infos.condition2.1 = خدمة ما بعد البيع - خدمة العملاء
txt.infos.condition2.1.1 = خدمة ما بعد البيع تسمى "HOT-LINE" تحت تصرف العميل لمساعدته في حل الصعوبات الفنية للاستشارة أو تنفيذ الخدمات التي طلبها. HOT-LINE هي خدمة متاحة من خلال دعم الدردشة الحية و/أو عبر البريد الإلكتروني.
txt.infos.condition2.1.2 = يتوفر أيضًا قسم "الأسئلة المتداولة" للسماح للعميل بالمساعدة في حل الصعوبات الفنية.
txt.infos.condition2.1.3 = خدمة عملاء ألجيري أوفيس متاحة للعميل للحصول على معلومات ذات طبيعة تجارية ويمكن الاتصال بها عن طريق البريد الإلكتروني.
txt.infos.condition2.2 = الصيانة والتحديث وتوافر الخدمات
txt.infos.condition2.2.1 = من أجل ضمان الجودة المستمرة للخدمة ، يتعهد ألجيري أوفيس بتحديث الموقع وقواعد بياناته من خلال تعديل وحذف وإضافة البيانات بانتظام.
txt.infos.condition2.2.2 = يتم ضمان استمرارية وتوافر الموقع على مدار 24 ساعة في اليوم ، 7 أيام في الأسبوع ما عدا في حالة الصيانة التصحيحية و/أو المتطورة. في حالة حدوث عطل منسوب إليه ، يتعهد ألجيري أوفيس بالتدخل بأسرع ما يمكن من لحظة علمه به.
txt.infos.condition2.3 = ملفات تعريف الارتباط
txt.infos.condition2.3.1 = يستخدم الموقع ملفات تعريف الارتباط. ملف تعريف الارتباط هو ملف نصي صغير يوضع على محطة العميل ، ويستخدم بشكل أساسي لتسهيل التنقل على الموقع ولتحديد هوية العميل عند اتصاله بحسابه. لدى العميل خيار قبول أو رفض ملفات تعريف الارتباط. تقبل معظم متصفحات الويب ملفات تعريف الارتباط تلقائيًا ، ولكن يمكن للعميل عادةً تغيير إعدادات المستعرض لرفضها. يتم إبلاغ العميل أنه إذا رفض ملفات تعريف الارتباط ، فلن يتمكن من الوصول إلى خدمات معينة وخاصة الخدمات التي تتطلب تحديد هوية العميل.
txt.infos.faq = أسئلة واستفسارات عامة متداولة.
txt.infos.faq1 = الحساب
txt.infos.faq1.1.1 = كيف أنشئ حسابي؟
txt.infos.faq1.1.2 = إنشاء حساب مجاني على ألجيري أوفيس. كل ما عليك فعله هو النقر على زر القائمة "اتصال/تسجيل" أعلى يسار الموقع. انقر فوق "إنشاء حساب" وأكمل استمارة التسجيل.<br>بمجرد إنشاء حسابك ، سيتم إرسال بريد إلكتروني إليك للتحقق من عنوان البريد الإلكتروني الذي تم إدخاله وتأكيد التسجيل. يجب التحقق من صحة إنشاء حسابك لتتمكن من الاتصال.
txt.infos.faq1.2.1 = لقد أنشأت حسابًا ، لكنني لم أتلق بريدًا إلكترونيًا للتحقق
txt.infos.faq1.2.2 = تذكر أن تتحقق من البريد غير الهام الخاص بك. قد يحدث أن يصل البريد الإلكتروني الخاص بالتحقق من الصحة بعد تأخير معين.<br>تتيح لك رسالة في أسفل الصفحة طلب إرسال البريد الإلكتروني للتحقق مرة أخرى. إذا لم تتلق رسالة بريد إلكتروني للتحقق على الرغم من ذلك في غضون 24 ساعة بعد إنشاء حسابك أو بعد طلبك مرة أخرى ، فيرجى الاتصال بنا.
txt.infos.faq1.3.1 = لقد أنشأت حسابًا ، لكن لا يمكنني تسجيل الدخول
txt.infos.faq1.3.2 = يجب التحقق من صحة إنشاء حسابك من رسالة البريد الإلكتروني للتأكيد التي تم إرسالها إلى عنوان البريد الإلكتروني الذي تم إدخاله.<br>عندما تنقر على زر التحقق في البريد الإلكتروني ، اذكر "تم التحقق من صحة حسابك بنجاح" أو "حسابك هو تم التحقق من صحته بالفعل "يجب أن يظهر أعلى الصفحة الرئيسية لألجيري أوفيس.
txt.infos.faq1.4.1 = كيف يمكنني تسجيل الدخول إلى حسابي؟
txt.infos.faq1.4.2 = للاتصال بحسابك ، ما عليك سوى النقر فوق زر القائمة "اتصال/تسجيل" في أعلى يسار الموقع. انقر فوق "اتصال" وأدخل بريدك الإلكتروني وكلمة المرور للاتصال بتسجيل الدخول أو الاتصال بحسابك الاجتماعي (facebbok ، google ، linkedin).<br>لقطع الاتصال ، ما عليك سوى النقر فوق ملف التعريف الخاص بك في الجزء العلوي الأيسر ثم النقر فوق  زر "قطع الاتصال".
txt.infos.faq1.5.1 = لقد نسيت تفاصيل تسجيل الدخول الخاصة بي
txt.infos.faq1.5.2 = إذا نسيت كلمة المرور الخاصة بك ، فانتقل إلى صفحة تسجيل الدخول الخاصة بحسابك. انقر فوق الارتباط "هل نسيت كلمة المرور؟" وأدخل عنوان البريد الإلكتروني المقدم عند التسجيل. ستتلقى بعد ذلك ، عبر البريد الإلكتروني ، ارتباطًا صالحًا لمدة 24 ساعة سيسمح لك بتجديد كلمة المرور الخاصة بك.<br>إذا كنت قد نسيت أيضًا عنوان البريد الإلكتروني لتسجيل الدخول ، فيرجى الاتصال بنا. 
txt.infos.faq1.6.1 = لا يمكنني تسجيل الدخول إلى حسابي. اسم المستخدم وكلمة المرور الخاصة بي صحيحان
txt.infos.faq1.6.2 = يرجى التحقق من بريدك الإلكتروني لمعرفة ما إذا كان قد تم وضع علامة على حسابك على أنه مريب أو مقيد. في حالة انتهاك الشروط والأحكام ، قد يتم إغلاق حسابك. إذا كان لديك بالفعل حساب في ألجيرري أوفيس مع وجود انتهاك ، فقد يتم تقييد حسابك الجديد أو إغلاقه.<br>إذا كنت تعتقد أنه تم الإبلاغ عنك بالخطأ ، فيرجى الاتصال بنا.
txt.infos.faq1.7.1 = كيف يمكنني تغيير كلمة المرور الخاصة بي أو معلوماتي الشخصية؟
txt.infos.faq1.7.2 = لتعديل كلمة المرور أو معلوماتك الشخصية ، انتقل إلى حسابك ، ضمن "حسابي" ثم في قسم "معلومات الاتصال" ويمكنك تعديل معلوماتك.
txt.infos.faq1.8.1 = كيف أغير بياناتي؟
txt.infos.faq1.8.2 = من حساب ألجيري أوفيس الخاص بك ، يمكنك تعديل تفاصيل الاتصال الخاصة بك من قسم "حسابي" "تفاصيل الاتصال".
txt.infos.faq1.9.1 = الإبلاغ عن حساب
txt.infos.faq1.9.2 = للإبلاغ عن حساب ، انتقل إلى صفحة ملفه الشخصي ، وانقر على النقاط الثلاث في الزاوية اليسرى العليا وحدد "إبلاغ عن مستخدم".
txt.infos.faq1.10.1 = حذف حسابك
txt.infos.faq1.10.2 = انتقل إلى قسم "الإعدادات" قسم "عام" من حسابك وانقر على رابط "إغلاق حسابك نهائيًا". سيتم حذف حسابك وستتلقى رسالة تأكيد بالبريد الإلكتروني.<br>إذا كنت عاملًا تنشئ شركة نشطة في ألجيري أوفيس ، فيجب عليك حذف صفحة شركتك حتى تتمكن من حذف حسابك بعد ذلك. بمجرد الحذف ، لا يمكن استعادة حسابك ويجب عليك إنشاء حساب جديد. تتلقى بريدًا إلكترونيًا للتأكيد عند حذف حسابك بنجاح.
txt.infos.faq1.11.1 = إعدادات البريد الإلكتروني والتحقق
txt.infos.faq1.11.2 = سيسمح لك عنوان البريد الإلكتروني الذي تم التحقق منه بتلقي إشعارات النظام المهمة وإعادة تعيين كلمة المرور وتلقي تحديثات لحسابك.<br>يمكنك تغيير تفضيلات الإعلام بالبريد الإلكتروني في أي وقت عن طريق تسجيل الدخول إلى حسابك والوصول إلى صفحة "الإشعارات" ، قسم "الإعدادات" وضبط إشعاراتك.
txt.infos.faq1.12.1 = ما هي سياسة ألجيري أوفيس بشأن ملفات تعريف الارتباط؟
txt.infos.faq1.12.2 = لضمان أفضل تجربة ممكنة على موقعنا ، يستخدم ألجيري أوفيس أنواعًا مختلفة من ملفات تعريف الارتباط: ملفات تعريف الارتباط الأساسية للتصفح الخاص بك ، وملفات تعريف الارتباط لحركة المرور لقياس الجمهور وملفات تعريف ارتباط الطرف الثالث أو الناشر لتقديم محتوى يتناسب مع احتياجاتك. مجالات الاهتمام.<br>لحذف ملفات تعريف الارتباط الخاصة بك ، لا تتردد في الرجوع إلى الإجراء المعمول به وفقًا لمتصفحك على صفحة إشعاراتنا القانونية.
txt.infos.faq1.13.1 = كيف يمكنني الوصول إلى بياناتي الشخصية؟
txt.infos.faq1.13.2 = وفقًا للالتزامات القانونية ، لديك الحق في الوصول إلى المعلومات المتعلقة بك عن طريق الكتابة إلى مقر ألجيري أوفيس. هذه المعلومات مخصصة لألجيري أوفيس ويمكن معالجتها إلكترونيًا.
txt.infos.faq1.14.1 = شروط الاستعمال
txt.infos.faq1.14.2 = نقوم بتحديث شروط الاستخدام العامة لدينا من أجل تبسيط تشغيل خدمات ألجيري أوفيس لمستخدمينا.
txt.infos.faq1.15.1 = ماذا يحدث إذا لم أقبل الشروط والأحكام؟
txt.infos.faq1.15.2 = إذا كنت لا توافق على شروط الاستخدام ، يجب عليك إزالة المحتوى الخاص بك والتوقف عن استخدام خدماتنا.
txt.infos.faq2 = الشركة
txt.infos.faq2.1.1 = كيف أضيف شركتي؟
txt.infos.faq2.1.2 = تسجيل شركتك في ألجيري أوفيس مجاني. إذا كنت جديدًا في ألجيري أوفيس ، فكل ما عليك فعله هو النقر على زر القائمة "اتصال/تسجيل" في أعلى يسار الموقع. انقر فوق "إضافة شركتي" واتبع عملية التسجيل في 4 خطوات سهلة.<br>وإلا ، إذا كان لديك بالفعل حساب على ألجيري أوفيس ، فانقر من حسابك على الزر "إضافة شركتي" في أعلى الشريط الجانبي من لوحة القيادة الخاصة بك. عليك فقط ملء المعلومات المطلوبة.
txt.infos.faq2.2.1 = لقد سجلت شركتي ولكن لا يمكنني العثور عليها في نتائج البحث
txt.infos.faq2.2.2 = لن تظهر على موقعنا إلا الشركات التي تم التحقق من صحتها من قبل فريق الوسطاء لدينا. شركة في حالة الشك ، نحتفظ بالحق في طلب المستندات التي تبرر أنه مدير الشركة بالفعل ، أي إثبات هوية المدير ومستخرج من السجل التجاري للشركة. يبذل الفريق قصارى جهده لضمان ذلك تتم معالجة طلبات التحقق من الصحة في غضون يوم عمل واحد. بمجرد أن تتم معالجة طلبك بواسطة خدماتنا ، سيتم إبلاغك عن طريق الإشعار.
txt.infos.faq2.3.1 = كيف أضيف معلومات عن شركتي؟
txt.infos.faq2.3.2 = بفضل التسجيل المجاني لشركتك على موقعنا ، يمكنك الاستفادة من مساحة التحكم (وحدة التحكم الإدارية) التي تتيح لك إدارة المحتوى الخاص بك. يمكنك حينئذٍ تحديث صفحة شركتك ونشر عروضك كما يحلو لك.<br>ومع ذلك ، فإن أي تعديل على هوية الشركة يعني إرسال طلب تحقق جديد.
txt.infos.faq2.4.1 = هل يمكنني إضافة مؤلفين لشركتي؟
txt.infos.faq2.4.2 = نعم ، لديك خيار إقران المستخدمين بشركتك والذين سيتمكنون أيضًا من الاتصال بوحدة التحكم الإدارية لصفحتك. لهذا ، تحتاج فقط إلى إنشاء مستخدم جديد من وحدة التحكم الخاصة بك ، قسم "المستخدمون" ، أو دعوة مستخدم مسجل بالفعل على الموقع.<br>يمكنك بعد ذلك تحديد دوره ، حيث يكون لكل دور هذه الخصائص وحقوق الوصول. على سبيل المثال ، يمكن لمستخدم لديه دور "محرر" إضافة محتوى أو تعديله أو حذفه ، لكن لا يمكنه إضافة مستخدم أو إعدادات الوصول. يمكنك العثور على مزيد من المعلومات حول أدوار المستخدم في صفحة "إضافة مستخدم" بوحدة التحكم الخاصة بك.
txt.infos.faq2.5.1 = كيف ابحث عن شركة؟
txt.infos.faq2.5.2 = يتم البحث في جميع صفحات الموقع من مربع البحث الموجود أعلى الصفحات. يتم البحث عن التسمية والاسم التجاري والكلمات الرئيسية وعنوان واسم القادة. يمكنك أيضًا تحسين البحث عن طريق الوصول إلى صفحة البحث المتقدم التي ستتيح لك استخدام عوامل التصفية في حقول محددة.
txt.infos.faq2.6.1 = هل يمكنني وضع شركة تحت المراقبة؟
txt.infos.faq2.6.2 = إذا كنت ترغب في أن تكون على علم بالتغييرات التي قد تحدث في شركة واحدة أو أكثر ، فلديك خيار وضعها في حالة تأهب. أضف الشركات التي تريدها إلى شبكتك وابحث عنها في حسابك ، قسم "شبكتي" قسم "الشركات".<br>لكل شركة ، يمكنك تفعيل زر التنبيه. عندما يكون هذا باللون الأخضر ، يتم تسجيل التنبيه. ستتلقى بعد ذلك تنبيهًا عن طريق الإخطار و/أو عبر البريد الإلكتروني عند كل تطور للشركة: نشر الأخبار ، تعديل إعلان ، نشر حدث ، ... إلخ. يمكنك إيقاف المراقبة متى أردت تريد من خلال النقر على زر التنبيه مرة أخرى. 
txt.infos.faq2.7.1 = كيف أحسن الاستهداف الخاص بي؟
txt.infos.faq2.7.2 = كل ما عليك فعله هو تطبيق المرشحات المختلفة المتاحة لك لتحسين اختيارك: قطاع الأعمال أو المنطقة الجغرافية أو القوى العاملة أو نوع المؤسسة ... أنت تحدد أنواع الشركات التي تريد استهدافها. كلما كان استهدافك أكثر دقة ، كان اختيارك أكثر ملاءمة.
txt.infos.faq2.8.1 = ماذا تتوافق الرسومات؟
txt.infos.faq2.8.2 = إنها تتيح لك تصور توزيع الشركات المسجلة في الموقع على شكل رسم بياني وفقًا لمعايير معينة مثل تاريخ الإنشاء وحجم الشركات وقنوات التنقيب ...<br>يتم ضبط الرسوم البيانية وفقًا إلى صفحة البحث التي تم الرجوع إليها: قطاع النشاط ، المهنة ، المدينة ... للسماح لك بالتحليل التفصيلي لمدى تنقيبك.
txt.infos.faq2.9.1 = ما هي "إمكانياتي"؟
txt.infos.faq2.9.2 = تشير "إمكانياتي" إلى عدد المؤسسات المطابقة لمعايير البحث الخاصة بك. يتم ضبطه حسب الهدف ليمنحك نظرة عامة على حجم اختيارك.
txt.infos.faq2.10.1 = ما هو الكشف؟
txt.infos.faq2.10.2 = الكشف هو حل يسمح لك بتحديد زوار صفحة عملك في الوقت الفعلي.
txt.infos.faq2.11.1 = كيف اجد الزوار المحددين؟
txt.infos.faq2.11.2 = من وحدة التحكم الإدارية لشركتك ، قسم "لوحة المعلومات" ، قم بالوصول إلى قسم "الكشف" للاطلاع على تفاصيل الزوار المحددين. يجب أن يكون الحد الأدنى للاشتراك "ريجيلار" نشطًا في شركتك حتى تتمكن من الاستفادة من حل الكشف.<br>لمزيد من التفاصيل ، لا تتردد في الرجوع إلى صفحة عروضنا.
txt.infos.faq2.12.1 = لدي زيارات أكثر من عدد الزائرين المحددين ، كيف يمكن ذلك؟
txt.infos.faq2.12.2 = الحصول على زيارات أكثر من عدد الزوار المحددين أمر ممكن وطبيعي تمامًا. يمكن أن يكون لهذا الاختلاف احتمالان: يمكن أن يكون الزائر المحدد مصدرًا لعدة زيارات ، أو زائر مجهول لا يمكن تحديد هويته.<br>لاحظ أنه لن يتم احتساب أحد مشغلي الشركة كزيارة على صفحته.
txt.infos.faq2.13.1 = هل لديك حاجة خاصة ؟
txt.infos.faq2.13.2 = إذا كانت لديك حاجة معينة لا يمكنك معالجتها من خلال الوحدة النمطية الخاصة بنا عبر الإنترنت ، فلا تتردد في استخدام نموذج طلب الميزة من حسابك.
txt.infos.faq3 = الاشتراك
txt.infos.faq3.1.1 = لماذا الاشتراك؟
txt.infos.faq3.1.2 = يمنحك الاشتراك في خدماتنا وصولاً حصريًا إلى المحتوى المدفوع ويسمح لك بالاستفادة من الميزات المتقدمة. بناءً على العرض الذي تختاره ، ستختلف تكوينات النظام الأساسي الخاص بك.<br>ينشر ألجيري أوفيس بانتظام ميزات جديدة.
txt.infos.faq3.2.1 = كيف أشترك؟
txt.infos.faq3.2.2 = للاشتراك في خدماتنا ، لا شيء يمكن أن يكون أبسط! انتقل إلى وحدة التحكم الإدارية لشركتك ، قسم "الأدوات" ، قسم "الاشتراك" وحدد العرض الذي تختاره من بين العروض الأربعة المعروضة. تمنحك كل من هذه الممرات مزايا محددة.
txt.infos.faq3.3.1 = أنا فرد هل يمكنني الاشتراك بخدماتكم؟
txt.infos.faq3.3.2 = لا ، خدماتنا المدفوعة مخصصة للمحترفين فقط. جميع خدماتنا المقدمة للأفراد مجانية. يمكنك استخدام المنصة كفرد غير محدود دون الحاجة إلى الاشتراك في الحزم المدفوعة.
txt.infos.faq3.4.1 = لدي العديد من المشغلين المسجلين في شركتي ، هل أحتاج إلى اشتراك لكل مشغل؟
txt.infos.faq3.4.2 = لا ، يتعلق الاشتراك بشركة واحدة فقط ، ويستفيد جميع مستخدمي الشركة المشغلين من هذا الاشتراك.<br>يمكن لجميع مشغلي الشركة الوصول إلى وحدة التحكم الإدارية نفسها ، حيث يمكن مشاركة المحتوى بينهم ، بما في ذلك الاشتراك النشط في السؤال.
txt.infos.faq3.5.1 = ما هي خيارات الدفع المتاحة؟
txt.infos.faq3.5.2 = هناك طريقة دفع واحدة فقط متاحة على موقعنا ، ويمكن دفع مشترياتك عبر تفويض CCP ثم إرسال قسيمة التحويل إلينا باستخدام نموذج الدفع المتاح لكل خدمة على الموقع.<br>نأسف لأننا لا نستطيع توفير وسائل دفع أخرى بسبب الصعوبات وعدم توفر تنفيذ واجهات برمجة التطبيقات للدفع الإلكتروني في الجزائر!
txt.infos.faq3.6.1 = كيف تعدل الاشتراك؟
txt.infos.faq3.6.2 = لا يمكن تعديل الاشتراك الحالي. ومع ذلك ، إذا كنت ترغب في تغيير بطاقتك ، فكل ما عليك فعله هو الحصول على اشتراك جديد. ثم يتم تطبيق حساب لإضافة الاشتراك الجديد مع الاشتراك الحالي ، والذي تتم ترقية النتيجة إلى البطاقة المختارة.
txt.infos.faq3.7.1 = ما هي مزايا الاشتراك المميز؟
txt.infos.faq3.7.2 = بفضل الخدمات المتوفرة في البطاقة المميزة ، يمكنك إدارة نشاطك ، والتشاور مع طلبات غير محدودة للحصول على عروض الأسعار ، وتحديد زوار موقعك ، وتحليل أدائك ، وما إلى ذلك. لمزيد من التفاصيل ، لا تتردد في الرجوع إلى صفحة عروضنا.
txt.infos.faq4 = الإشهار
txt.infos.faq4.1.1 = كيف أقوم بإنشاء الدعاية الخاصة بي؟
txt.infos.faq4.1.2 = لا شيء أسهل! لإنشاء إعلانك ، انتقل إلى وحدة التحكم الإدارية لشركتك ، قسم "المتجر" ، قسم "الإعلانات المميزة" واسمح لنفسك بالتوجيه. في 3 خطوات فقط ، ستكون قد أنشأت إعلانك المخصص. ننصحك بالرجوع إلى ميثاق الممارسات الجيدة وقواعد التوزيع قبل إنشاء إعلانك.<br>وبالمثل ، من قسم "الحملات" ، يمكنك بدء حملة B2B للترويج لعروضك للشركات من اختيارك.
txt.infos.faq4.2.1 = من سيرى إعلاني؟ هل يمكنني استهداف جمهوري؟
txt.infos.faq4.2.2 = العديد من الخيارات المتاحة لك. يمكنك اختيار بث إعلانك لجميع زوار ألجيري أوفيس أو عرضه على الجمهور الذي تستهدفه بناءً على معيارين: قطاع الأعمال ، المنطقة الجغرافية. يتيح لك استهداف آفاقك جيدًا تحسين حجم العرض الناتج عن إعلاناتك.
txt.infos.faq4.3.1 = أين يظهر إعلاني؟
txt.infos.faq4.3.2 = سيتم عرض إعلانك في مساحة محجوزة أعلى كل صفحة شركة لإعلان متميز (لوحة معلومات الشركة لحملة b2b) ، في علامة التبويب الصفحة الرئيسية. سيتم عرض إعلانك على الشركات المطابقة لاختياراتك.
txt.infos.faq4.4.1 = ماذا يحدث إذا كان هناك العديد منا يريدون عرض نفس الإعلان في نفس المكان؟
txt.infos.faq4.4.2 = في حالة استيفاء العديد من الإعلانات لمعايير التوزيع نفسها ، سيتم تطبيق مبدأ التناوب العادل. سيتم عرض كل إعلان مرة واحدة قبل بدء عرض إعلان جديد بالتناوب.
txt.infos.faq4.5.1 = هل يمكنني إنشاء إعلانات متعددة في نفس الوقت؟
txt.infos.faq4.5.2 = يمكنك إنشاء العديد من الإعلانات كما تريد ، لا يوجد حد! يمكنك بعد ذلك إدارة إعلاناتك كما يحلو لك ، عن طريق تعديل ميزانياتك واستهدافك وإيقافاتك المؤقتة.<br>تذكر تغيير الرسالة والهدف ونصوص الزر لإعطاء قوة أكبر لكل إعلان من إعلاناتك. ستتمكن أيضًا من مقارنة إعلاناتك ومعرفة خصائص الإعلان الذي يعمل بشكل أفضل لإعادة الاستخدام.
txt.infos.faq4.6.1 = كيف نختار ميزانية مختلفة عن تلك المقترحة؟
txt.infos.faq4.6.2 = لا يمكن تحديد ميزانية أخرى غير تلك المقترحة. ومع ذلك ، لديك خيار إضافة المزيد من الميزانية وقتما تشاء.
txt.infos.faq4.7.1 = كيف يمكنني الدفع مقابل إعلاناتي؟
txt.infos.faq4.7.2 = يمكنك الدفع مقابل إعلانك عبر تفويض CCP ثم إرسال قسيمة التحويل إلينا باستخدام النموذج المقابل على موقعنا.
txt.infos.faq4.8.1 = لقد تحققت للتو من صحة إعلاني ودفعته ولكن لم يتم عرضه بعد ، لماذا؟
txt.infos.faq4.8.2 = يتم الإشراف على جميع الإعلانات من قبل فرقنا قبل وضعها على الإنترنت ، من أجل ضمان الامتثال لقواعد التوزيع وإحسان المحتوى. نحن نبذل قصارى جهدنا للوفاء بالموعد النهائي المحدد بيوم عمل واحد قبل التحقق من صحة إعلاناتك ونشرها.
txt.infos.faq4.9.1 = كم من الوقت يستغرق لتنسيق الإعلان؟
txt.infos.faq4.9.2 = لضمان جودة الخدمة لك ، يبذل فريق الوسطاء لدينا قصارى جهدهم لاحترام فترة الإشراف ليوم عمل واحد.<br>للتحقق من توافق إعلانك ، يمكنك الرجوع إلى قواعد التوزيع الخاصة بنا.
txt.infos.faq4.10.1 = لماذا لم يتم التحقق من صحة إعلاني من قبل فرقك؟
txt.infos.faq4.10.2 = إذا لم يتم التحقق من صحة إعلانك من قبل فرقنا ، فيجب أن يكون قد تم شرح سبب الرفض لك في البريد الإلكتروني الذي تلقيته.<br>في جميع الحالات ، تأكد من أن محتوى إعلانك يتوافق مع قواعد التوزيع الخاصة بنا وتذكر للتأكد من أن الرابط المضمن في هذا الإعلان يعمل. بمجرد تصحيح إعلانك ، تحقق من صحته حتى تتمكن فرقنا من تنسيقه مرة أخرى.
txt.infos.faq4.11.1 = هل يمكنني النقر فوق إعلاني للتحقق من أن كل شيء يعمل بشكل جيد؟
txt.infos.faq4.11.2 = طبعا ! مثل أي زائر لألجيري أوفيس يمكنك الضغط على إعلانك. ومع ذلك ، لا يمكننا تمييزك عن أي زائر عادي بالنقر فوق الإعلان ، لذلك فأنت تستخدم نقرة واحدة من ميزانيتك. 
txt.infos.faq4.12.1 = أين يمكنني تتبع أداء إعلاناتي؟
txt.infos.faq4.12.2 = يمكنك عرض أداء إعلانك من نفس قسم التأليف على وحدة تحكم المشرف الخاصة بك. من هذه الصفحة ، يمكنك أيضًا أن تقرر تحديث إعلاناتك وإضافة ميزانيات.
txt.infos.faq4.13.1 = كم مرة يتم تحديث الإحصائيات الخاصة بي؟
txt.infos.faq4.13.2 = من أجل ضمان المراقبة المثلى ، يتم تحديث إحصائيات إعلاناتك في الوقت الفعلي.
txt.infos.faq4.14.1 = لاحظت أن لدي عددًا كبيرًا من العروض ولكن القليل من النقرات على إعلاني ، فماذا أفعل؟
txt.infos.faq4.14.2 = هذا يعني أن إعلانك يظهر لجمهور عريض ولكن المحتوى لا يغري الزوار للنقر بشكل كافٍ. في هذه الحالة ، ننصحك بتعديل العنوان أو النص أو التسمية التوضيحية للزر.<br>يمكنك المتابعة خطوة بخطوة وتعديل كل عنصر من هذه العناصر واحدًا تلو الآخر ، مع ترك بضعة أيام بين تعديلين لمعرفة أيهما هو الأكثر كفاءة.
txt.infos.faq4.15.1 = لقد لاحظت أن لدي عددًا قليلاً من شاشات العرض ولكن نسبة النقر إلى الظهور جيدة على إعلاني ، فماذا أفعل؟
txt.infos.faq4.15.2 = هذا يعني أن إعلانك يبني بشكل جيد ويجذب الزوار للنقر ، لكن جمهورك المستهدف ليس كبيرًا بما يكفي. لزيادة معدل العرض ، ننصحك بتوسيع هدفك المحدد في الخطوات الأولى لإنشاء إعلانك.
txt.infos.faq4.16.1 = هل يمكنني تعديل إعلاني بعد تحميله؟
txt.infos.faq4.16.2 = طبعا ! يمكنك تغيير الإعلان و/أو الاستهداف في أي وقت من وحدة التحكم الخاصة بك.
txt.infos.faq4.17.1 = هل هناك قواعد يجب اتباعها عند كتابة الإعلان؟
txt.infos.faq4.17.2 = في الواقع ، يجب أن تحترم جميع الإعلانات القيود القانونية ليتم التحقق من صحتها أثناء الإشراف.<br>تذكر الرجوع إلى ميثاق الممارسات الجيدة قبل كتابة إعلانك.
txt.infos.faq5 = المتجر
txt.infos.faq5.1.1 = ما هو المتجر؟
txt.infos.faq5.1.2 = المتجر هو موقع على الإنترنت يربط بين العديد من المشترين والبائعين من نفس القطاع. الهدف هو تطوير المعاملات بين هذه الجهات.
txt.infos.faq5.2.1 = ما هي منصة المشتريات الإلكترونية؟
txt.infos.faq5.2.2 = منصة المشتريات الإلكترونية هي أداة رقمية لعملك. دورها هو تسهيل إدارة عملية الاستحواذ بأكملها. فهو يجمع جميع الموردين ويصبح نقطة الوصول المركزية لجميع موظفيك أو جميع الشركات التابعة لك.
txt.infos.faq5.3.1 = ما هي الاختلافات بين موقع التجارة الإلكترونية أو المتجر أو حتى منصة دروبشيبينغ؟
txt.infos.faq5.3.2 = الثلاثة كلها عبارة عن منصات على الإنترنت هدفها الرئيسي هو استيعاب إتمام المعاملات بين البائعين والمشترين. الفرق الوحيد هو وجود المستخدمين (المشترين والبائعين) والطريقة التي يتصرفون بها.
txt.infos.faq5.3.2.1 = في مواقع التجارة الإلكترونية ، يمكننا تحديد بائع واحد يواجه عددًا كبيرًا من المشترين. كمثال لهذا النوع من المنصات ، يمكننا الاستشهاد بـ moo.com أو quill.com.
txt.infos.faq5.3.2.2 = تجمع المتاجر بين عدد كبير من البائعين وعدد كبير من المشترين. هذا هو الحال ، على سبيل المثال ، بالنسبة لشركة Amazon Business. يمكن لكل معاملة ربط المشتري ببائع جديد.
txt.infos.faq5.3.2.3 = منصة دروبشيبينغ هي نوع قريب من المتجر مع عدد من المشترين والبائعين. ولكن ، سيكون المشترون على اتصال ببائع واحد فقط ، والذي سيعمل كوسيط. هذا البائع المعين الذي يمكننا تسميته "دروبشيبر" يتولى جميع المعاملات بين المشترين والبائعين ، بينما لا يتعامل مع المخزون. سيتم إدارة هذه من قبل البائعين النهائيين ، الذين سيكونون مسؤولين عن عمليات التسليم.
txt.infos.faq5.4.1 = ما هو ألجيري أوفيس؟
txt.infos.faq5.4.2 = ألجيري أوفيس هو أحد حلول المتجر لتطوير أعمالك عبر الإنترنت من خلال إنشاء علاقات ومعاملات جديدة بين المشترين والبائعين في نفس القطاع.<br>يعتبر ألجيري أوفيس أيضًا أحد حلول المشتريات الإلكترونية المصممة لتسهيل إدارة المشتريات داخل شركتك.
txt.infos.faq5.5.1 = لماذا يصف ألجيري أوفيس نفسه بأنه حل العلامة البيضاء؟
txt.infos.faq5.5.2 = ستتاح للشركات التي تنشئ سوقها التجاري مع ألجيري أوفيس إمكانية تحديد تجربة المستخدم الخاصة بها من خلال تعديل عدد معين من العناصر. كما نمنح الجميع الفرصة لاختيار عنوان url الخاص بالمتجر.
txt.infos.faq5.6.1 = ما هو نموذج عمل ألجيري أوفيس؟
txt.infos.faq5.6.2 = نموذج عمل ألجيري أوفيس بسيط للغاية ويأخذ في الاعتبار الرفاهية المالية لعملائه. في الواقع ، يعتمد على رسوم شهرية ثابتة بدون عمولة أو تكاليف إنشاء إضافية.<br>هذا يضمن لعملائنا استقرارًا معينًا ورؤية مريحة على المدى الطويل.
txt.infos.faq5.7.1 = إلى ماذا يرمز الاختصار Saas؟ ولماذا من المفيد استخدام هذا النوع من الحلول؟
txt.infos.faq5.7.2 = يختلف ألجيري أوفيس عن الحلول الأخرى لأننا نهدف حقًا إلى أن نقدم لك أفضل ما يمكن أن يفيد عملك في أسرع وقت ممكن.
txt.infos.faq5.7.2.1 = وضع Saas: ستشهد منصتنا تحسينات باستمرار وستكون قادرًا على الاستفادة بانتظام من الميزات الجديدة التي ستفيد عملك.
txt.infos.faq5.7.2.2 = حل الكل في واحد: ألجيري أوفيس يدمج الواجهات الثلاثة (المكتب الأمامي ، المكتب الأوسط ، المكتب الخلفي) اللازمة للإدارة الجيدة للسوق (المتجر) أو منصة الشراء الإلكتروني.
txt.infos.faq5.8.1 = كيف يتم هيكلة الكتالوج في حل ألجيري أوفيس؟
txt.infos.faq5.8.2 = يقدم ألجيري أوفيس أفضل نظام لتصنيف المنتجات و/أو الخدمات لسوق أو منصة مشتريات إلكترونية. نحن نستخدم PIM (إدارة معلومات المنتج) لمركزية وإدارة جميع البيانات حول المنتجات.
txt.infos.faq5.9.1 = هل يوفر الحل واجهة مشغل / بائع؟
txt.infos.faq5.9.2 = من أجل تسهيل استخدام الحل ، تتوفر 3 واجهات: مكتب أمامي للعميل النهائي ، ومكتب وسط للبائعين ، ومكتب خلفي للمشغلين. 
txt.infos.faq5.10.1 = كيف تعمل خدمة الرسائل الداخلية لإدارة خدمة ما بعد البيع أو الأسئلة أو غيرها؟
txt.infos.faq5.10.2 = قام ألجيري أوفيس بتطوير نظام مراسلة آمن متكامل لتسهيل الاتصالات بين المستخدمين في الوقت الفعلي. يمكن مشاركة طلبات عروض الأسعار وجهات الاتصال مع الشركة بين المشرفين.
txt.infos.faq6.1 = إذا لم تتمكن من العثور على إجابة لسؤالك ، من فضلك
txt.infos.chart1 = ميثاق الممارسات الجيدة والقواعد لتوزيع الإعلانات
txt.infos.chart1.1 = المادة 1 - التعاريف
txt.infos.chart1.1.1.1 = مستخدم
txt.infos.chart1.1.1.2 = مستخدم وحدة المساحات المدعومة في ألجيري أوفيس (مصمم ومحرر الإعلان و / أو حملة B2B).
txt.infos.chart1.1.2.1 = إعلان
txt.infos.chart1.1.2.2 = الإعلان الذي يكتبه المستخدم وينشر على صفحات الشركات بفضل الوحدة.
txt.infos.chart1.1.3.1 = حملة b2b
txt.infos.chart1.1.3.2 = العرض التجاري الذي سيتم الترويج له من قبل المستخدم على لوحات معلومات الشركات باستخدام الوحدة النمطية.
txt.infos.chart1.1.4.1 = مساحة دعائية
txt.infos.chart1.1.4.2.1 = يتكون الإعلان من عنوان من ستين (60) حرفًا كحد أقصى ، ونص لا يزيد عن مائة وخمسين (150) حرفًا وزر إجراء يختار المستخدم عنوانه في قائمة منسدلة من الاختيارات. يختار المستخدم عدد العروض التي يرغب في الوصول إليها للإعلان من بين اختيار الرقم الذي يتوافق مع السعر. بعد الإشراف المسبق من قبل ألجيري أوفيس ، يتم نشر الإعلان ويبقى على الإنترنت حتى الوصول إلى العدد المحدد من المنشورات.
txt.infos.chart1.1.4.2.2 = تتكون حملة b2b من عنوان مكون من مائة وخمسين (150) حرفًا كحد أقصى في شكل رابط للعرض للترويج مع الإشارة إلى نوعه (منتج ، خدمة ، دعوة لتقديم عطاءات ، إعلان b2b ، بحث عن موزع أو البحث عن مقاولين أو تقديم خدمات أو حدث). يختار المستخدم مستوى النقرات الذي يرغب في تحقيقه لحملة b2b من خلال اختيار عدد من النقرات يتوافق مع السعر. بعد التحقق من صحة الحملة من قبل فرقنا ، يتم نشر الحملة وتظل على الإنترنت حتى يتم الوصول إلى مستوى النقر المحدد.
txt.infos.chart1.1.5.1 = متلقي
txt.infos.chart1.1.5.2 = أي شخص من المحتمل أن يكون لديه حق الوصول إلى الإعلان و/أو حملة b2b ، سواء أكانوا جزءًا من الجمهور المستهدف أم لا وسواء نقروا على الإعلان (أو حملة b2b) أم لا.
txt.infos.chart1.2 = المادة 2 - الغرض
txt.infos.chart1.2.1 = الغرض من هذا الميثاق هو تحديد أفضل الممارسات التي يتعهد المستخدم بالامتثال لها فيما يتعلق بالنشر في وحدة "المساحة الدعائية".
txt.infos.chart1.2.2 = من الدقيق ، ما يفهمه المستخدم ويدركه ويقبله ، أن التذكيرات بالقواعد الواردة في هذا الميثاق ليست شاملة وأن المستخدم مطالب بإبلاغ نفسه بشكل خاص عن نظام الإعلان المطبق على مهنته بالإضافة إلى منتج أو خدمة يرغب في الإعلان عنها من خلال الإعلان.
txt.infos.chart1.2.3 = في هذا السياق ، قبل أي منشور ، يتعهد المستخدم بالامتثال بدقة لهذا الميثاق بالإضافة إلى جميع الأحكام التشريعية والتنظيمية المطبقة على كل حالة محددة.
txt.infos.chart1.3 = المادة 3 - الاعتدال
txt.infos.chart1.3.1 = يتم إبلاغ المستخدم ويوافق على أن جميع الإعلانات خاضعة للإشراف من قبل ألجيري أوفيس قبل أي نشر ، دون التقيد بأي موعد نهائي.
txt.infos.chart1.3.2 = يصرح المستخدم بأنه يتفهم ويقبل أن قبول أو رفض الإعلان موضع تقدير من قبل ألجيري أوفيس وفقًا لمعايير سياسة النشر الخاصة به.
txt.infos.chart1.3.3 = يتلقى المستخدم الذي تم رفض إعلانه من قبل ألجيري أوفيس رسالة بريد إلكتروني توضح الأسباب وتدعوها لتعديل إعلانه.
txt.infos.chart1.4 = المادة 4 - الضمانات والمسؤولية
txt.infos.chart1.4.1 = يقر المستخدم ويوافق على أن ألجيري أوفيس ليس سوى وسيط بسيط بين المستخدم والمستلمين. لا يمكن طلب مسؤولية ألجيري أوفيس عن محتوى إعلان.
txt.infos.chart1.4.2 = يتم إبلاغ المستخدم ويقر ويقبل أن أي خرق لهذا الميثاق وكذلك أي انتهاك أو اشتباه في الانتهاك يستتبع الحذف الفوري دون إشعار بالإعلان ، دون أي حق في الحصول على تعويض.
txt.infos.chart1.5 = المادة 5 - الملكية الفكرية وحقوق الصورة
txt.infos.chart1.5.1 = يتم إعلام المستخدم أن ألجيري أوفيس لا يتسامح مع أي استخدام احتيالي أو غير مصرح به للمحتوى المحمي بموجب حقوق النشر. في هذا السياق ، يتعهد المستخدم رسميًا ألا يستخدم في إعلاناته سوى النصوص والصور و/أو الصور و/أو أي محتوى آخر تخصه حقوق الملكية الفكرية الخاصة به أو حصل من أجله على ترخيص تشغيل.
txt.infos.chart1.5.2 = يتعهد المستخدم أيضًا باحترام حقوق الصورة لأي شخص يُحتمل تمثيله في الإعلان ، والحصول على موافقته الخطية المسبقة.
txt.infos.chart1.6 = المادة 6 - الإعلان المنظم
txt.infos.chart1.6.1 = يتم تنظيم الإعلانات ، على سبيل المثال ، في مجالات الصحة العامة (الكحول والتبغ والتدخين الإلكتروني والعقاقير وشركات الأدوية) أو حتى المنتجات المالية.
txt.infos.chart1.6.2 = يصرح المستخدم بأنه يتفهم ويقبل أن ألجيري أوفيس لا يمكن أن يكون على دراية كاملة بجميع أنظمة الإعلان المحددة.
txt.infos.chart1.6.3 = يتعين على المستخدم معرفة جميع القواعد المطبقة على مهنته وعلى المنتجات والخدمات التي يرغب في الإعلان عنها والالتزام بها.
txt.infos.chart1.7 = المادة 7 - القابلية للفصل
txt.infos.chart1.7.1 = إذا تبين أن إحدى مواد هذا الميثاق لاغية أو غير قابلة للتنفيذ بموجب قانون أو لائحة أو بعد قرار من المحكمة ، فستحتفظ المواد الأخرى بكامل قوتها ونطاقها.
txt.infos.credit1 = استفد من أحدث جيل من الأدوات بفضل فريق تقني رشيق منتبه للتطورات الجديدة في السوق. حل ألجيري أوفيس الخاص بك ، تم إنشاؤه باستخدام أكثر التقنيات تقدمًا وأمانًا.
txt.infos.credit1.1 = النهاية الخلفية: أداء مضمون
txt.infos.credit1.1.1 = Java هي لغة برمجة موجهة للكائنات تُستخدم لتطوير تطبيقات الويب. أصبحت Java هي المعيار لتطوير تطبيقات الأعمال ، وغالبًا ما يتم اختيارها للمشاريع الكبيرة والمعقدة. تعد Java منصة مشتركة وتعمل ضمن بيئة Unix و Windows.
txt.infos.credit1.1.2 = يقوم ألجيري أوفيس بتطوير جانب الخادم الخاص به (الخلفية) عبر إطار عمل SpringBoot بناءً على لغة تطوير Java.
txt.infos.credit1.1.3 = Java هي إحدى اللغات التي تستخدمها الأسماء الكبيرة على الويب لتشكيل أساس البنى التحتية للتطبيقات الخاصة بهم. تثق Google و Twitter و Amazon الأخرى في Java للأمان والأداء.
txt.infos.credit1.2 = الواجهة الأمامية: واجهات تفاعلية لتجربة مستخدم أفضل
txt.infos.credit1.2.1 = تم تطوير جانب العميل (الواجهة الأمامية) في ألجيري أوفيس باستخدام ReactJS ، أشهر لغات الواجهة الأمامية للهاتف والويب. تساعد React على إنشاء واجهات مستخدم جذابة وتفاعلية ، مما يجعلها الحل الأمثل لتجربة مستخدم رائعة ، وتحسين رضا المستخدم.
txt.infos.credit1.2.2 = React هي مكتبة JavaScript تم إنشاؤها بواسطة Facebook والتي تتيح لك تطوير واجهة مستخدم ذات مظهر احترافي ، مستقلة عن مكدس التكنولوجيا الخلفية.
txt.infos.credit1.3 = الطراز: نشر مرن وسريع للغاية لتطبيقات الويب القابلة للتطوير
txt.infos.credit1.3.1 = يُدار نموذج بيانات ألجيري أوفيس بواسطة نظام PostgreSQL الذي يعتمد على اللغة الإجرائية غير المحظورة. خفيفة الوزن وفعالة ، وهي مناسبة بشكل خاص للتطبيقات التي تحتاج إلى إدارة كميات كبيرة من البيانات في الوقت الفعلي وعلى الأجهزة الموزعة.
txt.infos.credit1.3.2 = يسمح نظام PostgreSQL غير المتزامن بمعالجة طلبات قراءة متعددة في وقت واحد ، مما يوفر وقتًا طويلاً. يحظى بتقدير خاص من حيث الأداء لعمليات إدخال البيانات وإنشاء الفهرس.
