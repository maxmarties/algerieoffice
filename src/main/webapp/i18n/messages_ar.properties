message.premium.subscribe = لم يتم التحقق من صحة شركتك بعد. يمكنك الترقية إلى خطة مدفوعة بمجرد أن يصبح التحقق من صحة عملك ساريًا.<br>لمزيد من المعلومات ، يرجى الاطلاع على حالة العمل في القسم
message.premium.detect = مطلوب حد أدنى من الاشتراك "ريجيلار" المميز للوصول إلى حل الكشف. قم بترقية خطتك لمعاينة زيارات صفحتك خلال الأشهر الستة الماضية وتصفية الأحداث حسب نطاق التاريخ.<br>لمزيد من المعلومات ، يرجى الاطلاع على عروضنا بالتفصيل في قسم "الأدوات> الاشتراك".
message.premium.analyse = قم بترقية خطة اشتراكك إلى خطة مدفوعة "ريجيلار" كحد أدنى من أجل فتح أدوات تحليلات الأعمال البارزة. يؤدي هذا إلى زيادة قياسات تحليل حركة المرور الخاصة بك.<br>لمزيد من المعلومات ، يرجى الرجوع إلى عروضنا بالتفصيل في قسم "الأدوات> الاشتراك".
message.premium.statistic = أنت تستفيد حاليًا من اشتراك مجاني في ألجيري أوفيس. كن مميزًا لمعاينة إحصائيات منتجاتك وتحسين حركة الضهور على موقعنا.<br>لمزيد من المعلومات ، يرجى الرجوع إلى عروضنا بالتفصيل في قسم "الأدوات> الاشتراك".
message.premium.dashboard = أنت تستفيد حاليًا من اشتراك مجاني في ألجيري أوفيس. كن مميزًا لفتح الأنشطة الأخرى على لوحة التحكم.<br>لمزيد من المعلومات ، يرجى الرجوع إلى عروضنا بالتفصيل في قسم "الأدوات> الاشتراك".
message.plan.usedspace = مساحة تخزين غير كافية. الرجاء مراجعة قسم "المستندات" لتحرير مساحة جديدة.
message.plan.post = تم الوصول إلى الحد الأقصى لعدد المنتجات. استشر خطة اشتراكك لمعرفة المزيد.
message.plan.user = تم الوصول إلى الحد الأقصى لعدد المستخدمين. استشر خطة اشتراكك لمعرفة المزيد.
message.plan.agent = تم الوصول إلى الحد الأقصى لعدد المديرين. استشر خطة اشتراكك لمعرفة المزيد.
message.plan.works = تم الوصول إلى الحد الأقصى لعدد عمليات الإنجاز. استشر خطة اشتراكك لمعرفة المزيد.
