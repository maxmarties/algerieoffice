txt.help.case1.1 = لا يزال متوفرا على ألجيري أوفيس. يوفر معلومات تفصيلية عن الموقع، وهذا يشمل قسم الأسئلة الشائعة لتسهيل الأمر عليك. في مركز المساعدة، ستجد أيضًا قواعد المعرفة الخاصة بنا، والتي تدمج معلومات قيمة حول كيفية استخدام الحلول التي نقدمها في ألجيري أوفيس.
