txt.infos.privacy1.1 = إشعار ملفات تعريف الارتباط
txt.infos.privacy1.2 = يستخدم موقعنا ولوحات المعلومات ملفات تعريف الارتباط. من خلال الاستمرار في تصفح الموقع ، فإنك توافق على استخدام ملفات تعريف الارتباط وفقًا للشروط المقدمة من قبلنا
txt.infos.privacy1.3 = قبول وإغلاق
txt.infos.privacy1.4 = تخصيص
txt.infos.privacy2.1 = الاستخدام المسؤول لبياناتك
txt.infos.privacy2.1.1 = يستخدم ألجيري أوفيس ملفات تعريف الارتباط لتحسين تجربتك عند تصفح الموقع. من بين ملفات تعريف الارتباط هذه ، يتم تخزين ملفات تعريف الارتباط المصنفة حسب الضرورة على متصفحك لأنها ضرورية لتشغيل الوظائف الأساسية لموقع الويب.
txt.infos.privacy2.1.2 = نستخدم أيضًا ملفات تعريف الارتباط الخاصة بطرف ثالث والتي تساعدنا في تحليل وفهم كيفية استخدامك لهذا الموقع. لن يتم تخزين ملفات تعريف الارتباط هذه في متصفحك إلا بموافقتك.
txt.infos.privacy2.1.3 = لديك أيضًا خيار إلغاء تنشيط ملفات تعريف الارتباط هذه. لكن تعطيل بعض ملفات تعريف الارتباط هذه قد يكون له تأثير على تجربة التصفح لديك.
txt.infos.privacy2.2.1 = الضرورية
txt.infos.privacy2.2.2 = تعد ملفات تعريف الارتباط الضرورية ضرورية للغاية للتشغيل السليم للموقع. تتضمن هذه الفئة فقط ملفات تعريف الارتباط التي تضمن الوظائف الأساسية وميزات الأمان لموقع الويب. لا تخزن ملفات تعريف الارتباط هذه أي معلومات شخصية.
txt.infos.privacy2.2.3 = دائما متاح
txt.infos.privacy2.3.1 = غير الضرورية
txt.infos.privacy2.3.2 = لا تتداخل ملفات تعريف الارتباط غير الضرورية مع عرض الموقع وتستخدم خصيصًا لجمع البيانات الشخصية من المستخدمين من خلال التحليلات والإعلانات والمحتويات الأخرى المضمنة. لا يلزم تفعيلها للاستفادة الكاملة من هذا الموقع.
txt.infos.privacy2.3.2.1 = التفضيلات
txt.infos.privacy2.3.2.2 = التحليلات
txt.infos.privacy2.3.2.3 = المعلنين
txt.infos.privacy2.3.2.4 = الطرف الثالث
txt.infos.privacy2.4 = اضبط كل تفضيلاتك للحفظ والمتابعة.
