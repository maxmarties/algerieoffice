txt.infos.mention1 = حقوق المؤلف
txt.infos.mention1.1 = جميع المعلومات ، وكذلك جميع العناصر الموجودة في الموقع ، هي ملك لألجيري أوفيس أو شركائه والكيانات التابعة له وتخضع لقوانين حماية حقوق النشر. لا يجوز عمل نسخ من الموقع كله أو جزء منه إلا للحصول على معلومات وعلى وجه الحصر للاستخدام الخاص. يحظر أي استنساخ أو تمثيل كل أو جزء من الموقع لأغراض أخرى. لا يتم منح أي ترخيص أو أي حق بخلاف استشارة الموقع والمعلومات التي يحتويها لأي شخص فيما يتعلق بحقوق الملكية الفكرية.
txt.infos.mention1.2 = محرر الموقع
