txt.help.case1.1.2.1 = إذا كنت بحاجة إلى مزيد من المساعدة ، فإن موظفينا المطلعين متاحون للإجابة على أي أسئلة فنية والإجابة على مشكلات حسابك. اكتب إلينا على
txt.help.case1.1.2.2 = موظفونا متاحون من 9:00 صباحًا حتى 5:00 مساءً من الأحد إلى الخميس (يشمل صباح السبت).
