txt.infos.mention1.3.6 = وفقًا لقانون حماية البيانات ، يحق لك الوصول إلى المعلومات المتعلقة بك عن طريق الكتابة إلى المكتب الرئيسي لألجيري أوفيس. هذه المعلومات مخصصة لألجيري أوفيس ويمكن معالجتها إلكترونيًا.
txt.infos.mention1.4 = البريد الالكتروني
txt.infos.mention1.4.1 = لأي طلب يتعلق بنشر بياناتك.
txt.infos.mention1.4.2 = لأي طلب آخر.
txt.infos.mention1.5 = حقوق النشر
txt.infos.mention1.5.1 = إن AlgerieOffice و algerieoffice.net علامتان تجاريتان مسجلتان من قبل Rinitec Développement®.
txt.infos.mention1.5.2 = يرفض ألجيري أوفيس وشركاؤه رسمياً أي مسؤولية عن محتوى المواقع التي يقدمون روابط لها. يتم تقديم هذه الروابط لمستخدمي الموقع أو مواقع الويب لشركائه والكيانات التابعة له كخدمة. يعود قرار تفعيل الروابط حصريًا إلى المستخدمين.
txt.infos.mention1.5.3 = من الممكن إنشاء رابط إلى موقع دون إذن صريح من الناشر ، بشرط أن يفتح هذا الرابط نافذة متصفح جديدة. ومع ذلك ، يحتفظ ألجيري أوفيس بالحق في طلب إزالة الرابط الذي يعتبره غير متوافق مع سياسته التحريرية.
txt.infos.mention2.1 = اتفاقية ملفات تعريف الارتباط
txt.infos.mention2.1.1 = تنطبق سياسة الخصوصية وملفات تعريف الارتباط هذه على جميع زوار ومستخدمي الموقع.
txt.infos.mention2.2 = ما هو ملف تعريف الارتباط؟
txt.infos.mention2.2.1 = ملف تعريف الارتباط هو ملف صغير يتم إرساله بواسطة موقع تمت زيارته إلى متصفحك ويتم تخزينه على جهازك الطرفي (جهاز كمبيوتر ، أو جهاز لوحي ، أو هاتف ذكي ، وما إلى ذلك) بناءً على طلب الخادم الذي يدير هذا الموقع. يحتوي على معلومات حول التنقل الذي تم على صفحات الموقع. يسهل الاستخدام اللاحق للموقع من قبل نفس الشخص عن طريق حفظ تفضيلاتهم.
txt.infos.mention2.2.2 = لا تسمح ملفات تعريف الارتباط التي نستخدمها بالتعرف عليك ، لكنها تسجل المعلومات بناءً على استخدامك لموقعنا ، لتذكر تفضيلات البحث ، أو حتى تزيد من صلة الإعلانات المعروضة.
txt.infos.mention2.2.3 = تتيح لنا ملفات تعريف الارتباط أيضًا تطوير خدماتنا من خلال إنشاء إحصائيات وأحجام حركة الضهور من أجل تحسين الاهتمام بخدماتنا وبيئة العمل.
txt.infos.mention2.2.4 = ومع ذلك ، فإن ملفات تعريف الارتباط الخاصة بألجيري أوفيس لا تحتوي مباشرة على أي معلومات شخصية عنك. لا يمكن لملف تعريف الارتباط جمع معلومات حول نظام المستخدم.
txt.infos.mention2.2.5 = يمكن لكل موقع ويب إرسال ملفات تعريف الارتباط الخاصة به إذا سمحت تفضيلات المستعرض بذلك ، ولكن لا يمكن لأي موقع ويب إزالة وإعادة كتابة ملفات تعريف الارتباط إلا التي تنتمي إليه.
txt.infos.mention2.3 = أنواع ملفات تعريف الارتباط المختلفة
txt.infos.mention2.3.1 = يستخدم موقع ألجيري أوفيس ملفات تعريف ارتباط مختلفة
txt.infos.mention2.3.1.1 = ملفات تعريف الارتباط الأساسية
txt.infos.mention2.3.1.2 = هذه هي ملفات تعريف الارتباط التي لا غنى عنها للتشغيل السليم لموقع ألجيري أوفيس. بدون ملفات تعريف الارتباط هذه ، لن تعمل بعض ميزات الموقع. لا تخزن ملفات تعريف الارتباط هذه أي معلومات شخصية في الذاكرة يمكن استخدامها لأغراض التسويق.
txt.infos.mention2.3.2.1 = ملفات تعريف الارتباط التحليلية
txt.infos.mention2.3.2.2 = هذه هي ملفات تعريف الارتباط التي تجعل من الممكن تحسين أداء موقعنا ومراقبة أدائه. المعلومات التي يتم جمعها بواسطة ملفات تعريف الارتباط هذه مجهولة المصدر وتستخدم فقط للأغراض الإحصائية.
txt.infos.mention2.3.3.1 = ملفات تعريف الارتباط الوظيفية
txt.infos.mention2.3.3.2 = هذه هي ملفات تعريف الارتباط التي تسمح للموقع بتذكر الخيارات التي تقوم بها عند التصفح وتسمح لك بتقديم ميزات مخصصة. المعلومات التي يتم جمعها بواسطة ملفات تعريف الارتباط هذه مجهولة المصدر. لا تتبع ملفات تعريف الارتباط أنشطة التصفح الخاصة بك على مواقع الويب الأخرى.
txt.infos.mention2.3.4.1 = ملفات تعريف الارتباط الإعلانية
txt.infos.mention2.3.4.2 = هذه هي ملفات تعريف الارتباط التي تسمح لك بتقديم إعلانات أكثر تخصيصًا لما يثير اهتمامك وأكثر تخصيصًا. لا يمكن لملفات تعريف الارتباط هذه التعرف شخصيًا على مستخدم الإنترنت.
txt.infos.mention2.3.5.1 = ملفات تعريف ارتباط الطرف الثالث
txt.infos.mention2.3.5.2 = هذه هي ملفات تعريف الارتباط المثبتة بواسطة موقع ويب مختلف عن موقع ألجيري أوفيس. قد يكون هذا هو الحال ، على سبيل المثال ، مع مشاركة ملفات تعريف الارتباط على الشبكات الاجتماعية ، أو مع تحليلات جوجل. لا يحفظ موقع ألجيري أوفيس ملفات تعريف الارتباط من مواقع الطرف الثالث هذه. يجب عليك بعد ذلك الانتقال إلى موقع ويب الطرف الثالث للحصول على مزيد من المعلومات حول ملفات تعريف الارتباط التي يخزنها وكيفية إدارتها. ومع ذلك ، يسمح لك المستعرض بحظر ملفات تعريف الارتباط وبيانات موقع الطرف الثالث إذا كنت ترغب في ذلك.
txt.infos.mention2.3.6 = يمكن أن تكون هذه الأنواع الخمسة من ملفات تعريف الارتباط إما ملفات تعريف ارتباط للجلسة أو ملفات تعريف ارتباط دائمة.
txt.infos.mention2.3.6.1 = ملف تعريف ارتباط الجلسة
txt.infos.mention2.3.6.2 = يستمر فقط أثناء جلسة التصفح ، ويتم حذفه عند إغلاق المتصفح.
txt.infos.mention2.3.7.1 = ملف تعريف ارتباط دائم
txt.infos.mention2.3.7.2 = تم تثبيته لفترة محددة. تظل ملفات تعريف الارتباط هذه في الجهاز حتى تنتهي صلاحيتها أو حتى يتم حذفها من ذاكرة التخزين المؤقت للكمبيوتر.
txt.infos.mention2.4 = قبول أو رفض ملفات تعريف الارتباط
txt.infos.mention2.4.1 = عندما تدخل إلى موقعنا ، يتم عرض رسالة حتى نتمكن من وضع ملف تعريف ارتباط على جهازك. في أي وقت ، يمكنك تغيير اختيارك من خلال إعدادات المتصفح الخاص بك.
txt.infos.mention2.4.2 = نذكرك أنه من المرجح أن تقوم الإعدادات بتعديل شروط الوصول إلى خدماتنا التي تتطلب استخدام ملفات تعريف الارتباط. إذا تم تكوين متصفحك لرفض جميع ملفات تعريف الارتباط ، فلن تتمكن من الوصول إلى حسابك عبر الإنترنت ، على سبيل المثال.
txt.infos.mention2.4.3 = تسمح لك معظم المتصفحات بإدارة ملفات تعريف الارتباط الخاصة بك. يمكنك ضبط متصفحك على رفض أو حذف بعض ملفات تعريف الارتباط. عادة ، يمكنك أيضًا التعامل مع تقنيات مماثلة بنفس الطريقة ، باستخدام المستعرضات الخاصة بك.
txt.infos.mention2.5 = توضح لك الروابط التالية كيفية تعيين ملفات تعريف الارتباط وفقًا للمتصفحات
