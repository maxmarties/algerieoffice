txt.infos.chart1 = Charter of good practices and rules for the distribution of advertisements
txt.infos.chart1.1 = Article 1 - Definitions
txt.infos.chart1.1.1.1 = User
txt.infos.chart1.1.1.2 = User of the sponsored spaces module of AlgerieOffice (designer and editor of the ad and/or b2b campaign).
txt.infos.chart1.1.2.1 = Advert
txt.infos.chart1.1.2.2 = Advertising written by the user and published on companies pages thanks to the module.
txt.infos.chart1.1.3.1 = B2b campaign
txt.infos.chart1.1.3.2 = Commercial offer to be promoted by the user on companies dashboards using the module.
txt.infos.chart1.1.4.1 = Sponsored space
txt.infos.chart1.1.4.2.1 = The ad is composed of a title of sixty (60) characters maximum, a text of one hundred and fifty (150) characters maximum and an action button whose title is chosen by the user in a dropdown list of choices. The user chooses the number of displays that he wishes to reach for the advertisement among a choice of a number that display which corresponds to a price. After prior moderation by AlgerieOffice, the advertisement is published and remains online until the determined number of postings is reached.
txt.infos.chart1.1.4.2.2 = The b2b campaign consists of a title of one hundred and fifty (150) characters maximum in the form of a link to the offer to promote with an indication of its type (product, service, call for tenders, b2b ad, research of a distributor, search for subcontractors, provision of services, or event). The user chooses the level of clicks he wishes to achieve for the b2b campaign from a choice of a number of clicks which corresponds to a price. After validation by our teams, the campaign is published and remains online until the determined click-through level is reached.
txt.infos.chart1.1.5.1 = Recipient
txt.infos.chart1.1.5.2 = Anyone likely to have access to the ad and/or the b2b campaign, regardless of whether or not they are part of the target audience and whether or not they click on the ad (or b2b campaign).
txt.infos.chart1.2 = Article 2 - Purpose
txt.infos.chart1.2.1 = The purpose of this Charter is to define the best practices with which the user undertakes to comply with regard to publication on the "sponsored space" module.
txt.infos.chart1.2.2 = It is precise, what the user understands, recognizes and accepts, that the reminders to the rules contained in this Charter are not exhaustive and that the user is required to inform himself in particular about the advertising regime applicable to his profession as well as than the product or service he wishes to advertise through the ad.
txt.infos.chart1.2.3 = In this context, before any publication, the user undertakes to comply scrupulously with this Charter as well as all the legislative and regulatory provisions applicable to each specific case.
txt.infos.chart1.3 = Article 3 - Moderation
txt.infos.chart1.3.1 = The user is informed and accepts that all announcements are moderated by AlgerieOffice before any publication, without being bound by any deadline.
txt.infos.chart1.3.2 = The user declares that he understands and accepts that the acceptance or rejection of an advertisement is appreciated by AlgerieOffice according to the criteria of its publication policy.
txt.infos.chart1.3.3 = The user whose ad has been rejected by AlgerieOffice receives an email explaining the reasons and inviting him to modify his ad.
txt.infos.chart1.4 = Article 4 - Guarantees & liability
txt.infos.chart1.4.1 = The user recognizes and accepts that AlgerieOffice is only a simple intermediary between the user and the recipients. The responsibility of AlgerieOffice can not be sought for the content of an advertisement.
txt.infos.chart1.4.2 = The user is informed, recognizes and accepts that any breach of this Charter as well as any infringement or suspicion of infringement entail the immediate deletion without notice of the advertisement, without any right to compensation.
txt.infos.chart1.5 = Article 5 - Intellectual property and image rights
txt.infos.chart1.5.1 = The user is informed that AlgerieOffice does not tolerate any fraudulent or unauthorized use of content protected by copyright. In this context, the user solemnly undertakes to use in his advertisement only texts, images, photographs and/or any other content whose intellectual property rights belong to him or for which he has received an operating license.
txt.infos.chart1.5.2 = The user also undertakes to respect the image rights of any person possibly represented on the advertisement, and to obtain his prior written consent.
txt.infos.chart1.6 = Article 6 - Regulated advertising
txt.infos.chart1.6.1 = Advertisements are regulated, for example, in the areas of public health (alcohol, tobacco, vaping, drugs, pharmaceutical companies) or even financial products.
txt.infos.chart1.6.2 = The user declares that he understands and accepts that AlgerieOffice cannot be fully aware of all the specific advertising regimes.
txt.infos.chart1.6.3 = The user is required to know and comply with all the rules applicable to his profession and to the products and services he wishes to advertise.
txt.infos.chart1.7 = Article 7 - Severability
txt.infos.chart1.7.1 = If one of the articles of this Charter turns out to be null or unenforceable by virtue of a law or a regulation or following a court decision, the other articles will retain all their force and scope.
txt.infos.credit1 = Take advantage of the very latest generation of tools thanks to an agile technical team attentive to new developments on the market. Your AlgerieOffice solution, built with the most advanced and secure technologies.
txt.infos.credit1.1 = Back-end: Foolproof performance
txt.infos.credit1.1.1 = Java is an object-oriented programming language used to develop web applications. Java has become the standard for developing business applications, and is often chosen for large, complex projects. Java is cross-platform and works under Unix and Windows environment.
txt.infos.credit1.1.2 = AlgerieOffice develop its server side (backend) via the SpringBoot framework based on the Java development language.
txt.infos.credit1.1.3 = Java is one of the languages used by the big names on the web to form the basis of their application infrastructures. Google, Twitter and other Amazon trust Java for security and performance.
txt.infos.credit1.2 = Front-end: Interactive interfaces for a better user experience
txt.infos.credit1.2.1 = The client side (front-end) at AlgerieOffice is developed with ReactJS, the most popular web and mobile front-end language. React helps create attractive and interactive user interfaces, making it the perfect solution for great user experience, thus improving user satisfaction.
txt.infos.credit1.2.2 = React is a JavaScript library created by Facebook that allows you to develop a professional-looking user interface, independent of the back-end technology stack.
txt.infos.credit1.3 = Model: Flexible and ultra-fast deployment for scalable web applications
txt.infos.credit1.3.1 = The AlgerieOffice data model is administered by the PostgreSQL system which is based on the non-blocking procedural language. Lightweight and efficient, it is particularly suitable for applications having to manage large volumes of data in real time and on distributed devices.
txt.infos.credit1.3.2 = PostgreSQL's asynchronous system allows multiple read requests to be processed simultaneously, saving considerable time. It is particularly appreciated in terms of performance for data insertion operations and index creation.
