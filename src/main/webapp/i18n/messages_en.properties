txt.help.case1.1.1 = Your account dashboard allows you to manage interactions with the companies you contact, AlgerieOffice members, your settings and more. Take this short guided tour to learn about the main console menus.
txt.help.case1.1.2.1 = If you need further assistance, our knowledgeable staff are available to answer any technical questions and answer your account issues. Write to us at
txt.help.case1.1.2.2 = Our staff members are available from 9:00 am - 5:00 pm from Sunday to Thursday (Saturday morning included).
txt.help.case1.1.3 = If you need an answer immediately, we offer online support via the "Live Chat Support" button at the top of every page. Our moderators volunteer their time to answer your questions regarding the site, as well as to manage and resolve your conflicts within the next 36 hours.
txt.help.case1.2 = We love to hear from our users, so naturally we offer several ways for you to get in touch. To report a problem, make a suggestion or just to say hello, you can use one of our support channels listed below
txt.help.case1.2.1 = If you are on Facebook, Twitter, Linkedin or Youtube, you can find us here
txt.help.case1.2.2 = For all inquiries by commercial companies, please contact
txt.help.case1.2.3 = Need to get in touch by post ?
txt.help.case2.2.1 = Welcome to your dashboard! This is the screen that you will see when you connect to your company, and which gives you access to all of AlgerieOffice's management features. Take this short guided tour to get to know the main administration menus.
txt.help.case2.2.2 = Let's get your business up and running in minutes. We offer you the steps to create your business page on AlgerieOffice. When you have completed these steps, your page will be ready and configured. So it's up to you !
