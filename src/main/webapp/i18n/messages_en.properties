txt.infos.condition1.2 = Purpose and acceptance of the GCU
txt.infos.condition1.2.1 = The purpose of the GCU is to define the conditions under which orders placed by customers are carried out, regardless of the type of order, in particular by internet on the site, by telephone or by any other means, and the supply of services by AlgerieOffice to clients. These GCU are supplemented by the conditions specific to each service.
