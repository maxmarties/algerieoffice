txt.infos.mention2.1 = Cookies policy
txt.infos.mention2.1.1 = This privacy and cookie policy applies to all visitors and users of the website.
txt.infos.mention2.2 = What is a cookie ?
txt.infos.mention2.2.1 = A cookie is a small file sent by a visited site to your browser and stored on your terminal (computer, tablet, smartphone, etc.) at the request of the server managing this site. It contains information on the navigation carried out on the pages of the site. It facilitates subsequent use of the site by the same person by saving their preferences.
txt.infos.mention2.2.2 = The cookies that we use do not allow you to be identified, but they record information based on your use of our site, to remember search preferences, or even increase the relevance of the advertisements displayed.
txt.infos.mention2.2.3 = Our cookies also make it possible to develop our services by establishing statistics and attendance volumes in order to improve the interest and ergonomics of our services.
txt.infos.mention2.2.4 = However, AlgerieOffice cookies do not, in any case, directly contain personal information about you. The cookie cannot collect information about the user's system.
txt.infos.mention2.2.5 = Each website can send its own cookies if browser preferences allow it, but a website can only remove and rewrite cookies that belong to it.
txt.infos.mention2.3 = The different types of cookies
txt.infos.mention2.3.1 = The AlgerieOffice website uses different cookies
txt.infos.mention2.3.1.1 = Essential cookies
txt.infos.mention2.3.1.2 = these are cookies which are essential for the proper functioning of the AlgerieOffice website. Without these cookies, certain features of the site would not work. These cookies do not store any personal information in memory that could be used for marketing purposes.
txt.infos.mention2.3.2.1 = Analytical cookies
txt.infos.mention2.3.2.2 = these are cookies that make it possible to improve the functioning of our site, and to monitor its performance. The information collected by these cookies is anonymous and is used only for statistical purposes.
txt.infos.mention2.3.3.1 = Functional cookies
txt.infos.mention2.3.3.2 = these are cookies that allow the site to remember the choices you make when browsing and allow you to offer personalized features. The information collected by these cookies is anonymous. These cookies do not track your browsing activities on other websites.
txt.infos.mention2.3.4.1 = Advertising cookies
txt.infos.mention2.3.4.2 = these are cookies that allow you to present advertisements that are more tailored to what interests you and are more personalized. These cookies cannot personally identify the Internet user.
txt.infos.mention2.3.5.1 = Third party cookies
txt.infos.mention2.3.5.2 = these are cookies installed by a website different from that of AlgerieOffice. This may be the case, for example, with sharing cookies on social networks, or with Google analytics. The AlgerieOffice site does not save cookies from these third-party sites. You must then go to the third party's website for more information on the cookies it stores and how to manage them. However, the browser allows you to block cookies and third-party site data if you wish.
txt.infos.mention2.3.6 = These five types of cookies can be either session cookies or permanent cookies.
txt.infos.mention2.3.6.1 = A session cookie
txt.infos.mention2.3.6.2 = only persists during the browsing session, it is deleted when the browser is closed.
txt.infos.mention2.3.7.1 = A permanent cookie
txt.infos.mention2.3.7.2 = is installed for a fixed period. These cookies remain in the device until they expire or until they are deleted from the computer cache.
txt.infos.mention2.4 = Acceptance or refusal of cookies
txt.infos.mention2.4.1 = When you access our site, a message is displayed so that we can place a cookie on your terminal. At any time, you can change your choice through your browser settings.
txt.infos.mention2.4.2 = We remind you that the settings are likely to modify your conditions of access to our services requiring the use of cookies. If your browser is configured to refuse all cookies, you will not be able to access your online account, for example.
txt.infos.mention2.4.3 = Most browsers allow you to manage your cookies. You can set your browser to refuse or delete certain cookies. Usually, you can also handle similar technologies in the same way, using your browser's.
txt.infos.mention2.5 = The following links show you how to set cookies according to browsers
