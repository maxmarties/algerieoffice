txt.infos.condition1.5.2 = AlgerieOffice reserves the right to refuse or cancel any order from a customer with whom there is a dispute relating to a previous order or who does not comply with the conditions required to place an order, without the latter being able to claim any indemnity.
txt.infos.condition1.6 = Guarantee - Liability
