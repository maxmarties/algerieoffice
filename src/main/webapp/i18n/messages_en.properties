txt.infos.condition2.3 = Cookies
txt.infos.condition2.3.1 = The site uses cookies. A cookie is a small text file placed on the customer's terminal, mainly used to facilitate navigation on the site and to identify the customer when he connects to his account. The customer has the option of accepting or rejecting cookies. Most web browsers automatically accept cookies, but the customer can usually change their browser settings to refuse them. The customer is informed that if he refuses cookies, he will not be able to access certain services and in particular services requiring the identification of the customer.
txt.infos.faq = Frequently asked general questions and inquiries.
txt.infos.faq1 = Account
txt.infos.faq1.1.1 = How to create my account ?
txt.infos.faq1.1.2 = The creation of an account is free on AlgerieOffice. All you have to do is click on the "Connection/Registration" menu button at the top right of the site. Click on "Create an account" and complete the registration form.<br>Once your account is created, an email is sent to you to verify the email address entered and confirm your registration. You must validate the creation of your account to be able to connect.
txt.infos.faq1.2.1 = I created an account, but I did not receive a validation email
txt.infos.faq1.2.2 = Remember to check your junk mail. It may happen that the validation email arrives with a certain delay.<br>A message at the bottom of the page allows you to request the sending of the validation email again. If, despite this, you still have not received a validation email within 24 hours after your account creation or after your request again, please contact us.
txt.infos.faq1.3.1 = I created an account, but I cannot log in
txt.infos.faq1.3.2 = You must validate the creation of your account from the confirmation email which was sent to the email address entered.<br>When you click on the validation button in the email, the mention "Your account has been validated successfully "or" Your account is already validated "must appear at the top of the AlgerieOffice home page.
txt.infos.faq1.4.1 = How can I log into my account ?
txt.infos.faq1.4.2 = To connect to your account, simply click on the "Connection/Registration" menu button at the top right of the site. Click on "Login" and enter your email and password to connect with your login or connect with your social account (facebbok, google, linkedin).<br>To disconnect, simply click on your profile at the top right then click on the "Logout" button.
txt.infos.faq1.5.1 = I forgot my login details
txt.infos.faq1.5.2 = If you forget your password, go to the login page for your account. Click on the link "Forgot your password ?" and enter the email address provided when registering. You will then receive, by email, a link valid for 24 hours which will allow you to renew your password.<br>If you have also forgotten the login email address, please contact us. 
txt.infos.faq1.6.1 = I cannot log into my account. My username and password are correct
txt.infos.faq1.6.2 = Please check your email to see if your account has been flagged as suspicious or restricted. In case of violation of the T & Cs, your account can be closed. If you already had an account on AlgerieOffice with a violation, your new account may be restricted or closed.<br>If you think you have been reported in error, please contact us.
txt.infos.faq1.7.1 = How do I change my password or my personal information ?
txt.infos.faq1.7.2 = To modify your password or your personal information, go to your account, under "My account" then in the "Connection information" section and you can modify your information.
txt.infos.faq1.8.1 = How do I change my details ?
txt.infos.faq1.8.2 = From your AlgerieOffice account, you can modify your details from the "My account" section "Contact details".
txt.infos.faq1.9.1 = Report an account
txt.infos.faq1.9.2 = To report an account, go to their profile page, click on the three dots in the upper right corner and select "Report User".
txt.infos.faq1.10.1 = Delete your account
txt.infos.faq1.10.2 = Go to the "Settings" section "General" section from your account and click on the "Permanently close your account" link. Your account will be deleted and you will receive a confirmation e-mail.<br>If you are an operator creating a company active on AlgerieOffice, you must proceed with the deletion of your company page in order to be able to delete your account afterwards. Once deleted, your account cannot be restored and you must create a new one. You receive a confirmation email upon successful deletion of your account.
txt.infos.faq1.11.1 = Email settings and verification
txt.infos.faq1.11.2 = A verified email address will allow you to receive important system notifications, reset your password, and receive updates to your account.<br>You can change your email notification preferences at any time by logging into your account, accessing your "Notifications" page, "Settings" section and adjusting your notifications.
txt.infos.faq1.12.1 = What is AlgerieOffice's cookie policy ?
txt.infos.faq1.12.2 = To ensure the best possible experience on our site, AlgerieOffice uses different types of cookies: cookies essential for your navigation, traffic cookies to measure the audience and third-party or publisher cookies to offer you content adapted to your centers of interest.<br>To delete your cookies, do not hesitate to consult the procedure in force according to your browser on the page of our legal notices.
txt.infos.faq1.13.1 = How can I access my personal data ?
txt.infos.faq1.13.2 = In accordance with legal obligations, you have the right to access information concerning you by writing to the head office of AlgerieOffice. This information is intended for AlgerieOffice and may be subject to computer processing.
txt.infos.faq1.14.1 = Terms of use
txt.infos.faq1.14.2 = We are updating our general conditions of use in order to simplify the operation of AlgerieOffice services for our users.
txt.infos.faq1.15.1 = What happens if I do not accept the GCU ?
txt.infos.faq1.15.2 = If you do not agree to the terms of use, you should remove your content and stop using our services.
txt.infos.faq2 = Company
txt.infos.faq2.1.1 = How do I add my company ?
txt.infos.faq2.1.2 = The registration of your company on AlgerieOffice is free. If you are new to AlgerieOffice, you just have to click on the "Connection/Registration" menu button at the top right of the site. Click on "Add my company" and follow the registration process in 4 easy steps.<br>Otherwise, if you already have an account on AlgerieOffice, from your account click on the button "Add my company" at the top of the sidebar of your dashboard. You just have to fill in the requested information.
txt.infos.faq2.2.1 = I registered my company but I cannot find it in the search results
txt.infos.faq2.2.2 = Only companies validated by our team of moderators will be visible on our site. To make your company accessible to the public, you must send a request for validation of its identity from the administration console of your company by providing the necessary information requested. <br> Any request for validation must be justifying the real existence of a company. In case of doubt, we reserve the right to ask for documents justifying that it is indeed the manager of the company, namely a proof of identity of the manager and an extract of the RC of the company. the team does its utmost to ensure that validation requests are processed within one working day. As soon as your request has been processed by our services, you will be informed by notification.
txt.infos.faq2.3.1 = How do I add information about my company ?
txt.infos.faq2.3.2 = Thanks to the free registration of your company on our site, you benefit from a control space (Administration console) which allows you to manage your content. You are then free to update your company page and publish your offers as you wish.<br>However, any modification to the identity of the company implies sending a new validation request.
txt.infos.faq2.4.1 = Can I add authors to my company ?
txt.infos.faq2.4.2 = Yes, you have the option of associating users with your company who will also be able to connect to the administration console of your page. For this, you just need to create a new user from your console, "Users" section, or invite a user already registered on the site.<br>You then define his role, where each role has these specificities and rights access. For example, a user with an "Editor" role can add, edit or delete content, but cannot add a user or access settings. You can find more information on user roles on the "Add a user" page of your console.
txt.infos.faq2.5.1 = How to search for a company ?
txt.infos.faq2.5.2 = The search is carried out on all the pages of the site from the search box located at the top of the pages. The research is carried out on the denomination, the commercial name, the key words, the address and the name of the leaders. You can also refine your search by accessing the advanced search page which will allow you to use filters on specific fields.
txt.infos.faq2.6.1 = Can I put a company under alert ?
txt.infos.faq2.6.2 = If you wish to be informed of changes that could occur on one or more companies, you have the option of placing them under alert. Add the companies you want to your network and find them in your account, "My network" section "Companies" section.<br>For each company, you can activate the alert button. When this is green, the alert is recorded. You will then receive an alert by notification and/or by email at each development of the company: publication of a news, modification of an announcement, publication of an event, ... etc.<br>You can stop your monitoring whenever you want by clicking on the alert button again. 
txt.infos.faq2.7.1 = How to refine my targeting ?
txt.infos.faq2.7.2 = You just need to apply the different filters available to you to refine your selection: business sector, geographic area, workforce or the type of establishment ... you define the types of businesses you want to target. The more precise your targeting, the more relevant your selection will be.
txt.infos.faq2.8.1 = What do the graphics correspond to ?
txt.infos.faq2.8.2 = They allow you to visualize in the form of a graph the distribution of the companies registered on the site according to certain criteria such as the date of creation, the size of the companies, the prospecting channels ...<br>The graphs adjust according to the research page consulted: sector of activity, profession, city ... to allow you to analyze in detail the extent of your prospecting.
txt.infos.faq2.9.1 = What is "My potential" ?
txt.infos.faq2.9.2 = "My potential" indicates the number of establishments corresponding to your search criteria. It adjusts as you target to give you an overview of the volume of your selection.
txt.infos.faq2.10.1 = What is Detect ?
txt.infos.faq2.10.2 = Detect is a solution that allows you to identify visitors to your business page in real time.
txt.infos.faq2.11.1 = How to find identified visitors ?
txt.infos.faq2.11.2 = From your company's administration console, "Dashboard" section, access the "Detect" section to see the details of identified visitors. A minimum "Regular" subscription must be active on your company to be able to benefit from the Detection solution.<br>For more details, do not hesitate to consult the page of our offers.
txt.infos.faq2.12.1 = I have more visits than identified visitors, how is this possible ?
txt.infos.faq2.12.2 = Having more visits than identified visitors is quite possible and normal. This difference can have 2 possibilities: an identified visitor can be at the origin of several visits, or an anonymous visitor who cannot be identified.<br>Note that an operator of a company will not be counted as a visit on his page.
txt.infos.faq2.13.1 = Do you have a special need ?
txt.infos.faq2.13.2 = If you have a specific need that you cannot address through our online module, do not hesitate to use the feature request form from your account.
txt.infos.faq3 = الاشتراك
txt.infos.faq3.1.1 = Why subscribe ?
txt.infos.faq3.1.2 = Subscribing to our services gives you exclusive access to paid content and allows you to benefit from advanced features. Depending on the offer you select, the configurations of your platform will vary.<br>AlgerieOffice regularly publishes new features.
txt.infos.faq3.2.1 = How to subscribe ?
txt.infos.faq3.2.2 = To subscribe to our services, nothing could be simpler ! Go to your company's administration console, "Tools" section, "Subscription" section and select the offer of your choice among the four offered. Each of these passes gives you specific advantages.
txt.infos.faq3.3.1 = I am an individual, can I subscribe to your services ?
txt.infos.faq3.3.2 = No, our paid services are intended only for professionals. All our services offered to individuals are free. You can use the platform as an individual unlimited without the need to have subscribed to a subscription.
txt.infos.faq3.4.1 = I have several operators registered with my company, do I need a subscription for each operator ?
txt.infos.faq3.4.2 = No, a subscription concerns only one company, all the operator users of the company benefit from this subscription.<br>All the operators of a company can access the same administration console, where the content is shareable between them, including the active subscription in question.
txt.infos.faq3.5.1 = What are the payment options available ?
txt.infos.faq3.5.2 = There is only one payment method available on our site, your purchases can be paid via a CCP mandate and then send us the transfer slip using the payment form available for each service on the site.<br>We are sorry that we cannot provide other means of payment due to difficulties and unavailability of the implementation of electronic payment APIs in Algeria !
txt.infos.faq3.6.1 = How to modify a subscription ?
txt.infos.faq3.6.2 = It is not possible to modify a current subscription. However, if you want to change your pass, all you need to do is take out a new subscription. A calculation is then applied to add the new subscription with the existing subscription, the result of which is upgraded to the chosen pass.
txt.infos.faq3.7.1 = What are the advantages of a Premium subscription ?
txt.infos.faq3.7.2 = Thanks to the services available in the premium pass, you can manage your activity, consult unlimited requests for quotes, identify your visitors, analyze your performance, etc. For more details, do not hesitate to consult the page of our offers.
txt.infos.faq4 = Publicity
txt.infos.faq4.1.1 = How do I create my publicity ?
txt.infos.faq4.1.2 = Nothing's easier ! To create your ad, go to your company's administration console, "Marketplace" section, "Premium ads" section and let yourself be guided. In just 3 steps, you will have created your personalized advertisement. We advise you to consult our charter of good practices, the distribution rules before creating your advertisement. <br> Similarly, from the "Campaigns" section, you can start a B2B campaign to promote your offers to companies from your choice.
txt.infos.faq4.2.1 = Who will see my ad ? Can I target my audience ?
txt.infos.faq4.2.2 = Several options are available to you. You can choose to broadcast your ad to all visitors to AlgerieOffice or display it to an audience that you target based on two criteria: industry, geographic area. Targeting your prospects well allows you to optimize the display volume generated by your advertising.
txt.infos.faq4.3.1 = Where does my ad appear ?
txt.infos.faq4.3.2 = Your advertisement will be displayed in a reserved space at the top of each company page for a premium advertisement (company dashboard for a b2b campaign), in the Home tab. Your advertising will be displayed on companies matching your selections.
txt.infos.faq4.4.1 = What happens if there are several of us who want to display the same ad in the same place ?
txt.infos.faq4.4.2 = In the event that several advertisements meet the same distribution criteria, a principle of fair rotation will be applied. Each ad will be shown once before starting a new ad rotation.
txt.infos.faq4.5.1 = Can I create multiple ads at the same time ?
txt.infos.faq4.5.2 = You can create as many ads as you want, there is no limit! You can then manage your advertisements as you wish, by adjusting your budgets, your targeting and your pauses.<br>Remember to vary the message, the target, the button texts to give more force to each one of your advertisements. You will also be able to compare your ads and see the characteristics of the one that works best for reuse.
txt.infos.faq4.6.1 = How to select a budget different from those proposed ?
txt.infos.faq4.6.2 = It is not possible to select a budget other than those proposed. However, you have the option to add more budget whenever you want.
txt.infos.faq4.7.1 = How can I pay for my advertising ?
txt.infos.faq4.7.2 = You can pay for your advertising via a CCP mandate and then send us the transfer slip using the corresponding form on our site.
txt.infos.faq4.8.1 = I have just validated my advertising and paid but it is not displayed yet, why ?
txt.infos.faq4.8.2 = All advertisements are moderated by our teams before they are put online, in order to ensure compliance with the distribution rules and the benevolence of the content. We do our best to meet a deadline of one working day before validation and posting of your advertising.
txt.infos.faq4.9.1 = How long does it take to moderate an ad ?
txt.infos.faq4.9.2 = To guarantee you a quality service, our team of moderators does their utmost to respect a moderation period of one working day.<br>To check the conformity of your ad, you can consult our distribution rules.
txt.infos.faq4.10.1 = Why has my advertisement not been validated by your teams ?
txt.infos.faq4.10.2 = If your advertisement has not been validated by our teams, the reason for the refusal must have been explained to you in the email you received.<br>In all cases, make sure that the content of your advertisement complies with our distribution rules and remember to check that the link embedded in this advertisement works. Once your ad has been corrected, validate it so that our teams can moderate it again.
txt.infos.faq4.11.1 = Can I click on my ad to check that everything is working fine ?
txt.infos.faq4.11.2 = Of course ! Like any visitor to AlgerieOffice, you can click on your advertisement. However, we cannot differentiate you from a typical visitor by clicking on the ad, so you are using one click from your budget. 
txt.infos.faq4.12.1 = Where can I track the performance of my advertising ?
txt.infos.faq4.12.2 = You can view your ad performance from the same authoring section on your admin console. From this page, you can also decide to update your ads and add budgets.
txt.infos.faq4.13.1 = How often are my statistics updated ?
txt.infos.faq4.13.2 = In order to ensure optimal monitoring, the statistics of your advertisements are updated in real time.
txt.infos.faq4.14.1 = I notice that I have a lot of displays but few clicks on my ad, what should I do ?
txt.infos.faq4.14.2 = This means that your ad is showing to a wide audience but the content does not entice visitors to click enough. In this case, we advise you to modify the title, the text or the caption of the button.<br>You can proceed by step and modify each of these elements one by one, leaving a few days between two modifications to see which it is the most efficient.
txt.infos.faq4.15.1 = I notice that I have few displays but a good click-through rate on my ad, what should I do ?
txt.infos.faq4.15.2 = This means that your ad is building well and getting visitors to click, but your target audience is not large enough. To increase your display rate, we advise you to broaden your target defined in the first steps of creating your ad.
txt.infos.faq4.16.1 = Can I modify my advertisement after it has been uploaded ?
txt.infos.faq4.16.2 = Of course ! You can change your advertising and/or targeting at any time from your console.
txt.infos.faq4.17.1 = Are there any rules to follow when writing an advertisement ?
txt.infos.faq4.17.2 = Indeed, all advertising must respect the legal constraints to be validated during moderation.<br>Remember to consult our charter of best practices before writing your advertisement.
txt.infos.faq5 = Marketplace
txt.infos.faq5.1.1 = What is a marketplace ?
txt.infos.faq5.1.2 = A marketplace is an online site that connects a multitude of buyers and sellers from the same industry. The objective is to develop transactions between these actors.
txt.infos.faq5.2.1 = What is an e-procurement platform ?
txt.infos.faq5.2.2 = An e-procurement platform is a digital tool for your business. Its role is to facilitate the management of the entire acquisition process. It brings together all the suppliers and becomes the central access point for all your employees or all your subsidiaries.
txt.infos.faq5.3.1 = What are the differences between an e-commerce site, marketplace, or even a dropshipping platform ?
txt.infos.faq5.3.2 = All three are online platforms whose main objective is to accommodate the completion of transactions between sellers and buyers. The only difference is in the presence of users (buyers and sellers) and the way they act.
txt.infos.faq5.3.2.1 = On e-commerce sites, we can identify a single seller, facing a multitude of buyers. As an example for this type of platform, we can cite moo.com or quill.com.
txt.infos.faq5.3.2.2 = Marketplaces bring together a large number of sellers and a large number of buyers. This is the case, for example, for Amazon Business. Each of the transactions can connect a buyer to a new seller.
txt.infos.faq5.3.2.3 = The dropshipping platform is a kind of marketplace with a number of buyers and sellers. But, buyers will be in contact with only one seller, who will act as an intermediary. This particular seller that we can call a "dropshipper" handles all transactions between buyers and sellers, while not dealing with inventory. These will be managed by the end sellers, who will be in charge of deliveries.
txt.infos.faq5.4.1 = What is AlgerieOffice ?
txt.infos.faq5.4.2 = AlgerieOffice is a marketplace solution to develop your online business by creating new relationships and transactions between buyers and sellers in the same sector.<br>AlgerieOffice is also an e-procurement solution designed to facilitate the management of supplies in the within your company.
txt.infos.faq5.5.1 = Why AlgerieOffice describes itself as a white label solution ?
txt.infos.faq5.5.2 = Companies that create their marketplace with AlgerieOffice will have the possibility to define their own user experience by modifying a certain number of elements. We also give everyone the opportunity to choose the url of the marketplace.
txt.infos.faq5.6.1 = What is the business model for AlgerieOffice ?
txt.infos.faq5.6.2 = AlgerieOffice's business model is very simple and takes into account the financial well-being of its clients. In fact, it is based on a fixed monthly fee with no commission or additional set-up costs.<br>This guarantees our clients a certain stability and a comfortable vision over the long term.
txt.infos.faq5.7.1 = What does the acronym Saas stand for ? And why is it beneficial to use this type of solution ?
txt.infos.faq5.7.2 = AlgerieOffice differs from other solutions because we really aim to offer you the best that can benefit your business as quickly as possible.
txt.infos.faq5.7.2.1 = Saas mode: Our platform will constantly see improvements and you will be able to regularly benefit from new features that will benefit your business.
txt.infos.faq5.7.2.2 = All-in-one solution: AlgerieOffice integrates the three interfaces (front-office, middle-office, back-office) necessary for the good management of a market place or an e-procurement platform.
txt.infos.faq5.8.1 = How is the catalog structured in the AlgerieOffice solution ?
txt.infos.faq5.8.2 = AlgerieOffice offers the best system of classification and categorization of products and/or services for a marketplace or an e-procurement platform. We use a PIM (product information management) to centralize and manage all the data around the products.
txt.infos.faq5.9.1 = Does the solution offer an operator/vendor interface ?
txt.infos.faq5.9.2 = In order to facilitate the use of the solution, 3 interfaces are available: a font-office for the end customer, a middle-office for the sellers and a back-office for the operators. 
txt.infos.faq5.10.1 = How does the internal messaging service work to manage after-sales service, questions or others ?
txt.infos.faq5.10.2 = AlgerieOffice has developed an integrated secure messaging system to facilitate contacts between users in real time. Quotation requests and contacts with a company can be shared between its moderators.
