txt.infos.politic3.2 = How AlgerieOffice implements the protection of personal data ?
txt.infos.politic3.2.1 = AlgerieOffice undertakes to take into account the protection of personal data from the design of the services offered to you (Privacy by design). To ensure security and guarantee the respect and the proper exercise of your rights, measures to ensure the protection of personal data are implemented (Privacy by default).
txt.infos.politic3.3 = What data is collected and used by AlgerieOffice ?
txt.infos.politic3.3.1 = AlgerieOffice undertakes to collect only data strictly necessary for the objective for follow-up and clarification with the persons concerned, leaving them full capacity to exercise their rights. The personal data that may be collected, depending on the nature of the services provided, are as follows
txt.infos.politic3.3.1.1 = Last name and first name
