txt.infos.condition1.4.3 = The customer undertakes to provide exact and complete information on his identity, his contact details and other information which would be requested by AlgerieOffice. He undertakes to update them without delay on the site in the event of any modification, by means of his account. He will be solely responsible for the consequences of the inaccuracy of the information provided. It is strictly forbidden to usurp the identity of a third party.
