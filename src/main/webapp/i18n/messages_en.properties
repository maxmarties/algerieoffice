txt.infos.condition1.2.3 = AlgerieOffice reserves the right to modify the GCU and the special conditions at any time, in particular so that they always reflect the functionalities of the services in the event of changes. Unless otherwise stipulated in the special conditions, the version of the GCU and the special conditions applicable to an order are those in force when the customer places an order.
