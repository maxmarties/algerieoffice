txt.help.begginer0 = Create your business page
txt.help.begginer0.1 = Your business is already created on our site ! You will be able to add content, organize your data, manage interactions and develop your business creation on the platform.
txt.help.begginer1 = Add your company logo
txt.help.begginer1.1 = 30 seconds
txt.help.begginer1.2 = Give visibility to your Page by adding your company logo. Pages with a profile picture generally attract more visits. You revitalize your brand image.
txt.help.begginer1.3 = Overview > Page header
txt.help.begginer2 = Describe the presentation of your company
txt.help.begginer2.1 = 3 to 5 minutes
txt.help.begginer2.2 = The presentation of your business is arguably the most important section of your page because it is the gateway for the majority of your visitors. You must therefore present your activity without putting all the content, you can add other sections in the relative locations later.
txt.help.begginer2.3 = Overview > Presentation
txt.help.begginer3 = Complete your legal information
txt.help.begginer3.1 = 1 to 2 minutes
txt.help.begginer3.2 = Promote your customers or users who identify with your company. A feeling of belonging is formed little by little and allows you to create a bond of trust to retain your customers.
txt.help.begginer3.3 = Company Profile > Legal information
txt.help.begginer4 = Fill in the keywords that highlight your business
txt.help.begginer4.1 = 1 to 2 minutes
txt.help.begginer4.2 = Develop the visibility of your business page in search results and on the web more generally. Your page moves up to the top positions on targeted keywords that people can type in to find you easily.
txt.help.begginer4.3 = Company Profile > Semantic fields
txt.help.begginer5 = Indicate your opening hours
txt.help.begginer5.1 = 30 seconds
txt.help.begginer5.2 = Encourage consumers to visit your offline point of sale through your page and/or ensure continuous access to your services by indicating the opening hours of your business.
txt.help.begginer5.3 = Company Profile > Contact details
txt.help.begginer6 = Embed a map
txt.help.begginer6.1 = 2-3 minutes
txt.help.begginer6.2 = Share your location on the google map in your company page and help the AlgerieOffice community to find you easily.
txt.help.begginer6.3 = Company Profile > Location
txt.help.begginer7 = Promote your website
txt.help.begginer7.1 = 2 to 3 minutes
txt.help.begginer7.2 = The website is often one of the first elements that your future customer or user will see of your business, your products and services. Refer your site to our platform and generate more qualified traffic.
txt.help.begginer7.3 = Company Profile > Semantic fields
txt.help.begginer8 = Declare your social networks
txt.help.begginer8.1 = 2 to 3 minutes
txt.help.begginer8.2 = In order to have a stronger online presence, index your social networks on your page and vice versa.
txt.help.begginer8.3 = Company Profile > Semantic fields
txt.help.begginer9 = Add a photo album
txt.help.begginer9.1 = 2 to 3 minutes
txt.help.begginer9.2 = Promote your product catalog or your business in a targeted manner. This can help complete your presentation or achieve a specific goal.
txt.help.begginer9.3 = Overview > Photo album
txt.help.begginer10 = Create a panorama
txt.help.begginer10.1 = 3 à 5 minutes
txt.help.begginer10.2 = Highlight products or news with a panorama of images on your page. You thus design an aesthetic presentation, but which especially adapted to your targets, your activity, and your business constraints.
txt.help.begginer10.3 = Overview > Panorama
txt.help.begginer11 = Describe the president's word
txt.help.begginer11.1 = 1 à 3 minutes
txt.help.begginer11.2 = Leave a word for your visitors by aiming to present and promote your activity in a targeted manner.
txt.help.begginer11.3 = Overview > President's word
txt.help.begginer12 = Add your key figures
txt.help.begginer12.1 = 2 to 5 minutes
txt.help.begginer12.2 = At a glance, present your business with some key figures.
txt.help.begginer12.3 = Overview > In a few numbers
txt.help.begginer13 = Add a product or service
txt.help.begginer13.1 = 2 to 4 minutes
txt.help.begginer13.2 = Promoting your products and/or services online means opening up to the national or even global market. Your catchment area has no limit and allows you to expand your customer base. You can therefore make sales 24/7.
txt.help.begginer13.3 = Products & Services > Add
txt.help.begginer14 = Organize your products with categories
txt.help.begginer14.1 = 4 to 6 minutes
txt.help.begginer14.2 = Your page must be rigorously organized so that it is attractive enough to attract visitors, you must remember to structure it well by creating various categories (and subcategories) that will classify your offers in a simple and logical way.
txt.help.begginer14.3 = Products & Services > Categories
txt.help.begginer15 = Publish a news
txt.help.begginer15.1 = 1 to 3 minutes
txt.help.begginer15.2 = Working on your image can also allow you to justify your positioning against the competition. Communicate your news with your contacts to inform them of your news, your promotions, or the contents of your site.
txt.help.begginer15.3 = Wallet > News
txt.help.begginer16 = Present your Timeline
txt.help.begginer16.1 = 4 to 8 minutes
txt.help.begginer16.2 = Work on your brand image perceived by your targets by presenting your professional background with key dates.
txt.help.begginer16.3 = Overview > Timeline
txt.help.begginer17 = Add a leader
txt.help.begginer17.1 = 2 to 4 minutes
txt.help.begginer17.2 = Declare the operational leaders of your company in order to develop the mapping of the workers on your company page.
txt.help.begginer17.3 = Users > Leaders
txt.help.begginer18 = Add partner
txt.help.begginer18.1 = 2 to 4 minutes
txt.help.begginer18.2 = A satisfied customer is the best advertisement for you. Retain your partners to recruit new ones and develop your advertising strategy.
txt.help.begginer18.3 = Wallet > Partners
txt.help.begginer19 = Add a project
txt.help.begginer19.1 = 3 to 6 minutes
txt.help.begginer19.2 = Use your achievements to develop a strong brand image by making your business identifiable and memorable in the mind of the customer.
txt.help.begginer19.3 = Wallet > Achievements
