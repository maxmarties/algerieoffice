txt.infos.politic3.3.1.4 = E-mail adress
txt.infos.politic3.3.1.5 = Position held
txt.infos.politic3.3.1.6 = IP adress
txt.infos.politic3.3.2 = In the event that optional data is requested from you, AlgerieOffice will clearly inform you about the personal data necessary for the performance of the service.
txt.infos.politic3.3.3 = Personal data is collected directly from you and is only used for the purposes that have been brought to your attention.
txt.infos.politic3.4 = What is the basis for the legitimacy of the processing carried out by AlgerieOffice ?
txt.infos.politic3.4.1 = AlgerieOffice relies on the following legitimate bases in order to be able to process personal data
txt.infos.politic3.4.1.1 = Execution of the contract
txt.infos.politic3.4.1.2 = When the legal basis for the processing of the user's personal data that is collected is the performance of the contract. In this regard, the user is obliged to provide the data necessary for its execution.
txt.infos.politic3.4.2.1 = Legal obligations
txt.infos.politic3.4.2.2 = When the holding, collection and use of personal data is a legal obligation for the data subject.
txt.infos.politic3.4.3.1 = Consent
txt.infos.politic3.4.3.2 = With regard to the following purposes, the legal basis for the processing of the user's personal data will be the user's consent, if he has given it.
txt.infos.politic3.4.3.2.1 = Management of registration on companies pages.
txt.infos.politic3.4.3.2.2 = Management of the sending of information on the products and services of the company and its partners.
txt.infos.politic3.4.3.2.3 = Response to the exercise of the rights of access, modification, cancellation and opposition, as well as questions and complaints from the user.
txt.infos.politic3.4.3.2.4 = Connection in order to respond to requests for information expressed through our forms.
txt.infos.politic3.4.3.2.5 = Transmission of contact details to third parties (connection, response to a need expressed through a campaign, etc.).
txt.infos.politic3.4.4 = The withdrawal of consent for these treatments by the user will not condition the execution of the contract for the provision of information concluded by the person concerned with AlgerieOffice.
txt.infos.politic3.5 = Are my personal data protected ?
txt.infos.politic3.5.1 = AlgerieOffice undertakes to take all measures to ensure the security and confidentiality of personal data and in particular to prevent them from being damaged, erased or that unauthorized third parties have access to them.
txt.infos.politic3.5.2 = In addition, in the event of a security incident affecting your personal data (destruction, loss, alteration or disclosure), AlgerieOffice undertakes to comply with the obligation to notify personal data breaches.
txt.infos.politic4.1 = Modification of this policy
txt.infos.politic4.2 = Updates to this privacy policy will be published on the AlgerieOffice website. We will also post a notice on the site along with the updated privacy policy.
